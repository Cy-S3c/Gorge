<script>
(function(){
var GORGE = {"meta": {"version": "0.1.0", "totalCategories": 22, "totalTypes": 133, "totalSubtypes": 665, "scope": "WEB APP"}, "categories": [{"id": "CAT-01", "slug": "cat-01", "name": "Injection Attacks", "severity": "CRITICAL", "typeCount": 15, "types": ["SQL Injection", "NoSQL Injection", "OS Command Injection", "SSTI", "LDAP Injection", "XPath Injection", "EL / OGNL Injection", "XML Injection", "CRLF / HTTP Header Injection", "Code Injection", "ORM Injection", "JSON Injection", "HTML Injection", "SMTP / Email Header Injection", "Prompt Injection"], "content": "<div align=\"center\">\n\n![CAT-01](https://img.shields.io/badge/CAT--01-Injection%20Attacks-cc0000?style=for-the-badge&labelColor=0d0d0d)\n\n</div>\n\n![CRITICAL](https://img.shields.io/badge/Severity-CRITICAL-cc0000?style=flat-square&labelColor=1a1a1a)\n![Types](https://img.shields.io/badge/Attack%20Types-15-333333?style=flat-square&labelColor=1a1a1a)\n![Subtypes](https://img.shields.io/badge/Subtypes-90%2B-555555?style=flat-square&labelColor=1a1a1a)\n![OWASP](https://img.shields.io/badge/OWASP-A05%3A2025-222222?style=flat-square&labelColor=cc0000)\n![CWE](https://img.shields.io/badge/CWE-89%20%7C%2090%20%7C%2078%20%7C%2094%20%7C%20917-333333?style=flat-square&labelColor=1a1a1a)\n\n# CAT-01: Injection Attacks\n\n> **Domain:** Web Application · **Phase:** 1 · **CAPEC Category:** Inject Unexpected Items\n\n---\n\n## Category Overview\n\nInjection attacks occur when untrusted, attacker-controlled data is sent to an interpreter — a database engine, OS shell, LDAP server, template engine, XML parser, or any other component that evaluates input as code or a command. The interpreter cannot distinguish between the intended instruction and the injected content, executing both.\n\nThe fundamental precondition for all injection vulnerabilities is the same: **user-controlled data is concatenated into a query, command, or expression without sufficient sanitization, parameterization, or contextual escaping.** The interpreter is working as designed — the vulnerability is in how the application constructs the input to that interpreter.\n\nInjection vulnerabilities appear in virtually every interpreted technology layer of a web application: the database tier (SQL, NoSQL, ORM), the server OS (command injection), directory services (LDAP), XML/XPath processing, server-side templating, expression language evaluation, and increasingly in AI/LLM pipelines (prompt injection). The impact ranges from data exfiltration and authentication bypass to full remote code execution and complete system compromise.\n\n**Why it persists:** Developer trust of user input remains pervasive in legacy codebases, ORMs create false confidence, and WAF bypass techniques continuously outpace signature-based defenses. Injection was #1 on the OWASP Top 10 for over a decade and remains in the top 5 in 2025.\n\n---\n\n## Attack Surface Map\n\n```mermaid\ngraph TD\n    USER[User / Attacker Input] --> FORMS[HTML Forms]\n    USER --> PARAMS[URL Parameters]\n    USER --> HEADERS[HTTP Headers]\n    USER --> COOKIES[Cookies]\n    USER --> JSON[JSON / XML Body]\n    USER --> WSOCK[WebSocket Messages]\n\n    FORMS & PARAMS & HEADERS & COOKIES & JSON & WSOCK --> APP[Web Application]\n\n    APP --> SQL[SQL Engine]\n    APP --> NOSQL[NoSQL Engine]\n    APP --> OS[Operating System Shell]\n    APP --> LDAP[LDAP Directory]\n    APP --> XPATH[XPath / XML Parser]\n    APP --> TMPL[Template Engine]\n    APP --> EL[Expression Language]\n    APP --> LLM[LLM / AI Model]\n\n    SQL --> |SQLi| SQLI[Data theft · Auth bypass · RCE via xp_cmdshell]\n    NOSQL --> |NoSQLi| NOSQLI[Auth bypass · Data exfiltration]\n    OS --> |CMDi| CMDI[RCE · Reverse shell · Full system compromise]\n    LDAP --> |LDAPi| LDAPI[Auth bypass · Directory enumeration]\n    XPATH --> |XPathi| XPATHI[Data extraction · Auth bypass]\n    TMPL --> |SSTI| SSTII[RCE · Config read · Reverse shell]\n    EL --> |ELi| ELI[RCE via OGNL · Spring SpEL]\n    LLM --> |Prompt Inj| PROMPTI[Goal hijack · Data exfiltration · Jailbreak]\n```\n\n---\n\n## Attack Types in This Category\n\n| ID | Attack Type | Key CWEs | Subtypes | Severity | Coverage |\n|----|------------|---------|---------|---------|---------|\n| [SQLi](./SQLi/README) | SQL Injection | CWE-89 | 12 | ![CRITICAL](https://img.shields.io/badge/-CRITICAL-cc0000?style=flat-square) | 🟡 In Progress |\n| [NoSQLi](./NoSQLi/README) | NoSQL Injection | CWE-943 | 5 | ![CRITICAL](https://img.shields.io/badge/-CRITICAL-cc0000?style=flat-square) | 🔲 Planned |\n| [Command-Injection](./Command-Injection/README) | OS Command Injection | CWE-78 | 5 | ![CRITICAL](https://img.shields.io/badge/-CRITICAL-cc0000?style=flat-square) | 🔲 Planned |\n| [SSTI](./SSTI/README) | Server-Side Template Injection | CWE-94, CWE-1336 | 9 | ![CRITICAL](https://img.shields.io/badge/-CRITICAL-cc0000?style=flat-square) | 🔲 Planned |\n| [LDAP-Injection](./LDAP-Injection/README) | LDAP Injection | CWE-90 | 4 | ![HIGH](https://img.shields.io/badge/-HIGH-cc5500?style=flat-square) | 🔲 Planned |\n| [XPath-Injection](./XPath-Injection/README) | XPath Injection | CWE-643 | 3 | ![HIGH](https://img.shields.io/badge/-HIGH-cc5500?style=flat-square) | 🔲 Planned |\n| [EL-OGNL](./EL-OGNL/README) | EL / OGNL Injection | CWE-917 | 5 | ![CRITICAL](https://img.shields.io/badge/-CRITICAL-cc0000?style=flat-square) | 🔲 Planned |\n| [XML-Injection](./XML-Injection/README) | XML Injection | CWE-91 | 4 | ![HIGH](https://img.shields.io/badge/-HIGH-cc5500?style=flat-square) | 🔲 Planned |\n| [CRLF-Injection](./CRLF-Injection/README) | CRLF / HTTP Header Injection | CWE-93, CWE-113 | 4 | ![HIGH](https://img.shields.io/badge/-HIGH-cc5500?style=flat-square) | 🔲 Planned |\n| [Code-Injection](./Code-Injection/README) | Code Injection | CWE-94, CWE-95 | 5 | ![CRITICAL](https://img.shields.io/badge/-CRITICAL-cc0000?style=flat-square) | 🔲 Planned |\n| [ORM-Injection](./ORM-Injection/README) | ORM Injection | CWE-89 | 4 | ![HIGH](https://img.shields.io/badge/-HIGH-cc5500?style=flat-square) | 🔲 Planned |\n| [JSON-Injection](./JSON-Injection/README) | JSON Injection | CWE-74 | 4 | ![MEDIUM](https://img.shields.io/badge/-MEDIUM-cc8800?style=flat-square) | 🔲 Planned |\n| [HTML-Injection](./HTML-Injection/README) | HTML Injection | CWE-79, CWE-80 | 3 | ![MEDIUM](https://img.shields.io/badge/-MEDIUM-cc8800?style=flat-square) | 🔲 Planned |\n| [SMTP-Injection](./SMTP-Injection/README) | SMTP / Email Header Injection | CWE-93 | 4 | ![MEDIUM](https://img.shields.io/badge/-MEDIUM-cc8800?style=flat-square) | 🔲 Planned |\n| [Prompt-Injection](./Prompt-Injection/README) | AI / LLM Prompt Injection | CWE-1427 | 6 | ![HIGH](https://img.shields.io/badge/-HIGH-cc5500?style=flat-square) | 🔲 Planned |\n\n---\n\n## Universal Injection Pattern\n\nAll injection attacks share the same structural vulnerability:\n\n```\nVULNERABLE:\nquery = \"SELECT * FROM users WHERE id = \" + userInput\n→ userInput = \"1 OR 1=1--\"\n→ query = \"SELECT * FROM users WHERE id = 1 OR 1=1--\"  ← Logic altered\n\nSECURE:\nquery = \"SELECT * FROM users WHERE id = ?\"\nexecute(query, [userInput])\n→ userInput is data, never code — interpreter separation maintained\n```\n\nThe specific interpreter (SQL, OS, LDAP, template) changes the syntax. The vulnerability class is identical.\n\n---\n\n## Detection Heuristics (All Injection Types)\n\n| Probe Type | Payload Pattern | Indicator |\n|-----------|----------------|-----------|\n| Error-based | `'`, `\"`, `)`, `` ` `` | Interpreter error in response |\n| Boolean differential | `AND 1=1`, `AND 1=2` | Different response content |\n| Time-based | `SLEEP(5)`, `WAITFOR DELAY` | Delayed response |\n| Out-of-band | DNS/HTTP callback payloads | External request received |\n| Syntax probe | `{{7*7}}`, `${7*7}`, `<%= 7*7 %>` | `49` in response (SSTI/EL) |\n\n---\n\n## Common Attack Surface\n\n**High-Risk Input Vectors for Injection:**\n\n```\nGET /search?q=[INJECT]\nGET /item?id=[INJECT]\nPOST /login  →  username=[INJECT] & password=[INJECT]\nPOST /api/v1/users  →  {\"filter\": \"[INJECT]\"}\nCookie: session=[INJECT]\nUser-Agent: [INJECT]\nX-Forwarded-For: [INJECT]\nReferer: [INJECT]\n```\n\n**Second-Order Injection Contexts:**\nData stored in one request and executed in another. Registration forms, profile fields, import features, and log viewers are common second-order injection sinks.\n\n---\n\n## Injection by Interpreter\n\n<details>\n<summary><b>SQL — Database Engines</b></summary>\n\n| Engine | Characteristic Syntax | Time Delay | Comment |\n|--------|----------------------|-----------|---------|\n| MySQL | `SLEEP(N)`, `-- -` | `SLEEP(5)` | `#` comment also works |\n| PostgreSQL | `pg_sleep(N)`, `--` | `pg_sleep(5)` | Stacked queries with `;` |\n| MSSQL | `WAITFOR DELAY`, `--` | `WAITFOR DELAY '0:0:5'` | `xp_cmdshell` for RCE |\n| Oracle | `dbms_pipe.receive_message` | `dbms_pipe.receive_message(('a'),5)` | No stacked queries |\n| SQLite | `randomblob(N)` | `randomblob(500000000)` | Limited OOB options |\n\n</details>\n\n<details>\n<summary><b>SSTI — Template Engines by Language</b></summary>\n\n| Engine | Language | Probe | RCE Payload Pattern |\n|--------|----------|-------|-------------------|\n| Jinja2 | Python | `{{7*7}}` | `{{''.__class__.__mro__[1].__subclasses__()}}` |\n| Twig | PHP | `{{7*7}}` | `{{_self.env.registerUndefinedFilterCallback('exec')}}` |\n| Freemarker | Java | `${7*7}` | `<#assign ex=\"freemarker.template.utility.Execute\"?new()>` |\n| Velocity | Java | `#set($x=7*7)$x` | Reflection-based RCE |\n| Smarty | PHP | `{php}phpinfo();{/php}` | Direct PHP execution (legacy) |\n| Pebble | Java | `{{7*7}}` | Java reflection chains |\n| ERB | Ruby | `<%= 7*7 %>` | `<%= system('id') %>` |\n| Handlebars | Node.js | `{{7*7}}` | Prototype pollution chains |\n\n</details>\n\n---\n\n## Prevention — Universal Principles\n\n1. **Parameterized Queries / Prepared Statements** — for all database interactions\n2. **Contextual Output Encoding** — HTML, JS, URL, CSS context-aware escaping\n3. **Input Validation** — allowlist approach for known-good values\n4. **Principle of Least Privilege** — database accounts with minimal permissions\n5. **WAF as defense-in-depth** — never as primary control\n6. **ORM safely** — avoid raw query methods (`executeQuery`, `$where`, `eval`)\n7. **Sandboxed template engines** — no user-controlled template content\n\n---\n\n## References\n\n### Primary Standards\n- [OWASP — Injection (A05:2025)](https://owasp.org/Top10/2025/A05_2025-Injection/)\n- [OWASP WSTG — Testing for Injection](https://owasp.org/www-project-web-security-testing-guide/latest/4-Web_Application_Security_Testing/07-Input_Validation_Testing/)\n- [CWE-74: Improper Neutralization of Special Elements in Output](https://cwe.mitre.org/data/definitions/74.html)\n- [CAPEC-152: Inject Unexpected Items](https://capec.mitre.org/data/definitions/152.html)\n\n### Deep Research\n- [PortSwigger — SQL Injection](https://portswigger.net/web-security/sql-injection)\n- [PortSwigger — Server-Side Template Injection](https://portswigger.net/research/server-side-template-injection)\n- [PayloadsAllTheThings — Injection](https://github.com/swisskyrepo/PayloadsAllTheThings)\n"}, {"id": "CAT-02", "slug": "cat-02", "name": "Broken Access Control", "severity": "CRITICAL", "typeCount": 8, "types": ["IDOR", "Path / Directory Traversal", "Privilege Escalation", "Forced Browsing", "Missing Function Level Access Control", "Parameter Tampering", "Mass Assignment", "Open Redirect"], "content": "<div align=\"center\">\n\n![CAT-02](https://img.shields.io/badge/CAT-02-Broken%20Access%20Control-cc0000?style=for-the-badge&labelColor=0d0d0d)\n\n</div>\n\n![Severity](https://img.shields.io/badge/Severity-CRITICAL-cc0000?style=flat-square&labelColor=1a1a1a)\n![OWASP](https://img.shields.io/badge/OWASP-A01%3A2025-222222?style=flat-square&labelColor=cc0000)\n![Status](https://img.shields.io/badge/Status-Planned-555555?style=flat-square&labelColor=1a1a1a)\n\n# CAT-02: Broken Access Control\n k pattern IDs |\n| **CWE** | Weakness IDs per subtype |\n| **CVSS v3.1** | Base scores where applicable |\n| **MITRE ATT&CK** | TTP mappings (where applicable) |\n\n---\n\n## For AI Agents\n\nEvery subtype page contains a machine-readable JSON metadata block:\n\n```json\n{\n  \"id\": \"WEB-CAT01-SQLi-BlindBoolean\",\n  \"category\": \"Injection Attacks\",\n  \"type\": \"SQL Injection\",\n  \"subtype\": \"Boolean-Based Blind SQLi\",\n  \"cwe\": [\"CWE-89\"],\n  \"capec\": [\"CAPEC-7\"],\n  \"cvss_base\": 9.8,\n  \"severity\": \"CRITICAL\",\n  \"owasp_top10_2025\": \"A05\",\n  \"skill_level\": \"intermediate\",\n  \"tags\": [\"sqli\", \"blind\", \"boolean\", \"database\", \"injection\"]\n}\n```\n\nThe [Taxonomy](Taxonomy) page provides the complete enumeration in JSON format for programmatic consumption.\n\n---\n\n## Contributing & Quality Standard\n\nAll content must:\n- Be sourced from primary technical references (no marketing blogs)\n- Include working payloads tested against known-vulnerable environments\n- Reference real CVEs or bug bounty reports where applicable\n- Follow the [subtype page template](Templates/TEMPLATE-Subtype)\n\n---\n\n<div align=\"center\">\n\n![Last Updated](https://img.shields.io/badge/Last%20Updated-2025-333333?style=flat-square&labelColor=1a1a1a)\n![License](https://img.shields.io/badge/License-MIT-555555?style=flat-square&labelColor=1a1a1a)\n![Research](https://img.shields.io/badge/For-Research%20%26%20Education-cc0000?style=flat-square&labelColor=1a1a1a)\n\n</div>\n", "about": "<div align=\"center\">\n\n![About](https://img.shields.io/badge/GORGE-About%20This%20Project-cc0000?style=for-the-badge&labelColor=0d0d0d)\n\n</div>\n\n---\n\n## What This Is\n\nGORGE is a structured, research-grade vulnerability database focused exclusively on **application security**. It is built for depth, not breadth of surface coverage. Every topic receives focused research before a single page is written.\n\n**Core principles:**\n- One topic at a time. Quality and depth over speed.\n- Primary sources only — CVEs, academic papers, bug bounty writeups, original PoCs.\n- No marketing content. No \"Top 10 tips\" padding. No AI-generated filler.\n- Every payload is real. Every tool command is tested or sourced from confirmed writeups.\n- All content is verifiable — every claim has a reference.\n\n---\n\n## Scope\n\n### Phase 1 — Web Application Security\n22 attack categories covering the full modern web attack surface. Based on cross-referencing:\n- OWASP Top 10:2025\n- OWASP Web Security Testing Guide (WSTG) 4.2\n- CAPEC Mechanisms of Attack taxonomy\n- MITRE CWE database\n- PortSwigger Web Security Research (2019–2025)\n- Real-world bug bounty reports (HackerOne, Bugcrowd disclosures)\n\n### Phase 2 — Mobile Application Security *(Planned)*\nCovering iOS and Android attack surfaces:\n- OWASP Mobile Top 10\n- MASTG (Mobile Application Security Testing Guide)\n- Runtime manipulation, certificate pinning bypass, IPC attacks\n\n---\n\n## How Pages Are Structured\n\nEvery attack subtype page follows an identical schema:\n\n```\nOverview → Attack Surface → How It Works → Detection & Validation\n→ Techniques (Beginner → Advanced) → Tools → Payload Crafting\n→ Exploitation → Variations → Real-World Examples\n→ Defenses → References → AI Metadata Block\n```\n\nThis consistency is intentional — it makes every page usable as a structured data source for AI agents and as a learning progression for humans.\n\n---\n\n## Skill Level Framework\n\nContent within each page is depth-stratified:\n\n| Level | Description | Who it's for |\n|-------|-------------|-------------|\n| **Foundational** | Core concept, basic detection, standard tool usage | New to the topic |\n| **Intermediate** | WAF bypass, manual exploitation, chaining | Practicing researcher |\n| **Advanced** | Novel techniques, edge cases, protocol-level | Senior researcher |\n| **Elite** | Cutting-edge (2023–2025 research), 0-day patterns | CTF / Red team |\n\n---\n\n## For AI Agents\n\nEvery subtype page ends with a structured JSON metadata block inside a `<details>` tag:\n\n```json\n{\n  \"id\": \"WEB-CAT01-SQLi-BlindBoolean\",\n  \"schema_version\": \"1.0\",\n  \"category_id\": \"CAT-01\",\n  \"category\": \"Injection Attacks\",\n  \"type\": \"SQL Injection\",\n  \"subtype\": \"Boolean-Based Blind SQLi\",\n  \"cwe\": [\"CWE-89\"],\n  \"capec\": [\"CAPEC-7\"],\n  \"owasp_top10_2025\": \"A05\",\n  \"wstg_id\": \"WSTG-INPV-05\",\n  \"cvss_base\": 9.8,\n  \"severity\": \"CRITICAL\",\n  \"requires_auth\": false,\n  \"skill_level\": \"intermediate\",\n  \"attack_surface\": [\"web\", \"api\"],\n  \"impact\": [\"confidentiality\", \"integrity\", \"availability\"],\n  \"detection_difficulty\": \"medium\",\n  \"exploitation_difficulty\": \"medium\",\n  \"tags\": [\"sqli\", \"blind\", \"boolean\", \"database\", \"injection\"]\n}\n```\n\nThe full taxonomy with all IDs is available in machine-readable format at [Taxonomy](Taxonomy).\n\n---\n\n## Source Quality Standards\n\nReferences are classified and must meet:\n\n| Type | Standard |\n|------|----------|\n| **Technical Blogs** | Must be from a named researcher, include PoC or technical mechanism |\n| **Writeups** | Must be from an official disclosure or named researcher |\n| **Research Papers** | Peer-reviewed or from a recognized conference (DEF CON, Black Hat, USENIX, CCS, IEEE S&P) |\n| **YouTube** | Must be from a technical channel — not a beginner tutorial overview |\n| **CVEs** | Must link to NVD entry + at least one technical analysis |\n\nMarketing blogs, vendor \"what is X\" summaries, and uncited claims are never used.\n\n---\n\n## Payload Policy\n\nFull, working payloads are included for all attack subtypes. This database is intended for:\n- Security researchers conducting authorized penetration tests\n- CTF players\n- Developers building secure applications\n- AI agents assisting in security research\n\nUse responsibly. Unauthorized testing is illegal.\n\n---\n\n## Version & Update Policy\n\nSee [CHANGELOG](CHANGELOG) for the full update history.\n\nNew attack subtypes are researched and written one at a time. Existing pages are updated when:\n- A new technique variant is published (CVE, PortSwigger research, conference talk)\n- A new tool with significant capability is released\n- An existing payload or technique is demonstrated to be outdated\n", "taxonomy": "<div align=\"center\">\n\n![Taxonomy](https://img.shields.io/badge/GORGE-Attack%20Taxonomy-333333?style=for-the-badge&labelColor=0d0d0d)\n\n</div>\n\n# GORGE Attack Taxonomy\n\n> Machine-readable + human-readable attack taxonomy for Web Application Security.\n> Schema version: 1.0 | Last updated: 2025\n\n---\n\n## Taxonomy Principles\n\nThis taxonomy is built from cross-referencing:\n- **OWASP Top 10:2025** — risk categories\n- **CAPEC** — Mechanisms of Attack hierarchy (View → Category → Meta → Standard → Detailed)\n- **CWE** — Weakness classification per attack\n- **OWASP WSTG 4.2** — test case IDs\n- **Real-world attack intelligence** (PortSwigger Research 2019–2025, bug bounty disclosures)\n\nHierarchy: `Domain → Category → Type → Subtype`\n\n---\n\n## Full Taxonomy: Web Application\n\n<details>\n<summary><b>Expand Full Human-Readable Taxonomy</b></summary>\n\n### CAT-01 · Injection Attacks · CRITICAL\n- **SQLi** — Classic, Union, Error, Boolean Blind, Time Blind, OOB, Second-Order, Stacked, JSON/XML context, ORM\n- **NoSQLi** — MongoDB operator injection, JS injection, Blind NoSQLi, Firebase\n- **OS Command Injection** — Classic, Blind, Time-based blind, OOB, Argument injection\n- **SSTI** — Jinja2, Twig, Freemarker, Velocity, Smarty, Pebble, ERB, Handlebars, Mako\n- **LDAP Injection** — Filter, Attribute, DN, Blind\n- **XPath Injection** — Classic, Blind, OOB\n- **EL / OGNL Injection** — Spring EL, OGNL (Struts), JSP EL, JSF EL, Groovy\n- **XML Injection** — Tag, CDATA, XSL, Schema injection\n- **HTML Injection** — Stored, Reflected, DOM-based\n- **CRLF / HTTP Header Injection** — Response splitting, Log injection, Cookie injection, Redirect\n- **SMTP Injection** — CC/BCC, Subject, Body, MIME header\n- **Code Injection** — PHP eval, Python exec, Ruby eval, Node eval, Perl eval\n- **ORM Injection** — HQL (Hibernate), ActiveRecord, Doctrine DQL, Prisma type confusion\n- **JSON Injection** — Key injection, Nested object, Array manipulation, NoSQL operator via JSON\n- **Prompt Injection** — Direct, Indirect, Goal hijacking, Context manipulation, Jailbreaking, Data exfiltration\n\n### CAT-02 · Broken Access Control · CRITICAL\n- **IDOR** — Numeric, Hash/GUID, Indirect, Chained, Blind, HTTP method switch\n- **Path / Directory Traversal** — Classic (../), URL-encoded, Double-encoded, UTF-8, Windows (..\\\\), Null byte\n- **Privilege Escalation** — Horizontal, Vertical, Role parameter, Admin direct access\n- **Forced Browsing** — Unlinked resource, Predictable URL, Backup file exposure\n- **Missing Function Level Access Control** — Hidden admin, API endpoint without auth, Unpublished endpoint\n- **Parameter Tampering** — Cookie, Hidden field, URL parameter, JSON body\n- **Mass Assignment** — Rails, Spring MVC, Django, JavaScript object injection\n- **Open Redirect** — URL-based, Header-based, JavaScript, Meta refresh\n\n### CAT-03 · XSS & Client-Side · HIGH\n- **Reflected XSS** — Classic, Attribute context, JS context, URL context, CSS context, JSON response\n- **Stored XSS** — Comment/forum, Profile field, File upload (SVG/HTML), DOM stored, Second-order\n- **DOM-Based XSS** — document.write, innerHTML, window.location, eval(), postMessage, location.hash\n- **Blind XSS** — Admin panel, Log viewer, PDF export, Email template\n- **Mutation XSS (mXSS)** — innerHTML, DOMPurify bypass, HTML parser differential\n- **Universal XSS (UXSS)** — Browser extension, SOP bypass\n- **CSP Bypass** — JSONP endpoint, Nonce bypass (bfcache), Angular/React bypass, Script gadget, Trusted Types, Base URI\n- **Prototype Pollution → XSS** — Client-side PP, Library gadget chain\n- **Dangling Markup** — img src, a href, form action\n- **XSSI** — JSON hijacking, Callback XSSI, Dynamic JS XSSI\n\n### CAT-04 · Authentication & Session · CRITICAL\n- **Credential Attacks** — Brute force, Credential stuffing, Password spraying, Dictionary, Rainbow table\n- **Session Hijacking** — Cookie theft via XSS, Session fixation, Session prediction, Cookie tossing, Insecure cookie attributes\n- **JWT Attacks** — alg:none, RS256→HS256 confusion, kid injection (SQL/Path), jku/jwks injection, Weak secret brute force, Expiry bypass, Embedded JWK\n- **Password Reset Attacks** — Token predictability, Host header injection, Dangling markup, Account enumeration, Race condition on token\n- **MFA Bypass** — TOTP brute force, Response manipulation, Backup code abuse, OAuth flow bypass, SIM swapping\n- **Authentication Bypass** — SQL auth bypass, HTTP response manipulation, Type confusion, Null byte, Parameter pollution\n- **Account Enumeration** — Login error, Registration, Password reset, Timing-based\n\n### CAT-05 · SSRF · CRITICAL\n- **Basic SSRF** — Internal IP probing, Localhost service access, Cloud metadata (AWS IMDSv1), Cloud metadata (GCP/Azure), Internal service discovery\n- **Blind SSRF** — DNS-based OOB, HTTP-based, Time-based, Error-differential\n- **SSRF via Protocol Smuggling** — file://, gopher://, dict://, ftp://, ldap://, sftp://\n- **SSRF Filter Bypass** — IP encoding, DNS rebinding, URL shortener, Redirect-based, IPv6, HTTPS downgrade\n- **SSRF → RCE Chains** — Redis, Memcached, IMDSv1→credentials→RCE, Internal admin→RCE, Kubernetes API\n\n### CAT-06 · Security Misconfiguration · HIGH\n- Default credentials, CORS misconfiguration, HTTP security headers, Cloud storage, Debug/error exposure, Directory listing, Sensitive file exposure\n\n### CAT-07 · Cryptographic Attacks · HIGH\n- Padding oracle, Protocol downgrade (BEAST/CRIME/DROWN/FREAK/Logjam/Sweet32), Hash/MAC attacks, Timing attacks, Block cipher mode attacks, JWT cryptographic\n\n### CAT-08 · Insecure Deserialization · CRITICAL\n- Java (CommonsCollections, Spring, BeanUtils, JBoss, WebLogic, Groovy, JNDI)\n- PHP Object Injection (wakeup, destruct, POP chain, Phar)\n- Python (pickle, PyYAML, marshal)\n- Ruby Marshal\n- .NET (BinaryFormatter, DataContractSerializer, ViewState, JSON.NET)\n- Node.js (node-serialize, serialize-javascript, __proto__)\n- YAML/XML (SnakeYAML, PyYAML, XStream, Jackson)\n\n### CAT-09 · File & Resource Manipulation · HIGH\n- File upload attacks, LFI, RFI, XXE (all variants), Archive/path traversal\n\n### CAT-10 · Business Logic · HIGH\n- Price/value manipulation, Workflow bypass, Race condition logic, Feature/API misuse, ATO via logic\n\n### CAT-11 · HTTP Protocol Attacks · HIGH\n- HTTP Request Smuggling (CL.TE, TE.CL, TE.TE, H2.CL, H2.TE, CL.0, Chunked extension, Response queue poisoning)\n- Web Cache Poisoning, Web Cache Deception, HPP, Host Header Injection, HTTP Method abuse\n\n### CAT-12 · API Security · CRITICAL\n- BOLA, Broken function level auth, Excessive data exposure, Mass assignment via API, Rate limit bypass, Credential leakage, GraphQL attacks\n\n### CAT-13 · OAuth & Identity · CRITICAL\n- OAuth 2.0 attacks, OIDC attacks, SAML attacks, Account takeover via identity flows\n\n### CAT-14 · WebSocket Attacks · MEDIUM\n- CSWSH, Message injection, Auth/session attacks, DoS\n\n### CAT-15 · Prototype Pollution · HIGH\n- Client-side PP, Server-side PP, PP → gadget chains, Class pollution\n\n### CAT-16 · Race Conditions · HIGH\n- TOCTOU, Limit override, Double spend, Parallel request techniques\n\n### CAT-17 · Information Disclosure · MEDIUM\n- Error-based disclosure, Timing side channels, XS-Leaks, Source/config exposure, API spec exposure\n\n### CAT-18 · Clickjacking & UI Redress · MEDIUM\n- Classic clickjacking, Advanced (SVG filter, extension), UI redress variants\n\n### CAT-19 · Supply Chain · HIGH\n- Dependency attacks, Build system compromise, CDN/third-party script attacks\n\n### CAT-20 · Application DoS · MEDIUM\n- ReDoS, XML/JSON/archive bombs, Application logic DoS, Slow HTTP attacks, CPDoS\n\n### CAT-21 · CSRF · MEDIUM\n- Classic CSRF, Login CSRF, CSRF token bypass, Same-site gadget chains\n\n### CAT-22 · Emerging Attacks · HIGH\n- HTTP/2 & HTTP/3 attacks, Subdomain takeover, DNS rebinding, SMTP smuggling, Browser/platform side channels\n\n</details>\n\n---\n\n## Machine-Readable Taxonomy (JSON)\n\n<details>\n<summary><code>taxonomy.json — Full taxonomy for AI agents</code></summary>\n\n```json\n{\n  \"schema_version\": \"1.0\",\n  \"domain\": \"web_application\",\n  \"total_categories\": 22,\n  \"total_types\": 133,\n  \"total_subtypes\": 665,\n  \"categories\": [\n    {\n      \"id\": \"CAT-01\",\n      \"name\": \"Injection Attacks\",\n      \"severity\": \"CRITICAL\",\n      \"owasp_top10_2025\": \"A05\",\n      \"cwe_primary\": [\"CWE-74\", \"CWE-89\", \"CWE-78\", \"CWE-90\", \"CWE-94\", \"CWE-917\"],\n      \"capec\": [\"CAPEC-152\"],\n      \"type_count\": 15,\n      \"types\": [\n        {\n          \"id\": \"CAT-01-T01\",\n          \"name\": \"SQL Injection\",\n          \"cwe\": [\"CWE-89\"],\n          \"capec\": [\"CAPEC-66\"],\n          \"subtypes\": [\n            {\"id\": \"CAT-01-T01-S01\", \"name\": \"Classic / In-Band SQLi\"},\n            {\"id\": \"CAT-01-T01-S02\", \"name\": \"Error-Based SQLi\"},\n            {\"id\": \"CAT-01-T01-S03\", \"name\": \"Union-Based SQLi\"},\n            {\"id\": \"CAT-01-T01-S04\", \"name\": \"Boolean-Based Blind SQLi\"},\n            {\"id\": \"CAT-01-T01-S05\", \"name\": \"Time-Based Blind SQLi\"},\n            {\"id\": \"CAT-01-T01-S06\", \"name\": \"Out-of-Band SQLi\"},\n            {\"id\": \"CAT-01-T01-S07\", \"name\": \"Second-Order SQLi\"},\n            {\"id\": \"CAT-01-T01-S08\", \"name\": \"Stacked Queries SQLi\"},\n            {\"id\": \"CAT-01-T01-S09\", \"name\": \"JSON-Context SQLi\"},\n            {\"id\": \"CAT-01-T01-S10\", \"name\": \"XML-Context SQLi\"},\n            {\"id\": \"CAT-01-T01-S11\", \" rmed January 2026, 515,000+ applications)\n- OWASP WSTG 4.2\n- CAPEC Mechanisms of Attack (MITRE)\n- CWE Database (MITRE)\n- PortSwigger Web Security Research 2024/2025\n- NIST NVD\n\n---\n\n## Planned\n\n| Version | Content |\n|---------|---------|\n| v0.2.0 | CAT-01 SQLi — All 6 subtypes (full depth) |\n| v0.3.0 | CAT-01 SSTI — All 9 template engines |\n| v0.4.0 | CAT-11 HTTP Request Smuggling — All variants |\n| v0.5.0 | CAT-05 SSRF — Full coverage + cloud chains |\n| v0.6.0 | CAT-04 JWT Attacks — Algorithm confusion deep dive |\n| v1.0.0 | CAT-01 through CAT-05 fully complete |\n| v2.0.0 | Mobile Application Phase 2 launch |\n", "tools": "<div align=\"center\">\n\n![Tools Index](https://img.shields.io/badge/GORGE-Tools%20Index-333333?style=for-the-badge&labelColor=0d0d0d)\n\n</div>\n\n# Tools Index\n\n> All offensive security tools referenced in this database, organized by category. Each entry includes install instructions and a key usage command. Updated as new tools are added per attack subtype.\n\n---\n\n## Injection\n\n| Tool | Category | Purpose | Install |\n|------|---------|---------|---------|\n| [sqlmap](https://sqlmap.org) | SQLi | Automated SQL injection detection & exploitation | `pip install sqlmap` |\n| [SQLNinja](http://sqlninja.sourceforge.net) | SQLi | MSSQL-focused SQLi exploitation | Package managers |\n| [NoSQLMap](https://github.com/codingo/NoSQLMap) | NoSQLi | Automated NoSQL injection & exploitation | `pip install nosqlmap` |\n| [commix](https://github.com/commixproject/commix) | CMDi | Automated command injection & exploitation | `pip install commix` |\n| [tplmap](https://github.com/epinna/tplmap) | SSTI | Server-side template injection detection | `pip install tplmap` |\n| [SSTImap](https://github.com/vladko312/SSTImap) | SSTI | Modern SSTI scanner (supports more engines) | `pip install sstimap` |\n\n---\n\n## Scanners & Proxies\n\n| Tool | Purpose | Install |\n|------|---------|---------|\n| [Burp Suite Pro](https://portswigger.net/burp //github.com/danielmiessler/SecLists) |\n| PayloadsAllTheThings | Payloads for every attack type | [github.com/swisskyrepo/PayloadsAllTheThings](https://github.com/swisskyrepo/PayloadsAllTheThings) |\n| FuzzDB | Attack patterns and payloads | [github.com/fuzzdb-project/fuzzdb](https://github.com/fuzzdb-project/fuzzdb) |\n| IntruderPayloads | Burp Suite intruder payload lists | [github.com/1N3/IntruderPayloads](https://github.com/1N3/IntruderPayloads) |\n", "labs": "<div align=\"center\">\n\n![Lab Environments](https://img.shields.io/badge/GORGE-Lab%20Environments-333333?style=for-the-badge&labelColor=0d0d0d)\n\n</div>\n\n# Lab Environments\n\n> Practice environments for every attack category in this database. No theory without practice.\n\n---\n\n## Online Platforms (No Setup Required)\n\n| Platform | Best For | URL | Cost |\n|---------|---------|-----|------|\n| **PortSwigger Web Security Academy** | Web attacks — all categories, lab-aligned with research | [portswigger.net/web-security](https://portswigger.net/web-security) | Free |\n| **HackTheBox** | Real-world machines, CTF-style, active community | [hackthebox.com](https://hackthebox.com) | Free / Pro |\n| **TryHackMe** | Guided learning paths, beginner-friendly | [tryhackme.com](https://tryhackme.com) | Free / Pro |\n| **PentesterLab** | Web-specific, badge-based, good for injection | [pentesterlab.com](https://pentesterlab.com) | Free / Pro |\n| **OWASP WebGoat** | Deliberately insecure — all OWASP top 10 | [webgoat.github.io](https://webgoat.github.io) | Free |\n| **Root Me** | Challenges across many categories | [root-me.org](https://root-me.org) | Free |\n| **BugBountyHunter** | Real-world web app labs | [bugbountyhunter.com](https://bugbountyhunter.com) | Free / Pro |\n\n---\n\n## Self-Hosted Vulnerable Apps\n\n| App | Covers | Setup |\n|-----|--------|-------|\n| **DVWA** (Damn Vulnerable Web App) | SQLi, XSS, CSRF, File inclusion, Command injection | `docker run -p 80:80 vulnerables/web-dvwa` |\n| **bW zation\n- [PortSwigger Deserialization Labs](https://portswigger.net/web-security/deserialization) — Java, PHP, custom gadget chains\n\n### OAuth / JWT\n- [PortSwigger OAuth Labs](https://portswigger.net/web-security/oauth)\n- [PortSwigger JWT Labs](https://portswigger.net/web-security/jwt)\n\n---\n\n## CTF Platforms (Competitive)\n\n| Platform | Style | URL |\n|---------|-------|-----|\n| CTFtime | Upcoming CTF event tracker | [ctftime.org](https://ctftime.org) |\n| picoCTF | Educational, beginner-friendly | [picoctf.org](https://picoctf.org) |\n| pwn.college | Systematic skill development | [pwn.college](https://pwn.college) |\n| HackTheBox CTF | Active competition labs | [hackthebox.com](https://hackthebox.com) |\n\n---\n\n## Bug Bounty Programs (Real-World Practice)\n\nFor legal real-world practice on production applications:\n\n| Program | Scope | Platform |\n|---------|-------|---------|\n| HackerOne Public Programs | Wide scope | [hackerone.com](https://hackerone.com/bug-bounty-programs) |\n| Bugcrowd Public Programs | Wide scope | [bugcrowd.com/programs](https://bugcrowd.com/programs) |\n| Intigriti Public Programs | EU-focused | [intigriti.com](https://app.intigriti.com/programs) |\n| YesWeHack | EU-focused | [yeswehack.com](https://www.yeswehack.com) |\n| Open Bug Bounty | Non-intrusive XSS / CSRF only | [openbugbounty.org](https://www.openbugbounty.org) |\n\n> Always read program scope and rules before testing. Testing outside scope is illegal.\n"}};


var currentFilter = "all";
var currentPage = "home";

function initApp() {
  mermaid.initialize({
    startOnLoad: false,
    theme: "dark",
    themeVariables: {
      background: "#0d0d0d",
      primaryColor: "#cc0000",
      lineColor: "#cc0000",
      primaryTextColor: "#cccccc",
      secondaryTextColor: "#999999",
      tertiaryColor: "#1a1a1a"
    }
  });
  marked.setOptions({
    highlight: function(code, lang) {
      if (lang && hljs.getLanguage(lang)) {
        return hljs.highlight(code, {language: lang}).value;
      }
      return hljs.highlightAuto(code).value;
    },
    breaks: false,
    gfm: true
  });
  buildSidebar();
  initRouter();
  initSearch();
}

function buildSidebar() {
  var container = document.getElementById("sidebarCategories");
  var html = "";
  for (var i = 0; i < GORGE.categories.length; i++) {
    var cat = GORGE.categories[i];
    var bc = "badge-" + cat.severity.toLowerCase();
    html += "<div class=\"sidebar-cat-group\" data-severity=\"" + cat.severity + "\">";
    html += "<div class=\"sidebar-item\" data-slug=\"" + cat.slug + "\" onclick=\"handleSidebarClick('" + cat.slug + "',this)\">";
    html += "<span class=\"sidebar-arrow\" id=\"arrow-" + cat.slug + "\">&#9654;</span>";
    html += "<span class=\"sidebar-id\">" + cat.id + "</span>";
    html += "<span class=\"sidebar-name\">" + cat.name + "</span>";
    html += "<span class=\"sidebar-badge " + bc + "\">" + cat.severity + "</span>";
    html += "</div>";
    html += "<div class=\"sidebar-sub-items\" id=\"sub-" + cat.slug + "\">";
    for (var j = 0; j < cat.types.length; j++) {
      html += "<div class=\"sidebar-sub-item\">" + escapeHtml(cat.types[j]) + "</div>";
    }
    html += "</div></div>";
  }
  container.innerHTML = html;
}

function handleSidebarClick(slug, el) {
  var sub = document.getElementById("sub-" + slug);
  var arrow = document.getElementById("arrow-" + slug);
  if (sub.classList.contains("expanded")) {
    sub.classList.remove("expanded");
    arrow.classList.remove("expanded");
  } else {
    sub.classList.add("expanded");
    arrow.classList.add("expanded");
  }
  navigateTo(slug);
}

function filterSeverity(severity, btn) {
  currentFilter = severity;
  var btns = document.querySelectorAll(".filter-btn");
  for (var i = 0; i < btns.length; i++) btns[i].classList.remove("active");
  btn.classList.add("active");
  var groups = document.querySelectorAll(".sidebar-cat-group");
  for (var i = 0; i < groups.length; i++) {
    groups[i].style.display = (severity === "all" || groups[i].getAttribute("data-severity") === severity) ? "block" : "none";
  }
  if (currentPage === "home") renderHomePage();
}

function navigateTo(page) {
  window.location.hash = "#" + page;
}

function initRouter() {
  window.addEventListener("hashchange", handleRoute);
  handleRoute();
}

function handleRoute() {
  var hash = window.location.hash.replace("#", "") || "home";
  currentPage = hash;
  updateSidebarActive(hash);
  renderPage(hash);
  window.scrollTo(0, 0);
  var sidebar = document.getElementById("sidebar");
  if (sidebar.classList.contains("open")) sidebar.classList.remove("open");
}

function updateSidebarActive(hash) {
  var items = document.querySelectorAll(".sidebar-item");
  for (var i = 0; i < items.length; i++) {
    items[i].classList.remove("active");
    if (items[i].getAttribute("data-slug") === hash) items[i].classList.add("active");
  }
  var metas = document.querySelectorAll(".sidebar-meta-item");
  for (var i = 0; i < metas.length; i++) {
    metas[i].classList.remove("active");
    var t = metas[i].textContent.trim().toLowerCase();
    if ((t === "tools index" && hash === "tools") || (t === "lab environments" && hash === "labs") ||
        (t === "taxonomy" && hash === "taxonomy") || (t === "about" && hash === "about") ||
        (t === "changelog" && hash === "changelog")) {
      metas[i].classList.add("active");
    }
  }
}

function renderPage(hash) {
  if (hash === "home") { document.title = "GORGE | Vulnerability Database"; renderHomePage(); }
  else if (hash === "about") { document.title = "GORGE | About"; renderMarkdownPage(GORGE.pages.about); }
  else if (hash === "taxonomy") { document.title = "GORGE | Taxonomy"; renderMarkdownPage(GORGE.pages.taxonomy); }
  else if (hash === "changelog") { document.title = "GORGE | Changelog"; renderMarkdownPage(GORGE.pages.changelog); }
  else if (hash === "tools") { document.title = "GORGE | Tools Index"; renderMarkdownPage(GORGE.pages.tools); }
  else if (hash === "labs") { document.title = "GORGE | Lab Environments"; renderMarkdownPage(GORGE.pages.labs); }
  else {
    var cat = findCategory(hash);
    if (cat) { document.title = "GORGE | " + cat.id + " " + cat.name; renderCategoryPage(cat); }
    else {
      document.title = "GORGE | Not Found";
      document.getElementById("mainContent").innerHTML = '<div class="breadcrumb"><a href="#home">Home</a></div><h1 style="color:var(--text-muted);margin-top:40px;">Page not found</h1>';
    }
  }
}

function findCategory(slug) {
  for (var i = 0; i < GORGE.categories.length; i++) {
    if (GORGE.categories[i].slug === slug) return GORGE.categories[i];
  }
  return null;
}

  h += "<div class=\"stat-card\"><div class=\"stat-number\">665+</div><div class=\"stat-label\">Subtypes</div></div>";
  h += "<div class=\"stat-card\"><div class=\"stat-number\">WEB</div><div class=\"stat-label\">APP</div></div>";
  h += "</div>";
  var vc = 0;
  for (var i = 0; i < GORGE.categories.length; i++) {
    if (currentFilter === "all" || GORGE.categories[i].severity === currentFilter) vc++;
  }
  h += "<div class=\"filter-row\">";
  h += "<button class=\"filter-btn" + (currentFilter === "all" ? " active" : "") + "\" onclick=\"filterSeverity('all',this)\">All</button>";
  h += "<button class=\"filter-btn" + (currentFilter === "CRITICAL" ? " active" : "") + "\" onclick=\"filterSeverity('CRITICAL',this)\">Critical</button>";
  h += "<button class=\"filter-btn" + (currentFilter === "HIGH" ? " active" : "") + "\" onclick=\"filterSeverity('HIGH',this)\">High</button>";
  h += "<button class=\"filter-btn" + (currentFilter === "MEDIUM" ? " active" : "") + "\" onclick=\"filterSeverity('MEDIUM',this)\">Medium</button>";
  h += "<span class=\"filter-count\">Showing " + vc + " of 22 categories</span>";
  h += "</div>";
  for (var i = 0; i < GORGE.categories.length; i++) {
    var cat = GORGE.categories[i];
    if (currentFilter !== "all" && cat.severity !== currentFilter) continue;
    var bc = "badge-" + cat.severity.toLowerCase();
    h += "<div class=\"category-card\">";
    h += "<div class=\"category-card-header\" onclick=\"toggleCategoryCard('" + cat.slug + "')\">";
    h += "<span class=\"cat-card-id\">" + cat.id + "</span>";
    h += "<span class=\"cat-card-name\">" + cat.name + "</span>";
    h += "<span class=\"" + bc + "\">" + cat.severity + "</span>";
    h += "<span class=\"cat-card-types\">" + cat.typeCount + " types</span>";
    h += "<span class=\"cat-card-arrow\" id=\"card-arrow-" + cat.slug + "\">&#9654;</span>";
    h += "</div>";
    h += "<div class=\"category-card-body\" id=\"card-body-" + cat.slug + "\">";
    h += "<ul class=\"cat-subtype-list\">";
    for (var j = 0; j < cat.types.length; j++) {
      h += "<li class=\"cat-subtype-item\">" + escapeHtml(cat.types[j]) + "</li>";
    }
    h += "</ul>";
    h += "<div style=\"margin-top:12px\"><a href=\"#" + cat.slug + "\" style=\"color:var(--red);font-size:12px;text-decoration:none;\">View full category &#8594;</a></div>";
    h += "</div></div>";
  }
  main.innerHTML = h;
}

function toggleCategoryCard(slug) {
  var body = document.getElementById("card-body-" + slug);
  var arrow = document.getElementById("card-arrow-" + slug);
  if (body.classList.contains("expanded")) {
    body.classList.remove("expanded");
    arrow.classList.remove("expanded");
  } else {
    body.classList.add("expanded");
    arrow.classList.add("expanded");
  }
}

function renderCategoryPage(cat) {
  var main = document.getElementById("mainContent");
  var bc = "badge-" + cat.severity.toLowerCase();
  var h = "";
  h += "<div class=\"breadcrumb\"><a href=\"#home\">Home</a> &gt; <span>" + cat.id + "</span> &gt; <span>" + cat.name + "</span></div>";
  h += "<div class=\"page-header-id\">" + cat.id + "</div>";
  h += "<h1 class=\"page-header-title\">" + cat.name + "</h1>";
  h += "<div class=\"page-header-badges\">";
  h += "<span class=\"" + bc + "\">" + cat.severity + "</span>";
  h += "<span class=\"badge-high\" style=\"background:var(--border);color:var(--text-muted)\">" + cat.typeCount + " types</span>";
  h += "</div>";
  h += "<div class=\"md-content\" id=\"mdContent\">" + renderMarkdown(cat.content) + "</div>";
  main.innerHTML = h;
  postRender();
}

function renderMarkdownPage(content) {
  var main = document.getElementById("mainContent");
  var h = "<div class=\"breadcrumb\"><a href=\"#home\">Home</a></div>";
  h += "<div class=\"md-content\" id=\"mdContent\">" + renderMarkdown(content) + "</div>";
  main.innerHTML = h;
  postRender();
}

function renderMarkdown(text) {
  var processed = text.replace(/```mermaid\n([\s\S]*?)```/g, function(match, code) {
    return "<div class=\"mermaid\">" + escapeHtml(code) + "</div>";
  });
  return marked.parse(processed);
}

function escapeHtml(str) {
  return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
}

function postRender() {
  var pres = document.querySelectorAll(".md-content pre");
  for (var i = 0; i < pres.length; i++) {
    if (pres[i].querySelector(".copy-btn")) continue;
    var btn = document.createElement("button");
    btn.className = "copy-btn";
    btn.textContent = "copy";
    (function(pre, b) {
      b.onclick = function() {
        var code = pre.querySelector("code");
        var text = code ? code.textContent : pre.textContent;
        navigator.clipboard.writeText(text).then(function() {
          b.textContent = "copied";
          setTimeout(function() { b.textContent = "copy"; }, 1500);
        });
      };
    })(pres[i], btn);
    pres[i].style.position = "relative";
    pres[i].appendChild(btn);
  }
  var els = document.querySelectorAll(".mermaid");
  if (els.length > 0) {
    try { mermaid.run({nodes: els}); } catch(e) {}
  }
}

function initSearch() {
  var input = document.getElementById("searchInput");
  var timer = null;
  input.addEventListener("keyup", function(e) {
    if (e.key === "Escape") { input.value = ""; handleRoute(); return; }
    clearTimeout(timer);
    timer = setTimeout(function() {
      var q = input.value.trim();
      if (q.length < 2) { handleRoute(); return; }
      handleSearch(q);
    }, 150);
  });
}

function handleSearch(query) {
  var results = [];
  var lq = query.toLowerCase();
  for (var i = 0; i < GORGE.categories.length; i++) {
    var cat = GORGE.categories[i];
    var cm = cat.name.toLowerCase().indexOf(lq) !== -1 || cat.id.toLowerCase().indexOf(lq) !== -1;
    if (cm) results.push({type: "category", cat: cat, match: cat.name});
    for (var j = 0; j < cat.types.length; j++) {
      if (cat.types[j].toLowerCase().indexOf(lq) !== -1) {
        results.push({type: "atype", cat: cat, match: cat.types[j]});
      }
    }
    if (cat.content.toLowerCase().indexOf(lq) !== -1 && !cm) {
      var idx = cat.content.toLowerCase().indexOf(lq);
      var s = Math.max(0, idx - 40);
      var e = Math.min(cat.content.length, idx + query.length + 40);
      var snip = (s > 0 ? "..." : "") + cat.content.substring(s, e) + (e < cat.content.length ? "..." : "");
      results.push({type: "content", cat: cat, match: cat.name, snippet: snip});
    }
  }
  var pks = ["home","about","taxonomy","changelog","tools","labs"];
  var pns = {home:"Home",about:"About",taxonomy:"Taxonomy",changelog:"Changelog",tools:"Tools Index",labs:"Lab Environments"};
  for (var k = 0; k < pks.length; k++) {
    var key = pks[k];
    var pc = GORGE.pages[key];
    if (pc.toLowerCase().indexOf(lq) !== -1) {
      var idx = pc.toLowerCase().indexOf(lq);
      var s = Math.max(0, idx - 40);
      var e = Math.min(pc.length, idx + query.length + 40);
      var snip = (s > 0 ? "..." : "") + pc.substring(s, e) + (e < pc.length ? "..." : "");
      results.push({type: "page", page: key, match: pns[key], snippet: snip});
    }
  }
  renderSearchResults(query, results);
}

function renderSearchResults(query, results) {
  var main = document.getElementById("mainContent");
  document.title = "GORGE | Search: " + query;
  var h = "<div class=\"search-header\">" + results.length + " result" + (results.length !== 1 ? "s" : "") + " for \"<mark>" + escapeHtml(query) + "</mark>\"</div>";
  if (results.length === 0) {
    h += "<p style=\"color:var(--text-muted);margin-top:20px\">No matches found. Try a different search term.</p>";
    main.innerHTML = h;
    return;
  }
  var cats = [], types = [], conts = [], pages = [];
  for (var i = 0; i < results.length; i++) {
    var r = results[i];
    if (r.type === "category") cats.push(r);
    else if (r.type === "atype") types.push(r);
    else if (r.type === "content") conts.push(r);
    else if (r.type === "page") pages.push(r);
  }
  if (cats.length > 0) {
    h += "<div class=\"search-result-group\"><div class=\"search-result-group-title\">Categories</div>";
    for (var i = 0; i < cats.length; i++) {
      var r = cats[i];
      var bc = "badge-" + r.cat.severity.toLowerCase();
      h += "<div class=\"search-result\" onclick=\"navigateTo('" + r.cat.slug + "')\">";
      h += "<div class=\"search-result-name\">" + highlightMatch(r.cat.name, query) + " <span class=\"" + bc + "\">" + r.cat.severity + "</span></div>";
      h += "<div class=\"search-result-path\">" + r.cat.id + " &middot; " + r.cat.typeCount + " types</div></div>";
    }
    h += "</div>";
  }
  if (types.length > 0) {
    h += "<div class=\"search-result-group\"><div class=\"search-result-group-title\">Attack Types</div>";
    for (var i = 0; i < types.length; i++) {
      var r = types[i];
      h += "<div class=\"search-result\" onclick=\"navigateTo('" + r.cat.slug + "')\">";
      h += "<div class=\"search-result-name\">" + highlightMatch(r.match, query) + "</div>";
      h += "<div class=\"search-result-path\">" + r.cat.id + " &middot; " + r.cat.name + "</div></div>";
    }
    h += "</div>";
  }
  if (conts.length > 0) {
    h += "<div class=\"search-result-group\"><div class=\"search-result-group-title\">Content Matches</div>";
    for (var i = 0; i < conts.length; i++) {
      var r = conts[i];
      h += "<div class=\"search-result\" onclick=\"navigateTo('" + r.cat.slug + "')\">";
      h += "<div class=\"search-result-name\">" + r.cat.name + "</div>";
      h += "<div class=\"search-result-path\">" + highlightMatch(r.snippet, query) + "</div></div>";
    }
    h += "</div>";
  }
  if (pages.length > 0) {
    h += "<div class=\"search-result-group\"><div class=\"search-result-group-title\">Pages</div>";
    for (var i = 0; i < pages.length; i++) {
      var r = pages[i];
      h += "<div class=\"search-result\" onclick=\"navigateTo('" + r.page + "')\">";
      h += "<div class=\"search-result-name\">" + highlightMatch(r.match, query) + "</div>";
      h += "<div class=\"search-result-path\">" + highlightMatch(r.snippet, query) + "</div></div>";
    }
    h += "</div>";
  }
  main.innerHTML = h;
}

function highlightMatch(text, query) {
  if (!query) return escapeHtml(text);
  var esc = escapeHtml(text);
  var re = new RegExp("(" + escapeRegex(escapeHtml(query)) + ")", "gi");
  return esc.replace(re, "<mark>$1</mark>");
}

function escapeRegex(str) {
  return str.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
}

function toggleSidebar() {
  document.getElementById("sidebar").classList.toggle("open");
}

initApp();

})();
</script>
</body>
</html>
